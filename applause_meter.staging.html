<script>
/* ================================================================
   TABLE DES MATIERES
   ================================================================
   - Accueil / AppProf      accueil + orchestrateur onglets prof
   - CourbePassage / ModalePassage courbe + detail d'un passage
   - AjoutManuelFile        ajout manuel a la file spontanee
   - OngletPilotage         pilotage seance (a decouper palier 6)
   - OngletClasses / OngletReglages gestion classes + reglages
   - calcPhase / meterSegs  helpers de phase + segments de barre
   - VueBoard               tableau projete (renderPhase palier 3)
   - FormConnexion / AppEleve cote eleve : connexion + app
   - PhaseVote / VoteFormulaire / PhaseBilan phases eleve
   - PanneauSpontane        inscription lecture spontanee
   - EleveVote              ecran eleve (renderPhase fait; decoupe palier 7)
   - ModaleCheckIn / OverlayQRPhone check-in + QR
   - PhonePilot / CodeGate / App vues + gate + routeur
   - FbBanner / Root / ErrorBoundary banniere + montage + garde-fou
   ================================================================ */

// ════════════ ACCUEIL ════════════
function Accueil(p){
  var sb=useState(false), busy=sb[0], setBusy=sb[1];
  var se=useState(""), testErr=se[0], setTestErr=se[1];
  // Le semis n'a lieu QU'APRÈS vérification que les six clés fictives sont libres.
  // En cas de collision : refus motivé, et rien n'est écrit.
  function lancerTest(){
    if(busy) return;
    setTestErr(""); setBusy(true);
    clesFictivesLibres(db).then(function(v){
      if(!v.libres){
        setBusy(false);
        setTestErr("Le mode test n'a pas démarré et rien n'a été écrit : "
          + v.collisions.map(function(c){ return c.cle+" → "+c.ou+(c.refus?" ("+c.refus+")":""); }).join(" · ")
          + ". Une identité du jeu de test correspond à une identité réelle : le jeu de test doit changer avant tout semis.");
        return null;
      }
      // résidus d'un test précédent : nettoyés AVANT de semer (et pas seulement à la sortie)
      return purgeTestMJPC(db, {volatils:true}).then(function(pg){
        if(!pg.ok) throw {message:"nettoyage des résidus incomplet — "+pg.refus.map(function(x){return x.chemin+" : "+x.message;}).join(" · ")};
        return db.ref(DB_ROOT+"/tablettes").remove();
      }).then(function(){
        return ecrireClasse(db, TEST_SLUG, TEST_ELEVES.slice(), {nom:"⚙️ Classe TEST"});   // transaction non destructive (socle)
      }).then(function(){
        return db.ref(DB_ROOT+"/session").update({classeSlug:TEST_SLUG, reader:"", reglages:REGLAGES_DEFAUT, startedAt:null, demarreeLe:Date.now(), absents:[], passageId:"", messageFinIdx:null, pauseStartedAt:null, pausedDuration:0, phaseLockee:null, sessionId:null, modeTest:true, codesTest:codesTestMJPC()});
      }).then(function(){
        setBusy(false);
        p.onTest();                                 // badge + drapeau, alignés sur la session persistée
        p.go("prof");                               // entre directement dans le panneau prof
      });
    }).catch(function(e){
      setBusy(false);
      setTestErr("Le mode test n'a pas pu démarrer : "+((e&&e.message)||"erreur inconnue")+".");
    });
  }
  return h("div",{className:"accueil"},
    h("div",{className:"clap"},"👏"),
    h("h1",null,"L'Applaudimètre"),
    h("p",{className:"sub"},"La lecture à voix haute encouragée en direct par toute la classe."),
    p.test && h("span",{className:"badge badge-test"},"MODE TEST ACTIF"),
    h("button",{className:"btn-accueil btn-prof",onClick:function(){p.go("prof");},
      title:"Pilotage prof : choisir la classe, démarrer la séance, désigner les lecteurs, gérer le vote et le bilan. Protégé par code."},
      "🧑‍🏫 Panneau professeur"),
    h("button",{className:"btn-accueil btn-board",onClick:function(){p.go("board");},
      title:"Projection au tableau : barres applaudimètre, chrono, paillettes de fin. À mettre sur le vidéoprojecteur. Protégé par code."},
      "📺 Vue tableau (projection)"),
    h("button",{className:"btn-accueil btn-eleve",style:{marginBottom:10},onClick:function(){p.go("mesLectures");},
      title:"Hors séance : retrouve les passages que tu as déjà lus. Demande ton nom, ton prénom et ton code personnel."},
      "📖 Mes lectures"),
    h("button",{className:"btn-accueil btn-eleve",onClick:function(){p.go("eleve");},
      title:"Tablette élève : choisir un numéro de table, taper NOM+Prénom, applaudir pendant la lecture, voter au tour de l'évaluation."},
      "👏 Tablette élève"),
    h("button",{className:"btn-ghost",style:{marginTop:8,padding:"10px 16px",borderRadius:10,opacity:busy?.6:1},onClick:lancerTest,disabled:busy,
      title:"Crée une classe fictive de 6 élèves inventés et active le mode test : applaudissements et votes simulés. Les identités fictives sont vérifiées contre les données réelles avant tout enregistrement."},
      busy? "⏳ Vérification des identités fictives…" : "⚙️ Mode test"),
    testErr? h("div",{style:{maxWidth:520,margin:"12px auto 0",padding:"11px 13px",background:"rgba(220,38,38,.12)",border:"1.5px solid var(--rouge)",borderRadius:10,fontSize:".86rem",lineHeight:1.45,textAlign:"left"}},testErr) : null
  );
}

// ════════════ PANNEAU PROFESSEUR ════════════
function AppProf(p){
  var st=useState("pilot"), tab=st[0], setTab=st[1];
  var sc=useState({}), classes=sc[0], setClasses=sc[1];
  var ss=useState(null), session=ss[0], setSession=ss[1];
  var sz=useState(""), zombiesInfo=sz[0], setZombiesInfo=sz[1];
  var sessRef=useRef(null); sessRef.current=session;      // le battement lit l'état courant, pas celui du montage
  // Présence du professeur : même contrat, clé réservée « prof ».
  useEffect(function(){
    return presenceBattement("prof", function(){
      var sn=sessRef.current;
      return {display:"Professeur", classe:"PROF", is_prof:true, vue:"panneau",
              seance:(sn&&sn.sessionId)||"", cle:"prof"};
    });
  },[]);
  // Nettoyage AU MONTAGE : les données fictives qu'un test précédent aurait laissées
  // partent dès l'ouverture du panneau, sans attendre un passage par « Quitter le test ».
  // Si un test est en cours, on ne touche à rien. Aucune donnée réelle n'est visée :
  // la purge ne cible que le drapeau test:true, la classe de test et les clés fictives.
  useEffect(function(){
    db.ref(DB_ROOT+"/session/modeTest").once("value").then(function(s){
      if(s.val()===true) return null;                    // test en cours : intouché
      return purgeTestMJPC(db, {}).then(function(pg){
        if(pg.chemins.length && pg.ok) setZombiesInfo("Résidus d'un test précédent nettoyés à l'ouverture ("+pg.chemins.length+" élément"+(pg.chemins.length>1?"s":"")+").");
        else if(!pg.ok) setZombiesInfo("Des résidus de test n'ont pas pu être supprimés : "+pg.refus.map(function(x){return x.chemin;}).join(", ")+".");
      });
    }).catch(function(){});
  },[]);
  useEffect(function(){
    publierManifeste(db);   // vue projetée pour la console MJPC (additive, ne casse jamais l'app)
    var r1=db.ref("classes"); var f1=r1.on("value",function(s){setClasses(s.val()||{});});
    var r2=db.ref(DB_ROOT+"/session"); var f2=r2.on("value",function(s){setSession(s.val()||{});});
    return function(){ r1.off("value",f1); r2.off("value",f2); };
  },[]);
  var reg = reglagesSafe(session&&session.reglages);

  return h("div",null,
    h("div",{className:"hdr"},
      h("button",{className:"btn-back",onClick:p.onBack,title:"Retour à l'écran d'accueil. La séance reste active en arrière-plan."},"← Accueil"),
      h("h2",null,"Panneau professeur"),
      p.test && h("button",{className:"btn-back",style:{background:"var(--rose)",color:"#fff",opacity:p.quitBusy?.6:1},onClick:p.onQuitTest,disabled:!!p.quitBusy,
        title:"Quitter le mode test : supprime toutes les données fictives (séances, passages, votes, files, compteurs, tablettes, classe) et vérifie chaque suppression."},
        p.quitBusy? "⏳ Suppression des données fictives…" : "⏏ Quitter le test")),
    p.quitErr? h("div",{style:{margin:"10px 14px 0",padding:"11px 13px",background:"rgba(220,38,38,.12)",border:"1.5px solid var(--rouge)",borderRadius:10,fontSize:".86rem",lineHeight:1.45}},p.quitErr) : null,
    zombiesInfo? h("div",{style:{margin:"10px 14px 0",padding:"9px 13px",background:"rgba(255,210,63,.16)",border:"1.5px dashed var(--jaune)",borderRadius:10,fontSize:".84rem",lineHeight:1.4}},zombiesInfo) : null,
    h("div",{className:"tabs"},
      ["pilot","classes","reglages"].map(function(t){
        var noms={pilot:"🎛️ Pilotage",classes:"👥 Classes",reglages:"🎚️ Réglages"};
        var tips={pilot:"Désigner les lecteurs, gérer la séance, ouvrir le vote, voir les archives.",
                  classes:"Créer ou supprimer les classes (liste d'élèves NOM Prénom).",
                  reglages:"Régler les barres, le minuteur, les critères et les compliments."};
        return h("button",{key:t,className:"tab"+(tab===t?" active":""),onClick:function(){setTab(t);},title:tips[t]},noms[t]);
      })),
    h("div",{className:"wrap"},
      tab==="pilot" && h(OngletPilotage,{classes:classes,session:session,reg:reg,test:p.test}),
      tab==="classes" && h(OngletClasses,{classes:classes}),
      tab==="reglages" && h(OngletReglages,{reg:reg})),
    h(HelpFab,{role:"prof"}));
}

// ════════════ MODALE DÉTAIL D'UN PASSAGE — courbe + bilan + checkpoints ════════════
// Palette étendue (max 8 critères)
var COURBE_COLORS=["#7c5cff","#3b82f6","#22c55e","#f59e0b","#ec4899","#14b8a6","#6366f1","#ef4444"];

function CourbePassage(p){
  // p.courbe = {s0:{c0,c1,...,cN-1}, s1:{...}}, p.criteres, p.dureeSec
  var crit=p.criteres||CRITERES_DEFAUT;
  var entries=Object.keys(p.courbe||{}).map(function(k){
    return {sec:parseInt(k.replace(/^s/,""),10), vals:p.courbe[k]};
  }).filter(function(e){return !isNaN(e.sec) && e.vals;}).sort(function(a,b){return a.sec-b.sec;});
  if(!entries.length){
    return h("div",{className:"muted",style:{textAlign:"center",padding:24,fontSize:".88rem"}},
      "Pas de données échantillonnées (passage trop court ou interrompu très tôt).");
  }
  var W=Math.max(p.dureeSec||60, entries[entries.length-1].sec+1);
  var H=100;
  var indices=[]; for(var k=0;k<crit.length;k++) indices.push(k);
  return h("div",{className:"courbe-wrap"},
    h("svg",{viewBox:"-2 -6 "+(W+4)+" "+(H+12),preserveAspectRatio:"none",className:"courbe-svg"},
      [25,50,75].map(function(y){return h("line",{key:y,x1:0,y1:H-y,x2:W,y2:H-y,stroke:"#e2e6ef",strokeWidth:.4,strokeDasharray:"2,2"});}),
      indices.map(function(ci){
        var pts=entries.map(function(e){return e.sec+","+(H-(e.vals["c"+ci]||0));}).join(" ");
        return h("polyline",{key:ci,points:pts,fill:"none",stroke:COURBE_COLORS[ci%COURBE_COLORS.length],strokeWidth:1.4,strokeLinejoin:"round",strokeLinecap:"round",opacity:.92});
      })),
    h("div",{className:"courbe-legend"},
      crit.map(function(c,i){return h("span",{key:i,className:"courbe-leg-item"},
        h("span",{className:"courbe-leg-dot",style:{background:COURBE_COLORS[i%COURBE_COLORS.length]}}),
        h("span",null,c.emoji+" "+c.label));
      })));
}

function ModalePassage(p){
  // p.passageId, p.data, p.criteres, p.dureeSec, p.onClose
  var d=p.data||{};
  var votes=d.votes||{};
  var courbe=d.courbe||{};
  var checkpoints=d.checkpoints||{};
  var criteres=p.criteres||CRITERES_DEFAUT;
  var n=criteres.length;
  function med(arr){ return median(arr); }
  var votantsSlugs=Object.keys(votes);
  var nbVotes=votantsSlugs.length;
  var medianes=[];
  for(var i=0;i<n;i++){
    var vals=votantsSlugs.map(function(slug){var v=votes[slug]&&votes[slug].votes; return v?v["c"+i]:null;}).filter(function(v){return typeof v==="number";});
    medianes.push(med(vals));
  }
  var cpByCrit=[]; for(var k=0;k<n;k++) cpByCrit.push([]);
  Object.keys(checkpoints).forEach(function(k){
    var c=checkpoints[k]; if(c && typeof c.critereIdx==="number" && c.critereIdx>=0 && c.critereIdx<n) cpByCrit[c.critereIdx].push(c);
  });
  cpByCrit.forEach(function(arr){arr.sort(function(a,b){return (a.ts||0)-(b.ts||0);});});
  var statut=d.annule?'🚫 Annulé':(d.bilanTermine?'✅ Terminé':'🎙️ Encore en cours');
  function fmt(s){ return fmtSec(s); }
  return h("div",{className:"help-back",onClick:function(e){if(e.target.className==="help-back")p.onClose();}},
    h("div",{className:"help-modal mp-modal"},
      h("button",{className:"modal-close",onClick:p.onClose,title:"Fermer le détail du passage."},"✕"),
      h("h1",null,d.lecteur||p.passageId),
      h("p",{className:"subtitle"},statut+" · "+nbVotes+" vote"+(nbVotes!==1?"s":"")+" · "+Object.keys(checkpoints).length+" checkpoint"+(Object.keys(checkpoints).length!==1?"s":"")),
      h("h3",{className:"mp-sec-title"},"Courbe applaudimètre"),
      h(CourbePassage,{courbe:courbe,criteres:criteres,dureeSec:p.dureeSec}),
      h("h3",{className:"mp-sec-title"},"Bilan École Directe"),
      nbVotes===0
        ? h("p",{className:"muted",style:{textAlign:"center",padding:16}},"Aucun vote enregistré pour ce passage.")
        : h("div",{className:"bilan-grille mp-grille"},
            criteres.map(function(c,i){
              var niv=medianes[i];
              var color=niv!==null?ED_COLORS[niv]:"#cbd5e1";
              var label=niv!==null?ECHELLE_ED[niv]:"Pas d'évaluation";
              return h("div",{className:"bilan-crit",key:i,style:{borderColor:color}},
                h("div",{className:"bilan-crit-emoji"}, c.emoji),
                h("div",{className:"bilan-crit-label"}, c.label),
                h("div",{className:"bilan-crit-niveau",style:{color:color,borderTopColor:color}}, label));
            })),
      h("h3",{className:"mp-sec-title"},"Checkpoints (passages de seuil)"),
      h("div",{className:"mp-checkpoints"},
        criteres.map(function(c,i){
          var liste=cpByCrit[i];
          return h("div",{className:"mp-cp-col",key:i},
            h("div",{className:"mp-cp-emoji"}, c.emoji),
            h("div",{className:"mp-cp-count"}, "×"+liste.length),
            h("div",{className:"mp-cp-list"},
              liste.length ? liste.map(function(cp,k){return h("span",{key:k,className:"mp-cp-time"},fmt(cp.time));}) : h("span",{className:"muted",style:{fontSize:".82rem"}},"—")));
        }))));
}

// Composant : ajout manuel d'un élève à la file (override de la règle d'équité)
function AjoutManuelFile(p){
  var s1=useState(""), nom=s1[0], setNom=s1[1];
  var s2=useState(5), nbLignes=s2[0], setNbLignes=s2[1];
  function ajouter(){
    if(!nom){ alert("Choisis d'abord un élève."); return; }
    var slug=san(nom);
    var dejaInscrits={}; Object.keys(p.file||{}).forEach(function(k){dejaInscrits[k]=true;});
    if(dejaInscrits[slug]){ alert(prenom(nom)+" est déjà dans la file."); return; }
    var nbLec=(p.compteurs && p.compteurs[slug])||0;
    var minC=999;
    Object.keys(p.compteurs||{}).forEach(function(s){ if(p.compteurs[s]<minC) minC=p.compteurs[s]; });
    if(minC===999) minC=0;

function OngletClasses(p){
  var classes=p.classes||{};
  var sn=useState(""), nom=sn[0], setNom=sn[1];
  var sl=useState(""), liste=sl[0], setListe=sl[1];
  function creer(){
    var n=nom.trim(); if(!n){ alert("Donne d'abord un nom à la classe (ex. 4e Banksy), dans le champ du haut."); return; }
    var eleves=liste.split("\n").map(function(l){return l.trim();}).filter(function(l){return l.length;});
    if(!eleves.length){ alert("Colle au moins un élève (un par ligne, format NOM Prénom)."); return; }
    var cle=cleClasse(n);                              // décision §12 : la clé de /classes est le nom tel quel
    ecrireClasse(db, cle, eleves, {nom:n}, function(err){   // transaction non destructive : préserve archivee/niveau/…
      if(err){ alert("Échec de l'enregistrement Firebase : "+((err&&err.message)||err)+"\n\nVérifie ta config Firebase et les règles de la base (lecture/écriture autorisées)."); }
      else { setNom(""); setListe(""); }
    });
  }
  function suppr(slug){ renvoyerVersMJPC("Suppression de la classe « "+slug+" » demandée depuis l'Applaudimètre"); }   // plus de remove sec sur le nœud partagé
  return h(React.Fragment,null,
    h("div",{className:"card"},
      h("h3",null,"Nouvelle classe",ifo("Colle ta liste depuis École Directe : un élève par ligne, au format NOM Prénom. Le prénom seul s'affichera côté élève et au tableau.")),
      h("div",{className:"field"},h("label",null,"Nom de la classe",ifo("Identifie la classe dans les sélecteurs et le récap des séances. Utilisé tel quel.")),
        h("input",{value:nom,onChange:function(e){setNom(e.target.value);},placeholder:"4e Banksy"})),
      h("div",{className:"field"},h("label",null,"Élèves (un par ligne)",ifo("Format strict NOM Prénom. Le matching côté élève est insensible à la casse et aux accents, mais l'ordre des mots compte.")),
        h("textarea",{value:liste,onChange:function(e){setListe(e.target.value);},placeholder:"DUPONT Jean\nMARTIN Léa\n…"})),
      h("button",{className:"btn btn-violet btn-lg",onClick:creer,
        title:"Crée la classe dans Firebase. Le nom de la classe est slugifié pour produire un identifiant interne."},"➕ Créer la classe")),
    Object.keys(classes).filter(function(s){return !estClasseTest(s);}).map(function(slug){
      var c=classes[slug]; var el=extractEleves(c, []);
      return h("div",{className:"card",key:slug},
        h("h3",null,c.nom||slug),
        h("p",{className:"muted",style:{marginBottom:8}},el.length+" élèves"),
        h("div",null,el.slice(0,40).map(function(nm,i){return h("span",{className:"pill",key:i},prenom(nm));})),
        h("button",{className:"btn btn-ghost",style:{marginTop:10},onClick:function(){suppr(slug);},
          title:"Supprime la classe et ses élèves. Les séances archivées qui la référencent restent dans /seances."},"🗑️ Supprimer"));
    }));
}

// Les textes que les élèves lisent appartiennent au professeur, pas à l'app (point 26).
function EditeurTextes(p){
  var sv=useState(null), brouillon=sv[0], setBrouillon=sv[1];
  var sm=useState(""), msg=sm[0], setMsg=sm[1];
  var cles=Object.keys(TEXTES_DEFAUT);
  function valeur(k){ return (brouillon && brouillon[k]!==undefined) ? brouillon[k] : txt(k); }
  function modifier(k,v){ var b=Object.assign({},brouillon||{}); b[k]=v; setBrouillon(b); setMsg(""); }
  function enregistrer(){
    var patch={};
    cles.forEach(function(k){ var v=valeur(k); patch[k] = (v===TEXTES_DEFAUT[k]) ? null : v; });
    db.ref(DB_ROOT+"/session/textes").update(patch).then(function(){
      setBrouillon(null); setMsg("Textes enregistrés — les tablettes se mettent à jour dans l'instant.");
    },function(e){ setMsg("Enregistrement impossible : "+((e&&e.message)||"erreur")+"."); });
  }
  function reinitialiser(k){ modifier(k, TEXTES_DEFAUT[k]); }
  return h("div",{className:"card"},
    h("h3",null,"✍️ Textes affichés aux élèves",
      ifo("Ce que les élèves lisent sur leur tablette. Tu peux tout réécrire ; un champ laissé au texte d'origine n'est pas enregistré. Les messages qui constatent un refus (nom absent de la liste, code qui ne correspond pas) restent fixes.")),

        h("label",null, TEXTES_LIBELLES[k]||k,
          modifie? h("span",{style:{marginLeft:8,fontSize:".74rem",fontWeight:700,color:"var(--violet)"}},"modifié") : null),
        h("textarea",{value:valeur(k),rows:2,onChange:function(e){modifier(k,e.target.value);},
          style:{width:"100%",boxSizing:"border-box",padding:"7px 9px",borderRadius:8,border:"1px solid var(--bordure)",fontFamily:"inherit",fontSize:".9rem",lineHeight:1.4,resize:"vertical"}}),
        modifie? h("button",{className:"btn btn-ghost",style:{marginTop:4,padding:"3px 9px",fontSize:".76rem"},
          onClick:function(){reinitialiser(k);},title:"Revenir au texte d'origine pour cette ligne."},"↩ texte d'origine") : null);
    }),
    msg? h("div",{style:{margin:"8px 0",padding:"8px 11px",borderRadius:8,background:"rgba(124,92,255,.10)",border:"1px solid rgba(124,92,255,.3)",fontSize:".84rem"}},msg) : null,
    h("div",{className:"btn-row"},
      h("button",{className:"btn btn-violet",onClick:enregistrer,disabled:!brouillon,
        style:{opacity:brouillon?1:.5},title:"Enregistrer ces textes pour toutes les tablettes."},"💾 Enregistrer les textes"),
      brouillon? h("button",{className:"btn btn-ghost",onClick:function(){setBrouillon(null);setMsg("");},
        title:"Abandonner les modifications non enregistrées."},"Annuler") : null));
}

// calcPhase — état déduit du modèle session (helper commun à tous les composants)
// Retourne "idle" / "live" / "fin" / "vote" / "bilan"
function calcPhase(session, reg){
  if(!session||!session.reader||!session.startedAt) return "idle";
  if(session.phaseLockee==="vote") return "vote";
  if(session.phaseLockee==="bilan") return "bilan";
  var pauseDur = session.pausedDuration||0;
  var pauseStart = session.pauseStartedAt||null;
  var paused = !!pauseStart;
  var elapsed = Math.max(0, (Date.now() - session.startedAt - pauseDur - (paused?(Date.now()-pauseStart):0))/1000);
  var duree = session.dureeOverride || ((reg&&reg.dureeSec)||60);   // override possible en mode spontané (basé sur nb lignes)
  return (elapsed >= duree) ? "fin" : "live";
}

function meterSegs(pct){                            // V3 — 64 segments cubes, tête à opacité partielle pour mouvement fluide
  var total=64, litFloat=(pct/100)*total, litFull=Math.floor(litFloat), partial=litFloat-litFull;
  var out=[];
  for(var s=0;s<total;s++){
    var hue=290 - (s/total)*220;                    // violet (bas) → orangé (haut)
    var style;
    if(s<litFull){
      style={background:"linear-gradient(to bottom, hsl("+hue+",90%,72%) 0%, hsl("+hue+",85%,58%) 40%, hsl("+hue+",80%,42%) 100%)",
        boxShadow:"inset 0 1px 0 hsla("+hue+",100%,88%,.7), inset 0 -1px 2px hsla("+hue+",80%,25%,.6), 0 0 6px hsla("+hue+",90%,55%,.45)"};
    } else if(s===litFull){
      style={background:"linear-gradient(to bottom, hsl("+hue+",90%,72%) 0%, hsl("+hue+",85%,58%) 40%, hsl("+hue+",80%,42%) 100%)",
        boxShadow:"inset 0 1px 0 hsla("+hue+",100%,88%,.5), 0 0 6px hsla("+hue+",90%,55%,.35)",
        opacity:(0.15+partial*0.85)};
    } else { style=null; }
    out.push(h("div",{key:s,className:"meter-seg",style:style}));
  }
  return out;
}

function VueBoard(p){
  var ss=useState(null), session=ss[0], setSession=ss[1];
  var sl=useState({}), live=sl[0], setLive=sl[1];
  var sc=useState({}), comps=sc[0], setComps=sc[1];
  var tick=useState(0), setTick=tick[1];
  var scl=useState([]), claps=scl[0], setClaps=scl[1];
  var sCp=useState([]), cps=sCp[0], setCps=sCp[1];   // checkpoints par critère (longueur = nbCrit, ajusté à la lecture)
  var sSnap=useState(null), snap=sSnap[0], setSnap=sSnap[1];    // snapshot des barres au gel
  var sPlt=useState([]), paillettes=sPlt[0], setPlt=sPlt[1];    // paillettes de fin
  var sTb=useState({}), tablettesBoard=sTb[0], setTablettesBoard=sTb[1];     // pour compteur "X / N votes"
  var sVb=useState({}), votesBoard=sVb[0], setVotesBoard=sVb[1];             // votes du passage courant
  var lastValsRef=useRef([]);                                   // pour détection passage de seuil par en bas (taille ajustée dynamiquement)
  var finiRef=useRef(false);                                    // pour suspendre la pluie de 👏 en phase fin
  var courbeLastSecRef=useRef(-1);                              // dernière seconde écrite dans /courbe pour ne pas doublonner
  var lvlRef=useRef(0);
  useEffect(function(){
    var r1=db.ref(DB_ROOT+"/session"); var f1=r1.on("value",function(s){setSession(s.val()||{});});
    var r2=db.ref(DB_ROOT+"/live"); var f2=r2.on("value",function(s){setLive(s.val()||{});});
    var r3=db.ref(DB_ROOT+"/compliments"); var f3=r3.on("value",function(s){setComps(s.val()||{});});
    var r4=db.ref(DB_ROOT+"/liveSnapshot"); var f4=r4.on("value",function(s){setSnap(s.val()||null);});
    var r5=db.ref(DB_ROOT+"/tablettes"); var f5=r5.on("value",function(s){setTablettesBoard(s.val()||{});});
    var iv=setInterval(function(){setTick(function(t){return t+1;});},100); // rafraîchit présence/decay/segments à 10 fps
    return function(){ r1.off("value",f1); r2.off("value",f2); r3.off("value",f3); r4.off("value",f4); r5.off("value",f5); clearInterval(iv); };
  },[]);
  useEffect(function(){                              // pluie de 👏 pilotée par le niveau des barres
    var n=0;
    var ivc=setInterval(function(){
      var lvl=lvlRef.current;
      setClaps(function(prev){
        var t=Date.now();
        var next=prev.filter(function(c){return t-c.born<1200;});
        if(finiRef.current) return next;             // gel atteint : on laisse disparaître, on n'ajoute plus
        if(lvl>50) next=next.concat([{id:(++n)+"_"+t, left:8+Math.random()*84, emoji:Math.random()<0.15?"✨":"👏", born:t}]);
        if(lvl>82) next=next.concat([{id:(++n)+"_"+t+"b", left:8+Math.random()*84, emoji:"👏", born:t}]);
        return next;
      });
    },480);
    return function(){ clearInterval(ivc); };
  },[]);
  var reg=reglagesSafe(session&&session.reglages);
  var nbCrit=reg.criteres.length;
  var passageId=(session&&session.passageId)||"";
  var startedAt=(session&&session.startedAt)||0;
  // Lecture temps réel des checkpoints du passage en cours (survit aux refresh)
  useEffect(function(){
    if(!passageId){ var empty=[]; for(var k=0;k<nbCrit;k++) empty.push([]); setCps(empty); return; }
    var ref=db.ref(DB_ROOT+"/historiqueLectures/"+passageId+"/checkpoints");
    var f=ref.on("value",function(s){
      var v=s.val()||{};
      var byIdx=[]; for(var k=0;k<nbCrit;k++) byIdx.push([]);
      Object.keys(v).forEach(function(k){
        var c=v[k]; if(c && typeof c.critereIdx==="number" && c.critereIdx>=0 && c.critereIdx<nbCrit) byIdx[c.critereIdx].push(c);
      });
      byIdx.forEach(function(arr){ arr.sort(function(a,b){return (a.ts||0)-(b.ts||0);}); });
      setCps(byIdx);
    });
    return function(){ ref.off("value",f); };
  },[passageId,nbCrit]);
  // Listener votes du passage (pour compteur "X / N votes" en phase vote)
  useEffect(function(){
    if(!passageId){ setVotesBoard({}); return; }

    return function(){r.off("value",f);};
  },[passageId]);
  var reader=session&&session.reader;
  var now=Date.now();
  var tables=Object.keys(live).map(function(k){return live[k];}).filter(function(v){return v&&(now-(v.ts||0))<6000;});
  var presents=tables.length;

  var vals=[]; for(var iv=0;iv<nbCrit;iv++) vals.push(0);

    for(var i=0;i<nbCrit;i++){
      var sum=0; tables.forEach(function(t){ sum+=(t["c"+i]||0); }); vals[i]=sum/presents;
    }
  }
  var maxLvl=0; for(var iL=0;iL<nbCrit;iL++) if(vals[iL]>maxLvl) maxLvl=vals[iL];

  var pauseStartedAt=(session&&session.pauseStartedAt)||null;
  var pausedDuration=(session&&session.pausedDuration)||0;
  var paused=!!pauseStartedAt;
  var phase=calcPhase(session, reg);                          // "idle" | "live" | "fin" | "vote" | "bilan"
  var elapsed = (reader && startedAt) ? Math.max(0, (Date.now() - startedAt - pausedDuration - (paused ? (Date.now() - pauseStartedAt) : 0)) / 1000) : 0;
  var remaining = Math.max(0, Math.ceil(reg.dureeSec - elapsed));
  var fini = phase==="fin";                                   // gel : uniquement en phase fin (vote/bilan ont leur propre rendu)
  var enVote = phase==="vote", enBilan = phase==="bilan";

  useEffect(function(){

      lastValsRef.current=vals.slice();

    if(lastValsRef.current.length!==nbCrit){
      var pad=[]; for(var pi=0;pi<nbCrit;pi++) pad.push(lastValsRef.current[pi]||0);
      lastValsRef.current=pad;
    }
    for(var ci=0;ci<nbCrit;ci++){
      var seuil=reg.seuilsCheckpoints[ci];
      if(vals[ci]>=seuil && lastValsRef.current[ci]<seuil){
        var elapsedSec=Math.floor((Date.now()-startedAt)/1000);

  // (b) Échantillonnage 1 Hz de la courbe (en live uniquement)
  useEffect(function(){
    if(!passageId){ courbeLastSecRef.current=-1; return; }

    }

  // Valeurs utilisées pour le rendu : pendant la phase fin, on affiche le snapshot Firebase
  var valsAffich = vals;
  if(fini && snap){
    valsAffich=[]; for(var ia=0;ia<nbCrit;ia++) valsAffich.push(snap["c"+ia]||0);
  }
  // Déclenchement unique du gel (snapshot Firebase + tirage du message) quand le minuteur atteint zéro
  useEffect(function(){
    if(!fini || !passageId) return;
    if(messageFinIdx !== null) return;            // gel déjà appliqué pour ce passage
    var snapVals={presents:presents, ts:Date.now()};
    for(var iSn=0;iSn<nbCrit;iSn++) snapVals["c"+iSn]=vals[iSn]||0;
    var idx = Math.floor(Math.random() * MESSAGES_FIN.length);
    db.ref(DB_ROOT+"/liveSnapshot").set(snapVals);
    db.ref(DB_ROOT+"/session").update({messageFinIdx: idx});
  }, [fini, passageId, messageFinIdx]);
  // Pluie de paillettes en phase fin (✨🎉⭐)
  useEffect(function(){

// ════════════ TABLETTE ÉLÈVE ════════════
function FormConnexion(p){
  // Login pattern correction_dictee : NOM + Prénom au clavier, matching strict slugifié.
  // 27/07/2026 : + CODE PERSONNEL. Un élève qui vote est évalué sur sa capacité à évaluer,
  // et son vote est archivé à son nom : l'identité doit donc être attestée, comme dans
  // toutes les autres apps. Aucune liste de prénoms n'est exposée, aucun code n'est fabriqué ici.
  var sn=useState(""), nom=sn[0], setNom=sn[1];
  var sp=useState(""), pre=sp[0], setPre=sp[1];
  var sc=useState(""), code=sc[0], setCode=sc[1];
  var se=useState(""), err=se[0], setErr=se[1];
  var sb=useState(false), busy=sb[0], setBusy=sb[1];
  function valider(){
    if(busy) return;
    var n=nom.trim(), pr=pre.trim(), cd=code.trim();
    if(!n||!pr){ setErr("Saisis ton nom ET ton prénom."); return; }
    if(!cd){ setErr("Saisis ton code personnel."); return; }
    var saisi=san((n+" "+pr).toLowerCase());
    var found=null;
    for(var i=0;i<p.eleves.length;i++){
      if(san(String(p.eleves[i]).toLowerCase())===saisi){ found=p.eleves[i]; break; }
    }
    if(!found){ setErr("Ce nom n'est pas dans la liste de la classe. Vérifie l'orthographe."); return; }
    var slug=san(found);
    if(p.absents.indexOf(slug)!==-1){ setErr("Tu es marqué absent. Demande au prof si c'est une erreur."); return; }
    if((p.dejaInscrits||[]).indexOf(slug)!==-1){ setErr("Tu es déjà connecté sur cette tablette."); return; }
    setBusy(true);
    lireCodeEleveMJPC(db, slug, p.codesTest).then(function(r){
      setBusy(false);
      if(r.etat==="erreur"){ setErr("Ton code n'a pas pu être vérifié pour l'instant. Réessaie dans un instant."); return; }
      if(r.etat==="absent"){ setErr("Aucun code personnel n'est enregistré pour ce nom. Signale-le pour qu'on te le remette."); return; }
      if(String(r.code)!==cd){ setErr("Ce code ne correspond pas à ce nom. Vérifie tes chiffres."); setCode(""); return; }
      p.onValider({nom:found, slug:slug, atteste:true, ts:Date.now()});
    });
  }
  return h("div",{className:"form-connect"},
    h("div",{className:"field"},h("label",null,"Nom"),
      h("input",{value:nom,onChange:function(e){setNom(e.target.value);setErr("");},
        onKeyDown:function(e){if(e.key==="Enter")valider();},
        autoFocus:true,placeholder:"DUPONT",autoCapitalize:"characters",inputMode:"text"})),
    h("div",{className:"field"},h("label",null,"Prénom"),
      h("input",{value:pre,onChange:function(e){setPre(e.target.value);setErr("");},
        onKeyDown:function(e){if(e.key==="Enter")valider();},
        placeholder:"Léa",autoCapitalize:"words",inputMode:"text"})),
    h("div",{className:"field"},h("label",null,"Ton code personnel"),
      h("input",{type:"password",value:code,onChange:function(e){setCode(e.target.value);setErr("");},
        onKeyDown:function(e){if(e.key==="Enter")valider();},
        placeholder:"••••",inputMode:"numeric",autoComplete:"off",
        style:{letterSpacing:".3em",textAlign:"center"}})),
    err? h("div",{className:"form-err"},err) : null,
    h("div",{className:"btn-row"},
      p.onCancel? h("button",{className:"btn btn-ghost",onClick:p.onCancel,title:"Annuler et revenir en arrière."},"Annuler") : null,
      h("button",{className:"btn btn-violet btn-lg",style:{flex:1,opacity:busy?.6:1},onClick:valider,disabled:busy,
        title:"Vérifie que NOM+Prénom correspondent à la liste de la classe, et que le code est bien celui de cet élève. La comparaison du nom est insensible aux accents et à la casse."},
        busy? "Vérification…" : "Me connecter")));
}

// L'élève déjà connecté au site MJPC n'a ni nom ni code à retaper. L'entrée n'est
// pas automatique : cette tablette est PARTAGÉE par deux ou trois élèves, et une

function AppEleve(p){
  var ss=useState(null), session=ss[0], setSession=ss[1];
  var sc=useState({}), classes=sc[0], setClasses=sc[1];
  // Table persistée en sessionStorage (résiste au refresh accidentel pendant une séance)
  var st=useState(function(){try{return sessionStorage.getItem("am_table")||"";}catch(e){return "";}}), table=st[0], setTable_=st[1];
  function setTable(v){ try{ if(v) sessionStorage.setItem("am_table",v); else sessionStorage.removeItem("am_table"); }catch(e){} setTable_(v); }
  var so=useState([]), occupants=so[0], setOccupants=so[1];
  var sa=useState(false), addOpen=sa[0], setAddOpen=sa[1];
  useEffect(function(){
    var r1=db.ref(DB_ROOT+"/session"); var f1=r1.on("value",function(s){setSession(s.val()||{});});
    var r2=db.ref("classes"); var f2=r2.on("value",function(s){setClasses(s.val()||{});});
    return function(){ r1.off("value",f1); r2.off("value",f2); };
  },[]);
  // Listener temps réel sur /tablettes/{tableId} : permet la reconnexion automatique
  useEffect(function(){
    if(!table){ setOccupants([]); return; }
    var ref=db.ref(DB_ROOT+"/tablettes/"+table);
    var f=ref.on("value",function(s){ var v=s.val()||{}; setOccupants(toArr(v.occupants)); });
    return function(){ ref.off("value",f); };
  },[table]);
  var reg=reglagesSafe(session&&session.reglages);
  var slug=session&&session.classeSlug;
  var classe=slug&&classes[slug];
  var eleves=classe?extractEleves(classe, []):[];
  var demarree=!!(session&&session.demarreeLe);
  var absents=session?toArr(session.absents):[];
  var sessRefE=useRef(null); sessRefE.current=session;    // idem côté tablette
  // Présence : un battement par occupant attesté de cette tablette. Le professeur voit
  // qui est en ligne et sur quelle table, sans que l'élève ait un geste à faire.
  var clesPresentes=occupants.map(function(o){return (o&&o.slug)||"";}).filter(Boolean).join(",");
  useEffect(function(){
    if(!clesPresentes) return;
    var cles=clesPresentes.split(",");
    var arrets=cles.map(function(cle){
      var occ=null;
      for(var i=0;i<occupants.length;i++){ if(occupants[i] && occupants[i].slug===cle){ occ=occupants[i]; break; } }
      return presenceBattement(cle, function(){
        var sn=sessRefE.current;
        return {display:(occ&&occ.nom)||cle, classe:slug||"", niveau:(classe&&classe.niveau)||"", is_prof:false,
                vue:"tablette", seance:(sn&&sn.sessionId)||"", table:table, cle:cle};
      });
    });
    return function(){ arrets.forEach(function(f){ try{ f(); }catch(e){} }); };
  },[clesPresentes, slug, table]);

  // ---- 1. Choix de la table ----
  if(!table){
    return h("div",{className:"eleve"},
      h("div",{className:"hdr"},h("button",{className:"btn-back",onClick:p.onBack,title:"Retour à l'accueil."},"← Accueil"),h("h2",null,"Quelle table ?")),
      h("div",{className:"eleve-wait"},
        h("div",{style:{margin:"4px auto 14px",maxWidth:480,padding:"12px 14px",background:"rgba(255,210,63,.18)",border:"1.5px dashed var(--jaune)",borderRadius:12,textAlign:"center",fontSize:".95rem",lineHeight:1.45,color:"var(--noir)"}},
          "👉 Avant tout : tape sur le bouton ",
          h("strong",{style:{display:"inline-block",background:"var(--jaune)",color:"var(--noir)",borderRadius:"50%",width:24,height:24,lineHeight:"24px",fontWeight:900,verticalAlign:"middle",textAlign:"center"}},"?"),
          " en bas à droite pour lire le ",h("strong",null,"mode d'emploi"),".",
          h("br"),
          h("span",{style:{fontSize:".82rem",opacity:.78}},"Tu sauras quoi faire avant de toucher à quoi que ce soit.")),
        h("p",{className:"muted"},txt("eleve_choix_table")),
        h("div",{className:"choice-list"},
          Array.apply(null,{length:reg.nbTables}).map(function(_,i){
            return h("button",{key:i,className:"classe-btn",onClick:function(){setTable("t"+(i+1));},
              title:"Sélectionne cette tablette comme la tienne. Tu pourras taper ton nom ensuite."},"Table "+(i+1));
          }))),
      h(HelpFab,{role:"eleve",pulse:true,first:"0"}));
  }

  // ---- 2. Attendre que la séance soit démarrée par le prof ----
  if(!classe){
    return h("div",{className:"eleve"},
      h("div",{className:"hdr"},h("button",{className:"btn-back",onClick:function(){setTable("");},title:"Changer de tablette."},"← Table"),h("h2",null,"Table "+table.slice(1))),
      h("div",{className:"eleve-wait"},
        h("div",{className:"big"},"⏳"),
        h("p",{className:"muted"},txt("eleve_attente_classe"))),
      h(HelpFab,{role:"eleve"}));
  }
  if(!demarree){
    return h("div",{className:"eleve"},
      h("div",{className:"hdr"},h("button",{className:"btn-back",onClick:function(){setTable("");},title:"Changer de tablette."},"← Table"),h("h2",null,"Table "+table.slice(1))),
      h("div",{className:"eleve-wait"},
        h("div",{className:"big"},"🚀"),
        h("p",{className:"muted"},txt("eleve_attente_demarrage"))),
      h(HelpFab,{role:"eleve"}));
  }

  // ---- 3. Aucun occupant : formulaire d'inscription du premier ----
  function ajouterOccupant(occ){
    var newList=occupants.concat([occ]).slice(0,3);          // max 3
    db.ref(DB_ROOT+"/tablettes/"+table).set({occupants:newList, ts:Date.now()});
    setAddOpen(false);
  }
  function retirerOccupant(slugRet){
    var newList=occupants.filter(function(o){return o.slug!==slugRet;});
    if(newList.length===0) db.ref(DB_ROOT+"/tablettes/"+table).remove();
    else db.ref(DB_ROOT+"/tablettes/"+table).set({occupants:newList, ts:Date.now()});
  }
  function changerOccupants(){
    if(!confirm("Faire tourner les élèves à cette tablette ?\n\nLes occupants actuels seront déconnectés pour laisser place à 3 nouveaux élèves.\nLa tablette reste à cette table.")) return;
    db.ref(DB_ROOT+"/tablettes/"+table).remove();
    // pas de setTable("") : on garde la tablette à sa table physique, les 3 nouveaux élèves se connectent ici.
  }
  var dejaInscrits=occupants.map(function(o){return o.slug;});

  // Identité MJPC utilisable ici : session valide, élève AU REGISTRE de la classe de
  // la séance, ni absent, ni déjà installé sur cette tablette. Sinon : portail natif.
  function identiteMJPCDispo(){
    var sess=null;
    try{ sess=lireSessionMJPC(); }catch(e){ return null; }
    if(!sess || sess.is_prof===true) return null;
    var idn=validerEleveMJPC(sess, classes);
    if(!idn) return null;
    if(idn.classe!==slug) return null;                       // identifié, mais pas sur cette séance
    if(absents.indexOf(idn.cle)!==-1) return null;
    if(dejaInscrits.indexOf(idn.cle)!==-1) return null;
    return idn;
  }

  if(occupants.length===0){
    return h("div",{className:"eleve"},
      h("div",{className:"hdr"},
        h("button",{className:"btn-back",onClick:function(){setTable("");},title:"Changer de tablette (annule l'inscription)."},"← Table"),
        h("h2",null,"Table "+table.slice(1)+" — connexion")),
      h("div",{className:"form-wrap"},
        h(ShuntMJPC,{identite:identiteMJPCDispo(),onValider:ajouterOccupant}),
        h("p",{className:"muted",style:{textAlign:"center",marginBottom:14}},txt("eleve_premier_occupant")),
        h(FormConnexion,{eleves:eleves,absents:absents,dejaInscrits:dejaInscrits,codesTest:session&&session.codesTest,onValider:ajouterOccupant})),
      h(HelpFab,{role:"eleve"}));
  }

  // ---- 4. Vue applaudimètre avec zones par occupant ----
  if(addOpen){
    return h("div",{className:"eleve"},
      h("div",{className:"hdr"},
        h("button",{className:"btn-back",onClick:function(){setAddOpen(false);},title:"Annuler l'ajout et revenir aux applaudissements."},"← Annuler"),
        h("h2",null,"Ajouter un élève")),
      h("div",{className:"form-wrap"},
        h("p",{className:"muted",style:{textAlign:"center",marginBottom:14}},"Tape ton nom + prénom. Tu rejoins la Table "+table.slice(1)+".")),
        h(ShuntMJPC,{identite:identiteMJPCDispo(),onValider:ajouterOccupant}),
        h(FormConnexion,{eleves:eleves,absents:absents,dejaInscrits:dejaInscrits,codesTest:session&&session.codesTest,
          onCancel:function(){setAddOpen(false);},onValider:ajouterOccupant}),
      h(HelpFab,{role:"eleve"}));
  }
  return h(EleveVote,{table:table,occupants:occupants,session:session,reg:reg,absents:absents,test:estSessionTest(session),
    onAddOccupant:function(){setAddOpen(true);},
    onRemoveOccupant:retirerOccupant,
    onChangerOccupants:changerOccupants, onBack:p.onBack});
}

// ════════════ PHASE VOTE — sélecteur d'occupant + formulaire par critère ════════════
function PhaseVote(p){
  // p.occupants, p.reader, p.reg, p.passageId
  var sLec=useState(""), votant=sLec[0], setVotant=sLec[1];   // slug de l'occupant en cours de vote
  var sV=useState({}), votes=sV[0], setVotes=sV[1];           // {slug:{nom,votes:{c0..c3},ts}} déjà votés

  // ─── Hooks : TOUS appelés en haut, AVANT tout early return (Rules of Hooks) ───
  useEffect(function(){
    if(!p.passageId) return;
    var ref=db.ref(DB_ROOT+"/votes/"+p.passageId);
    var f=ref.on("value",function(s){ setVotes(s.val()||{}); });
    return function(){ ref.off("value",f); };
  },[p.passageId]);

  // Calcul de l'occupant courant (peut être null si pas encore sélectionné, ou si retiré pendant le vote)
  var occ=null;
  if(votant){
    for(var i=0;i<p.occupants.length;i++){ if(p.occupants[i].slug===votant){ occ=p.occupants[i]; break; } }
  }
  // Si l'occupant choisi n'existe plus (retiré pendant la phase vote), on revient au sélecteur
  useEffect(function(){
    if(votant && !occ) setVotant("");
  },[votant, occ]);

  // ─── Branches de rendu (après tous les hooks) ───
  if(!votant){
    return h("div",{className:"vote-selection"},
      h("div",{className:"vote-titre"},"📝 Tour de vote"),
      h("p",{className:"muted",style:{marginBottom:14}},"Chacun à votre tour, choisissez votre prénom pour donner votre avis sur "+prenom(p.reader)+"."),
      h("div",{className:"vote-occ-list"},
        p.occupants.map(function(occ){
          var aVote=!!votes[occ.slug];
          var estLecteur=occ.nom===p.reader;
          if(estLecteur){
            return h("div",{className:"vote-occ-row dim",key:occ.slug},
              h("span",{className:"vote-occ-name"}, prenom(occ.nom)),
              h("span",{className:"vote-occ-state"},"🎤 lecteur — ne vote pas"));
          }
          return h("button",{className:"vote-occ-row"+(aVote?" voted":""),key:occ.slug,
            onClick:function(){ if(!aVote) setVotant(occ.slug); },disabled:aVote,
            title:aVote?prenom(occ.nom)+" a déjà voté.":"À "+prenom(occ.nom)+" de voter."},
            h("span",{className:"vote-occ-name"}, prenom(occ.nom)),
            h("span",{className:"vote-occ-state"}, aVote?"✓ a voté":"À toi de voter →"));
        })));
  }

  if(!occ) return null;
  return h(VoteFormulaire,{
    occupant:occ, criteres:p.reg.criteres, reader:p.reader,
    onValider:function(scores){
      db.ref(DB_ROOT+"/votes/"+p.passageId+"/"+votant).set({
        nom:occ.nom, votes:scores, ts:Date.now()
      });
      setVotant("");
    },
    onAnnuler:function(){ setVotant(""); }
  });
}

function VoteFormulaire(p){
  var nC=(p.criteres||[]).length;
  var sR=useState(function(){var a=[]; for(var k=0;k<nC;k++) a.push(null); return a;}), rep=sR[0], setRep=sR[1];
  // si N change pendant la phase vote (cas-limite : le prof modifie les critères) → adapte rep
  if(rep.length!==nC){
    var resized=[]; for(var rk=0;rk<nC;rk++) resized.push(rep[rk]!==undefined?rep[rk]:null);
    rep=resized; setRep(resized);
  }
  function setNiveau(i,v){ var n=rep.slice(); n[i]=v; setRep(n); }
  function valider(){
    var tousReplis=rep.every(function(r){return r!==null;});
    if(!tousReplis){ alert("Réponds à toutes les questions avant de valider."); return; }
    var scores={};
    for(var i=0;i<nC;i++) scores["c"+i]=rep[i];
    p.onValider(scores);
  }
  return h("div",{className:"vote-form"},
    h("div",{className:"vote-form-hdr"},
      h("button",{className:"btn-back",onClick:p.onAnnuler,
        title:"Revenir au sélecteur d'occupant pour passer la tablette à quelqu'un d'autre."},"← Changer de votant"),
      h("div",{className:"vote-form-titre"},prenom(p.occupant.nom)+" évalue "+prenom(p.reader))),
    p.criteres.map(function(c,i){
      var question = c.questionVotant || "Pour le critère « "+c.label+" » :";
      return h("div",{className:"vote-q-block",key:i},
        h("div",{className:"vote-q-titre"}, h("span",{className:"vote-q-emoji"},c.emoji), h("span",null,question)),
        h("div",{className:"vote-q-choix"},
          ECHELLE_VOTANT.map(function(e,j){
            return h("button",{key:j,className:"vote-choix"+(rep[i]===j?" sel":""),
              onClick:function(){setNiveau(i,j);},
              title:"Choisir « "+e.label+" » pour ce critère."},
              h("span",{className:"vote-choix-emoji"}, e.emoji),
              h("span",{className:"vote-choix-label"}, e.label));
          })));
    }),
    h("button",{className:"btn btn-violet btn-lg",style:{width:"100%",marginTop:14},onClick:valider,
      title:"Envoie ton vote. Il faut avoir répondu aux 4 questions pour pouvoir valider."},
      "Valider mon vote"));
}

// ════════════ PHASE BILAN — grille École Directe pour le lecteur ════════════
function PhaseBilan(p){
  // p.occupants, p.reader, p.reg, p.passageId, p.lecteurEstIci
  var sV=useState({}), votes=sV[0], setVotes=sV[1];
  useEffect(function(){
    if(!p.passageId) return;
    var ref=db.ref(DB_ROOT+"/votes/"+p.passageId);
    var f=ref.on("value",function(s){ setVotes(s.val()||{}); });
    return function(){ ref.off("value",f); };
  },[p.passageId]);

  // median est défini au niveau top
  var votantsSlugs=Object.keys(votes);
  var nbVotes=votantsSlugs.length;
  var crit=p.reg.criteres;
  var medianes=[];
  for(var i=0;i<crit.length;i++){
    var vals=votantsSlugs.map(function(slug){var vv=votes[slug]&&votes[slug].votes; return vv?vv["c"+i]:null;}).filter(function(v){return typeof v==="number";});
    medianes.push(median(vals));
  }

  if(!p.lecteurEstIci){
    return h("div",{className:"eleve-vote-wait"},
      h("div",{className:"big"},"✅"),
      h("div",{className:"vote-titre"},txt("eleve_eval_terminee")),
      h("p",{className:"muted"},prenom(p.reader)+" consulte son bilan."));
  }
  return h("div",{className:"bilan"},
    h("div",{className:"bilan-hdr"},
      h("div",{className:"bilan-emoji-grand"},"📋"),
      h("div",{className:"bilan-titre"},"Ton bilan, "+prenom(p.reader)),
      h("p",{className:"muted",style:{marginTop:6}}, nbVotes===0
        ? "Personne n'a voté pour ce passage."
        : (nbVotes+" camarade"+(nbVotes>1?"s ont":" a")+" donné son avis."))),
    h("div",{className:"bilan-grille"},
      p.reg.criteres.map(function(c,i){
        var niv=medianes[i];
        var color=niv!==null ? ED_COLORS[niv] : "#cbd5e1";
        var label=niv!==null ? ECHELLE_ED[niv] : "Pas d'évaluation";
        return h("div",{className:"bilan-crit",key:i,style:{borderColor:color}},
          h("div",{className:"bilan-crit-emoji"}, c.emoji),
          h("div",{className:"bilan-crit-label"}, c.label),
          h("div",{className:"bilan-crit-niveau",style:{color:color,borderTopColor:color}}, label));
      })));
}

// Panneau « lecture spontanée » côté élève (rendu par occupant pour gérer le multi-occupants)
function PanneauSpontane(p){
  // p : {occ, reg, fileE, compteursE, tabE, absents, totalPassagesSession, onInscrire, onDesister}
  var sNbL=useState(p.reg.nbLignesMin||2), nbLignes=sNbL[0], setNbLignes=sNbL[1];
  var sDur=useState(p.reg.dureeMin||30), duree=sDur[0], setDuree=sDur[1];
  var sUni=useState("lignes"), unite=sUni[0], setUnite=sUni[1];
  var fe=p.fileE[p.occ.slug];                                // entrée file pour cet occupant
  var nbLec=(p.compteursE && p.compteursE[p.occ.slug])||0;
  var pres=slugsPresents(p.tabE, p.absents||[]);
  var timides=slugsTimides(pres, p.compteursE, p.totalPassagesSession, p.reg.timideTrigger);
  var estTimide=timides.indexOf(p.occ.slug)!==-1;
  var msgTimide=(estTimide && p.reg.messagesTimidesOn) ? msgTimideStable(p.occ.slug, p.totalPassagesSession, p.reg.messagesTimides) : null;
  var minL=p.reg.nbLignesMin||2, maxL=p.reg.nbLignesMax||20;

  // Position dans la file + total

  if(fe){
    var entries=Object.keys(p.fileE).map(function(k){return {slug:k, ts:p.fileE[k].inscritLe};}).sort(function(a,b){return a.ts-b.ts;});
    totalFile=entries.length;
    for(var i=0;i<entries.length;i++){ if(entries[i].slug===p.occ.slug){ posFile=i+1; break; } }
  }
  // Cas spécial : élève qui s'est désisté ET qui est seul dans la file → ne plus afficher "tu es le prochain"
  var dejaDesiste = fe && (fe.desistements||0)>0;
  var seulApresDesist = dejaDesiste && totalFile===1;
  function inscrireMoi(){
    if(unite==="lignes"){
      var n=Math.max(minL, Math.min(maxL, nbLignes||minL));
      p.onInscrire(p.occ, n, "lignes");
    } else {
      var d=Math.max(minD, Math.min(maxD, duree||minD));
      p.onInscrire(p.occ, d, "secondes");
    }
  }
  var fluence = h("p",{style:{fontSize:".72rem",color:"var(--gris)",fontStyle:"italic",marginTop:8,lineHeight:1.4,paddingTop:6,borderTop:"1px dashed #e2e6ef"}},
    "📚 Pour info : en niveau de l'élève, on considère qu'une ligne demande environ "+p.reg.secsParLigne+" seconde"+(p.reg.secsParLigne>1?"s":"")+" de lecture (c'est ce que mesure le test de fluence en 6e et en 4e).");
  return h("div",{className:"sponta-occ",style:{padding:"12px 14px",borderRadius:12,background:"#fff",border:"2px solid "+(fe?"var(--violet)":"#e2e6ef"),marginBottom:8}},
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}},
      h("div",{style:{fontWeight:800,fontSize:".95rem"}}, prenom(p.occ.nom)),
      h("div",{style:{fontSize:".75rem",color:"var(--gris)"}}, "Tu as lu "+nbLec+" fois")),
    fe
      ? h("div",null,
          h("div",{style:{background:"#f1f0fa",padding:"10px 12px",borderRadius:8,marginBottom:8}},
            seulApresDesist
              ? h(React.Fragment,null,
                  h("div",{style:{fontWeight:700,color:"var(--violet)"}}, "⏸ Tu t'es désisté"),
                  h("div",{style:{fontSize:".82rem",color:"var(--gris)",marginTop:2}}, txt("eleve_repassera")))
              : h(React.Fragment,null,
                  h("div",{style:{fontWeight:700,color:"var(--violet)"}}, "⏳ Tu es "+(posFile===1?"le prochain !":(posFile+"e dans la file"))),
                  h("div",{style:{fontSize:".82rem",color:"var(--gris)",marginTop:2}},
                    fe.unite==="secondes"
                      ? ((fe.dureeSec||0)+"s prévue"+(fe.dureeSec>1?"s":""))
                      : ((fe.nbLignes||0)+" ligne"+((fe.nbLignes||0)>1?"s":"")+" prévue"+((fe.nbLignes||0)>1?"s":""))))),
          h("button",{className:"btn btn-ghost",style:{width:"100%",fontSize:".88rem"},
            disabled:fe.desistements>=MAX_DESISTEMENTS,
            onClick:function(){p.onDesister(p.occ);},
            title:fe.desistements>=MAX_DESISTEMENTS?"Tu as utilisé tes 2 désistements. Tu ne peux plus passer ton tour.":"Va en fin de file. Tu gardes ton inscription (max 2 désistements)."},
            "⏸ Je passe mon tour ("+(MAX_DESISTEMENTS-(fe.desistements||0))+" restant"+((MAX_DESISTEMENTS-(fe.desistements||0))>1?"s":"")+")"),
          fluence)
      : h("div",null,
          msgTimide ? h("div",{style:{padding:"10px 12px",borderRadius:8,background:"#fff7ed",border:"1px dashed #fdba74",color:"#9a3412",fontSize:".88rem",marginBottom:10,fontStyle:"italic"}}, msgTimide) : null,
          // Sélecteur de l'unité de mesure
          h("div",{style:{display:"flex",gap:6,marginBottom:10}},
            h("button",{className:"btn"+(unite==="lignes"?" btn-violet":" btn-ghost"),style:{flex:1,fontSize:".82rem",padding:"6px 10px"},
              onClick:function(){setUnite("lignes");},title:"Choisir le nombre de lignes que tu vas lire (le chrono se règle tout seul)."},"📏 Par lignes"),
            h("button",{className:"btn"+(unite==="secondes"?" btn-violet":" btn-ghost"),style:{flex:1,fontSize:".82rem",padding:"6px 10px"},
              onClick:function(){setUnite("secondes");},title:"Choisir directement la durée que tu te donnes pour lire."},"⏱ Par durée")),
          // Champ selon l'unité choisie
          unite==="lignes"
            ? h("div",{style:{display:"flex",gap:6,alignItems:"center",marginBottom:8}},
                h("label",{style:{fontSize:".82rem",color:"var(--gris)"}}, "Nb lignes :"),
                h("input",{type:"number",min:minL,max:maxL,value:nbLignes,onChange:function(e){var v=parseInt(e.target.value,10); setNbLignes(isNaN(v)?minL:Math.max(minL,Math.min(maxL,v)));},
                  title:"Combien de lignes tu vas lire (entre "+minL+" et "+maxL+"). Le chrono se règle tout seul.",
                  style:{width:60,padding:"6px 8px",borderRadius:8,border:"1px solid #d0d4dd",fontSize:".88rem"}}),
                h("span",{style:{fontSize:".78rem",color:"var(--gris)"}}, "→ ~"+(nbLignes*p.reg.secsParLigne)+"s"))
            : h("div",{style:{display:"flex",gap:6,alignItems:"center",marginBottom:8}},
                h("label",{style:{fontSize:".82rem",color:"var(--gris)"}}, "Durée (s) :"),
                h("input",{type:"number",min:minD,max:maxD,step:5,value:duree,onChange:function(e){var v=parseInt(e.target.value,10); setDuree(isNaN(v)?minD:Math.max(minD,Math.min(maxD,v)));},
                  title:"Durée prévue de ta lecture (entre "+minD+" et "+maxD+" secondes).",
                  style:{width:70,padding:"6px 8px",borderRadius:8,border:"1px solid #d0d4dd",fontSize:".88rem"}}),
                h("span",{style:{fontSize:".78rem",color:"var(--gris)"}}, "(~"+Math.round(duree/p.reg.secsParLigne)+" lignes)")),
          h("button",{className:"btn btn-violet",style:{width:"100%",fontWeight:800,fontSize:"1rem"},
            onClick:inscrireMoi,
            title:"T'inscrit dans la file d'attente. Tu verras ta position. Tu pourras te désister (max 2 fois) si tu changes d'avis."},
            "🎤 Je veux lire !"),
          fluence));
}

function EleveVote(p){
  var reg=p.reg, session=p.session||{};
  var reader=session.reader;
  var paused=!!session.pauseStartedAt;
  var occupants=p.occupants||[];
  var phase=calcPhase(session, reg);
  var enVote=phase==="vote", enBilan=phase==="bilan";
  var lecteurEstIci=false;
  for(var ii=0;ii<occupants.length;ii++){ if(occupants[ii].nom===reader){ lecteurEstIci=true; break; } }
  var nbCrit=reg.criteres.length;
  var valsRef=useRef((function(){var a=[]; for(var k=0;k<nbCrit;k++) a.push(0); return a;})());
  var pressRef=useRef({});                 // {i: intervalId} — un slot par bouton pour gérer multi-touch sans fuite
  var sd=useState(0), setDraw=sd[1];
  var sComp=useState({}), monComp=sComp[0], setMonComp=sComp[1];
  var lastReaderRef=useRef(reader);
  var decayRef=useRef(reg.decay);            // évite la reconnexion de la tablette à chaque ajustement du slider décroissance
  decayRef.current=reg.decay;
  var nbCritRef=useRef(nbCrit);
  // ─── Mode spontané : états additionnels ───
  var sFile=useState({}), fileE=sFile[0], setFileE=sFile[1];                  // /file (visible élève pour savoir si LUI est inscrit ; jamais affichée intégralement)
  var sCompt=useState({}), compteursE=sCompt[0], setCompteursE=sCompt[1];     // /compteurLectures
  var sTab=useState({}), tabE=sTab[0], setTabE=sTab[1];                       // /tablettes (pour timides)
  var sH=useState({}), histE=sH[0], setHistE=sH[1];                           // /historiqueLectures (pour total passages session)
  useEffect(function(){
    var r1=db.ref(DB_ROOT+"/file"); var f1=r1.on("value",function(s){setFileE(s.val()||{});});
    var r2=db.ref(DB_ROOT+"/compteurLectures"); var f2=r2.on("value",function(s){setCompteursE(s.val()||{});});
    var r3=db.ref(DB_ROOT+"/tablettes"); var f3=r3.on("value",function(s){setTabE(s.val()||{});});
    var r4=db.ref(DB_ROOT+"/historiqueLectures"); var f4=r4.on("value",function(s){setHistE(s.val()||{});});
    return function(){r1.off("value",f1); r2.off("value",f2); r3.off("value",f3); r4.off("value",f4);};
  },[]);
  // ─── Helpers spontané ───
  function inscrire(occ, valeur, unite){
    // unite = 'lignes' | 'secondes' (par défaut 'lignes' si non précisé pour compat)
    unite = unite || "lignes";
    var pres=slugsPresents(tabE, p.absents||[]);
    var presNoms=[];
    pres.forEach(function(s){
      Object.keys(tabE).some(function(tid){
        var occs=toArr(tabE[tid] && tabE[tid].occupants);
        return occs.some(function(o){ if(o.slug===s){ presNoms.push(o.nom); return true; } return false; });
      });
    });
    var dejaInscrits={}; Object.keys(fileE||{}).forEach(function(k){dejaInscrits[k]=true;});
    var r=peutSinscrire(occ.slug, compteursE, pres, presNoms, reg.ecartLectures, dejaInscrits);
    if(!r.ok){ alert(r.raison); return; }
    var entry={nom:occ.nom, unite:unite, inscritLe:Date.now(), desistements:0};
    if(unite==="lignes"){ entry.nbLignes=valeur; entry.dureeSec=valeur*reg.secsParLigne; }
    else { entry.dureeSec=valeur; entry.nbLignes=Math.round(valeur/reg.secsParLigne); }
    db.ref(DB_ROOT+"/file/"+occ.slug).set(entry);
  }
  function desister(occ){
    var fe=fileE[occ.slug]; if(!fe) return;
    if(fe.desistements>=MAX_DESISTEMENTS){ alert("Tu as déjà utilisé tes "+MAX_DESISTEMENTS+" désistements. Pour ne pas pénaliser les autres, tu dois lire ou être retiré par le prof."); return; }
    if(!confirm("Tu vas en fin de file (tu gardes ton inscription). Désistements utilisés : "+(fe.desistements+1)+" / "+MAX_DESISTEMENTS+". Confirmer ?")) return;
    db.ref(DB_ROOT+"/file/"+occ.slug).update({inscritLe:Date.now(), desistements:(fe.desistements||0)+1});
  }
  function arreterMaLecture(){
    // Le lecteur s'arrête lui-même : équivalent setReader("") sans archivage de vote (passage en cours non terminé proprement)
    db.ref(DB_ROOT+"/historiqueLectures/"+session.passageId).update({lecteur:reader, classeSlug:session.classeSlug, annule:true, finalisedAt:Date.now()});
    db.ref(DB_ROOT+"/live").remove();
    db.ref(DB_ROOT+"/compliments").remove();
    db.ref(DB_ROOT+"/liveSnapshot").remove();
    db.ref(DB_ROOT+"/votes/"+session.passageId).remove();
    db.ref(DB_ROOT+"/session").update({reader:"", passageId:"", startedAt:null, messageFinIdx:null, pauseStartedAt:null, pausedDuration:0, phaseLockee:null, nbLignes:null, dureeOverride:null});
  }
  // Total passages de la session (pour le trigger timide)
  var totalPassagesSession = 0;
  if(session.sessionId){
    // on lit seances[session.sessionId].passages mais on ne l'a pas ici directement ; à défaut on compte historique filtré par classeSlug + bilanTermine
    Object.keys(histE).forEach(function(pid){
      var hp=histE[pid];
      if(hp && hp.bilanTermine && !hp.annule && hp.classeSlug===session.classeSlug) totalPassagesSession++;
    });
  }
  // ajuste la taille de valsRef si le nombre de critères change pendant la session
  if(valsRef.current.length!==nbCrit){
    var resized=[]; for(var rk=0;rk<nbCrit;rk++) resized.push(valsRef.current[rk]||0);
    valsRef.current=resized;
  }
  nbCritRef.current=nbCrit;
  // libellé Firebase = liste des prénoms (pour info au prof, agrégation reste par table)
  var noms = occupants.map(function(o){return prenom(o.nom);}).join(" + ");

  useEffect(function(){
    if(lastReaderRef.current!==reader){
      var z=[]; for(var k=0;k<nbCritRef.current;k++) z.push(0);
      valsRef.current=z; setMonComp({}); lastReaderRef.current=reader;
    }
  },[reader]);

  useEffect(function(){
    var tableId=p.table;
    var iv=setInterval(function(){
      var dt=0.25;
      var v=valsRef.current.slice();
      var dec=decayRef.current||0;             // lecture live via ref : pas de remount à chaque changement
      var nC=nbCritRef.current;
      for(var i=0;i<nC;i++){
        v[i]=(v[i]||0)*(1-(dec/100)*dt);
        if(v[i]<0.4) v[i]=0;
      }
      valsRef.current=v;
      var payload={table:p.table, nom:noms, ts:Date.now()};
      for(var ip=0;ip<nC;ip++) payload["c"+ip]=v[ip]||0;
      db.ref(DB_ROOT+"/live/"+tableId).set(payload);
      setDraw(function(x){return x+1;});
    },250);
    var ref=db.ref(DB_ROOT+"/live/"+tableId);
    ref.onDisconnect().remove();
    return function(){ clearInterval(iv); ref.remove(); };
  },[p.table,noms]);                          // reg.decay et nbCrit retirés : gérés par refs sans remount

  function applaudir(i){
    if(!reader||paused) return;
    var v=valsRef.current.slice();
    v[i]=Math.min(100, (v[i]||0)+reg.boost);
    valsRef.current=v; setDraw(function(x){return x+1;});
  }
  function startPress(i){
    applaudir(i);
    if(pressRef.current[i]) clearInterval(pressRef.current[i]);   // évite l'accumulation si pointerdown dupliqué
    pressRef.current[i]=setInterval(function(){applaudir(i);},80);
  }
  function stopPress(i){
    if(typeof i==="number"){
      if(pressRef.current[i]){ clearInterval(pressRef.current[i]); delete pressRef.current[i]; }
    } else {
      // fallback : stoppe tous les intervalles (au démontage ou en sécurité)
      Object.keys(pressRef.current).forEach(function(k){ clearInterval(pressRef.current[k]); });
      pressRef.current={};
    }
  }
  function toggleComp(i){
    if(!reader||paused) return;
    var nc=Object.assign({},monComp);
    var ref=db.ref(DB_ROOT+"/compliments/"+i);
    if(nc[i]){ delete nc[i]; ref.transaction(function(c){return Math.max(0,(c||0)-1);}); }
    else { nc[i]=1; ref.transaction(function(c){return (c||0)+1;}); }
    setMonComp(nc);
  }

  // ─── Rendu de la phase courante (extrait du return pour empêcher tout ré-enfouissement) ───
  function renderPhase(){
    // 1) Pas de lecteur désigné
    if(!reader){
      if(reg.modeSpontane){
        return h("div",{style:{flex:1,padding:12,overflowY:"auto"}},
          h("div",{style:{textAlign:"center",marginBottom:14}},
            h("div",{style:{fontSize:"2rem"}},"🎙️"),
            h("div",{style:{fontWeight:800,color:"var(--violet)",marginTop:4}},"Lecture spontanée"),
            h("p",{className:"muted",style:{fontSize:".82rem",marginTop:4}},"Tu peux t'inscrire pour lire à ton tour.")),
          occupants.map(function(occ){
            return h(PanneauSpontane,{key:occ.slug,occ:occ,reg:reg,fileE:fileE,compteursE:compteursE,tabE:tabE,absents:p.absents||[],totalPassagesSession:totalPassagesSession,
              onInscrire:inscrire, onDesister:desister});
          }));
      }
      return h("div",{className:"eleve-wait"},h("div",{className:"big"},"⏳"),
        h("p",{className:"muted"},"Attends que le professeur désigne un lecteur."));
    }
    // 2) Phase vote
    if(enVote){
      return h(PhaseVote,{occupants:occupants,reader:reader,reg:reg,passageId:session.passageId||""});
    }
    // 3) Phase bilan
    if(enBilan){
      // Si mode spontané ET le lecteur n'est pas sur cette tablette : on ouvre la file
      // pour que les non-lecteurs s'inscrivent pendant que l'autre consulte son bilan.
      if(reg.modeSpontane && !lecteurEstIci){
        return h("div",{style:{flex:1,padding:12,overflowY:"auto"}},
          h("div",{style:{textAlign:"center",marginBottom:12,padding:"10px 12px",background:"#f1f0fa",borderRadius:10}},
            h("div",{style:{fontWeight:700,color:"var(--violet)"}},"✅ "+prenom(reader)+" consulte son bilan"),
            h("p",{className:"muted",style:{fontSize:".82rem",marginTop:4}},"Pendant ce temps, inscris-toi pour la suite !")),
          occupants.map(function(occ){
            return h(PanneauSpontane,{key:occ.slug,occ:occ,reg:reg,fileE:fileE,compteursE:compteursE,tabE:tabE,absents:p.absents||[],totalPassagesSession:totalPassagesSession,
              onInscrire:inscrire, onDesister:desister});
          }));
      }
      return h(PhaseBilan,{occupants:occupants,reader:reader,reg:reg,
        passageId:session.passageId||"",lecteurEstIci:lecteurEstIci});
    }
    // 4) Lecture terminée, attente du vote
    if(phase==="fin"){
      return h("div",{className:"eleve-wait"},
        h("div",{className:"big"},"⏳"),
        h("div",{style:{fontWeight:800,fontSize:"1.1rem",color:"var(--violet)",marginTop:8}},
          "Lecture terminée"),
        h("p",{className:"muted",style:{marginTop:8}},
          "Le prof va lancer le tour de vote."));
    }
    // 5) Pause (cercle respirant)
    if(paused){
      return h("div",{className:"eleve-pause"},
        h("div",{className:"eleve-pause-label"},"⏸ Pause"),
        h("div",{className:"eleve-pause-circle"}),
        h("p",{className:"eleve-pause-msg"},"On reprend dans un instant. Suis la respiration du cercle si tu veux."));
    }
    // 6) Applaudimètre live (par défaut)
    return h(React.Fragment,null,
      h("div",{className:"zones-multi zones-"+occupants.length},
        occupants.map(function(occ,zi){
          var jeLis = reader === occ.nom;
          var coul = couleurZone(zi);
          // L'élève doit voir SANS AMBIGUÏTÉ qu'il tape dans SON espace : son nom complet,
          // sa couleur, et la marque que son identité a été vérifiée à l'entrée.
          return h("div",{className:"zone-occ"+(jeLis?" zone-lecteur":""),key:occ.slug,
              style:jeLis?null:{borderColor:coul.trait,background:coul.fond}},
            h("div",{className:"zone-hdr",style:{borderBottom:"1px solid "+coul.trait,paddingBottom:4}},
              h("span",{className:"zone-name"},
                h("span",{style:{color:coul.trait,fontWeight:900}},"● "),
                occ.nom,
                occ.atteste? h("span",{style:{fontSize:".72rem",fontWeight:700,color:coul.trait,marginLeft:6},
                  title:"Ton identité a été vérifiée à l'entrée : c'est bien ton espace."},"✓ vérifié") : null),
              h("button",{className:"zone-rm",onClick:function(){
                if(confirm("Retirer "+prenom(occ.nom)+" de cette tablette ?")) p.onRemoveOccupant(occ.slug);
              },title:"Retirer "+prenom(occ.nom)+" de cette tablette."},"×")),
            jeLis
              ? h("div",{className:"zone-overlay"},
                  h("div",{className:"big"},"🎤"),
                  h("div",{style:{fontWeight:800,marginTop:6,color:"var(--violet)"}},"C'est à toi"),
                  session.nbLignes ? h("div",{style:{fontSize:".88rem",color:"var(--gris)",marginTop:2}}, session.nbLignes+" ligne"+(session.nbLignes>1?"s":"")) : null,
                  h("p",{className:"muted",style:{fontSize:".82rem",marginTop:6,marginBottom:10}},"Laisse tes camarades t'encourager."),
                  reg.modeSpontane ? h("button",{className:"btn btn-ghost",style:{fontSize:".82rem",padding:"6px 12px"},
                    onClick:function(){
                      if(confirm("Tu arrêtes ta lecture maintenant ? Ton passage sera marqué comme interrompu (pas de vote).")) arreterMaLecture();
                    },
                    title:"Tu arrêtes ta lecture toi-même. Le passage est marqué annulé, pas de phase vote."},"⏹ J'arrête") : null)
              : h("div",{className:"zone-grid crit-"+nbCrit},
                  reg.criteres.map(function(c,i){
                    var pct=Math.max(0,Math.min(100,valsRef.current[i]||0));
                    return h("button",{key:i,className:"clap-btn clap-c"+(i%8),
                      title:"Maintiens ou tape pour faire monter le critère « "+c.label+" ».",
                      onPointerDown:function(e){e.preventDefault();startPress(i);},
                      onPointerUp:function(){stopPress(i);},
                      onPointerLeave:function(){stopPress(i);},
                      onPointerCancel:function(){stopPress(i);}},
                      h("div",{className:"clap-fill",style:{height:pct+"%"}}),
                      h("span",{className:"ce"},c.emoji),
                      h("span",{className:"cl"},c.label));
                  })));
        })),
      reg.complimentsOn && h("div",{className:"compliments-bar"},
        h("div",{className:"ttl"},"💛 Un compliment ? (facultatif)"),
        h("div",null, reg.compliments.map(function(txt,i){
          return h("button",{key:i,className:"comp-chip"+(monComp[i]?" on":""),onClick:function(){toggleComp(i);},
            title:monComp[i]?"Retirer ton compliment.":"Envoyer ce compliment au tableau."},txt);
        }))));
  }

  return h("div",{className:"eleve"},
    h("div",{className:"hdr"},
      h("button",{className:"btn-back",onClick:p.onChangerOccupants,
        title:"Libère cette tablette pour 3 nouveaux élèves. Les occupants actuels sont déconnectés ; la tablette reste à cette table."},"↻ Élèves suivants"),
      h("h2",null,"Table "+p.table.slice(1)+" · "+occupants.length+"/3")),
    h("div",{className:"eleve-reader"},
      reader
        ? h(React.Fragment,null,h("div",{className:"lbl"},"on écoute"),h("div",{className:"who"},"🎤 "+prenom(reader)))
        : h("div",{className:"who"},"⏳ attends le prof")),
    p.test? h("div",{style:{margin:"6px 8px 0",padding:"6px 10px",borderRadius:8,background:"rgba(245,158,11,.16)",border:"1.5px dashed #f59e0b",fontSize:".78rem",fontWeight:700,textAlign:"center",color:"var(--noir)"}},
      "⚙️ MODE TEST — élèves fictifs, rien n'est enregistré pour de vrai") : null,
    // Q7 (amélioration pédagogique n°4) : on écoute MIEUX quand on sait ce qu'on écoute.
    // Les critères sont montrés AVANT que quiconque lise, tant qu'aucun lecteur n'est désigné.

        }))) : null,
    renderPhase(),
    // Bouton « ajouter un élève » : uniquement pendant la phase de connexion,

    h(HelpFab,{role:"eleve"}));
}

function ModaleCheckIn(p){

  var checked=s1[0], setChecked=s1[1];
  var sLib=useState(""), libelle=sLib[0], setLibelle=sLib[1];
  function toggle(slug){ var c=Object.assign({},checked); if(c[slug]) delete c[slug]; else c[slug]=true; setChecked(c); }
  function toutPresent(){ setChecked({}); }
  function valider(){
    var absents=Object.keys(checked);
    p.onValider(absents, libelle.trim());
  }
  var eleves=p.eleves||[];
  var nbAbs=Object.keys(checked).length;
  return h("div",{className:"help-back",onClick:function(e){if(e.target.className==="help-back")p.onCancel();}},

        h("input",{value:libelle,onChange:function(e){setLibelle(e.target.value);},
          placeholder:p.libellePlaceholder||"4e Banksy — séance lecture",
          style:{width:"100%",padding:"10px 12px",borderRadius:8,border:"1px solid #d0d4dd",fontSize:"1rem"}})) : null,
      h("div",{className:"checkin-list"},
        eleves.map(function(nom){
          var slug=san(nom);
          var abs=!!checked[slug];
          return h("button",{key:slug,className:"checkin-row"+(abs?" abs":""),onClick:function(){toggle(slug);},
            title:abs?"Cliquer pour remettre présent.":"Cliquer pour marquer absent."},

        h("button",{className:"btn btn-bleu",onClick:toutPresent,title:"Décoche tout le monde et passe en mode tous présents."},"Tout le monde présent"),
        h("button",{className:"btn btn-violet",style:{flex:1},onClick:valider,
          title:p.modifier?"Met à jour la liste des absents pour la séance en cours.":"Démarre la séance avec le libellé et les absents choisis."},
          p.modifier?"Enregistrer":"🚀 Lancer la séance"))));
}
