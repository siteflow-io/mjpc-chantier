// ════════════ « MES LECTURES » — l'élève, hors séance (point 8) ════════════
// À l'image de « Mes dictées » (dictee_universelle) et de « Mes évaluations » (QCM) :
// lecture seule, aucun recalcul, aucune écriture. L'accès demande la même identité
// attestée que la tablette : nom + prénom + code personnel, ou la session MJPC du site.
function MesLectures(p){
  var se=useState(null), eleve=se[0], setEleve=se[1];
  var sc=useState(null), classes=sc[0], setClasses=sc[1];
  var sn=useState(""), nom=sn[0], setNom=sn[1];
  var sp=useState(""), pre=sp[0], setPre=sp[1];
  var scd=useState(""), code=scd[0], setCode=scd[1];
  var ser=useState(""), err=ser[0], setErr=ser[1];
  var sb=useState(false), busy=sb[0], setBusy=sb[1];
  var sl=useState(null), lectures=sl[0], setLectures=sl[1];

  var smt=useState(false), modeTest=smt[0], setModeTest=smt[1];
  var sct=useState(null), codesTest=sct[0], setCodesTest=sct[1];
  useEffect(function(){
    db.ref("classes").once("value").then(function(sn2){ setClasses(sn2.val()||{}); },function(){ setClasses({}); });
    db.ref(DB_ROOT+"/session").once("value").then(function(sn3){
      var s=sn3.val()||{};
      setModeTest(s.modeTest===true);
      setCodesTest(s.codesTest||null);
    },function(){});
  },[]);

  // La classe n'est pas demandée à l'élève : elle est retrouvée au registre (patron M11).
  // Les classes internes sont ignorées — SAUF en mode test, sans quoi l'écran ne serait
  // pas éprouvable avec le jeu fictif, alors que le mode test doit incarner les vrais écrans.
  function trouverClasse(cle){
    var reg=classes||{};
    var ks=Object.keys(reg);
    for(var i=0;i<ks.length;i++){
      if((estClasseTest(ks[i])||estClasseInterne(ks[i])) && !(ks[i]===TEST_SLUG && modeTest)) continue;
      var r=extractEleves(reg[ks[i]],[]);
      for(var j=0;j<r.length;j++){ if(san(r[j])===cle) return {classe:ks[i], nom:r[j]}; }
    }
    return null;
  }
  function charger(idn){
    setEleve(idn); setLectures(null);
    Promise.all([
      db.ref("mjpcProfils/"+idn.classe+"/"+idn.cle+"/lectures").once("value").then(function(x){return x.val()||{};},function(){return {};}),
      db.ref(DB_ROOT+"/historiqueLectures").once("value").then(function(x){return x.val()||{};},function(){return {};}),
      db.ref(DB_ROOT+"/seances").once("value").then(function(x){return x.val()||{};},function(){return {};})
    ]).then(function(r){
      var profil=r[0], hist=r[1], seances=r[2];
      var out={};
      Object.keys(profil).forEach(function(pid){ out[pid]=Object.assign({}, profil[pid]); });
      // les passages antérieurs à la remontée restent visibles : ils sont dans l'historique
      Object.keys(hist).forEach(function(pid){
        var hp=hist[pid]||{};
        if(san(hp.lecteur||"")!==idn.cle) return;
        if(hp.annule) return;
        out[pid]=Object.assign({date:hp.finalisedAt||hp.startsAt||0, passageId:pid,
          libelleSeance:"", test:hp.test===true}, out[pid]||{});
        if(!out[pid].libelleSeance){
          var sid=Object.keys(seances).filter(function(k){ return (seances[k].passages||{})[pid]; })[0];
          if(sid) out[pid].libelleSeance=(seances[sid]||{}).libelle||"";
        }
        out[pid].termine=hp.bilanTermine===true;
        out[pid].nbLignes=hp.nbLignes||null;
      });
      var arr=Object.keys(out).map(function(pid){ return Object.assign({pid:pid}, out[pid]); });
      arr.sort(function(a,b){ return (b.date||0)-(a.date||0); });
      setLectures(arr);
    });
  }
  function valider(){
    if(busy) return;
    var n=nom.trim(), pr=pre.trim(), cd=code.trim();
    if(!n||!pr){ setErr("Saisis ton nom ET ton prénom."); return; }
    if(!cd){ setErr("Saisis ton code personnel."); return; }
    var cle=san((n+" "+pr).toLowerCase());
    var trouve=trouverClasse(cle);
    if(!trouve){ setErr("Ce nom n'est pas dans les listes de classe. Vérifie l'orthographe."); return; }
    setBusy(true);
    lireCodeEleveMJPC(db, cle, codesTest).then(function(r){
      setBusy(false);
      if(r.etat==="erreur"){ setErr("Ton code n'a pas pu être vérifié pour l'instant. Réessaie dans un instant."); return; }
      if(r.etat==="absent"){ setErr("Aucun code personnel n'est enregistré pour ce nom. Signale-le pour qu'on te le remette."); return; }
      if(String(r.code)!==cd){ setErr("Ce code ne correspond pas à ce nom. Vérifie tes chiffres."); setCode(""); return; }
      charger({cle:cle, nom:trouve.nom, classe:trouve.classe});
    });
  }
  // Shunt §8 : identité du site, aucun mot à retaper
  function identiteSite(){
    var sess=null;
    try{ sess=lireSessionMJPC(); }catch(e){ return null; }
    if(!sess || sess.is_prof===true || !classes) return null;
    return validerEleveMJPC(sess, classes);
  }

  if(!eleve){
    var idn=identiteSite();
    return h("div",{className:"eleve"},
      h("div",{className:"hdr"},
        h("button",{className:"btn-back",onClick:p.onBack,title:"Retour à l'accueil."},"← Accueil"),
        h("h2",null,"Mes lectures")),
      h("div",{className:"form-wrap"},
        classes===null? h("p",{className:"muted",style:{textAlign:"center"}},"Un instant…") :
        h(React.Fragment,null,
          idn? h("div",{style:{maxWidth:420,margin:"0 auto 16px",padding:"12px 14px",background:"rgba(124,92,255,.08)",border:"1.5px solid rgba(124,92,255,.35)",borderRadius:12,textAlign:"center"}},
            h("div",{style:{fontSize:".85rem",color:"var(--gris)",marginBottom:8}},"Tu es déjà identifié sur le site :"),
            h("button",{className:"btn btn-violet btn-lg",style:{width:"100%"},onClick:function(){charger(idn);},
              title:"Voir tes lectures avec l'identité déjà vérifiée sur le site MJPC."},"✓ C'est moi — "+idn.nom)) : null,
          h("p",{className:"muted",style:{textAlign:"center",marginBottom:14}},"Retrouve les passages que tu as déjà lus. Tape ton nom, ton prénom et ton code personnel."),
          h("div",{className:"form-connect"},
            h("div",{className:"field"},h("label",null,"Nom"),
              h("input",{value:nom,onChange:function(e){setNom(e.target.value);setErr("");},autoFocus:true,
                onKeyDown:function(e){if(e.key==="Enter")valider();},placeholder:"DUPONT",autoCapitalize:"characters"})),
            h("div",{className:"field"},h("label",null,"Prénom"),
              h("input",{value:pre,onChange:function(e){setPre(e.target.value);setErr("");},
                onKeyDown:function(e){if(e.key==="Enter")valider();},placeholder:"Léa",autoCapitalize:"words"})),
            h("div",{className:"field"},h("label",null,"Ton code personnel"),
              h("input",{type:"password",value:code,onChange:function(e){setCode(e.target.value);setErr("");},
                onKeyDown:function(e){if(e.key==="Enter")valider();},placeholder:"••••",inputMode:"numeric",
                autoComplete:"off",style:{letterSpacing:".3em",textAlign:"center"}})),
            err? h("div",{className:"form-err"},err) : null,
            h("div",{className:"btn-row"},
              h("button",{className:"btn btn-violet btn-lg",style:{flex:1,opacity:busy?.6:1},disabled:busy,onClick:valider,
                title:"Vérifie ton nom au registre de ta classe et ton code personnel."}, busy?"Vérification…":"Voir mes lectures"))))),
      h(HelpFab,{role:"eleve"}));
  }

  return h("div",{className:"eleve"},
    h("div",{className:"hdr"},
      h("button",{className:"btn-back",onClick:function(){setEleve(null);setLectures(null);setCode("");},title:"Revenir à l'écran d'identification."},"← Retour"),
      h("h2",null,"Mes lectures")),
    h("div",{className:"wrap"},
      h("div",{className:"card"},
        h("h3",null,"📖 "+eleve.nom),
        h("div",{style:{fontSize:".85rem",color:"var(--gris)",marginBottom:10}},eleve.classe),
        lectures===null? h("p",{className:"muted"},"Un instant…") :
        (lectures.length===0
          ? h("p",{className:"muted"},"Tu n'as pas encore lu à voix haute ici. Ton premier passage apparaîtra sur cette page.")
          : h("div",{className:"seances-list"},
              lectures.map(function(l){
                return h("div",{key:l.pid,className:"seance-row"},
                  h("div",{className:"seance-info"},
                    h("div",{className:"seance-lib"}, l.libelleSeance||"Passage de lecture"),
                    h("div",{className:"seance-meta"},
                      (l.date? new Date(l.date).toLocaleDateString("fr-FR") : "date inconnue")
                      + (l.nbLignes? " · "+l.nbLignes+" ligne"+(l.nbLignes>1?"s":"") : "")
                      + (l.test? " · essai" : ""))),
                  h("div",{style:{fontSize:".82rem",fontWeight:700,color:l.termine?"#16a34a":"var(--gris)"}},
                    l.termine? "✅ évalué" : "en cours"));
              }))))),
    h(HelpFab,{role:"eleve"}));
}

function App(){
  var sm=useState(null), mode=sm[0], setMode=sm[1];
  var stt=useState(false), test=stt[0], setTest=stt[1];
  var sa=useState(function(){try{return sessionStorage.getItem("am_auth")==="1";}catch(e){return false;}}), auth=sa[0], setAuth=sa[1];
  var sqe=useState(""), quitErr=sqe[0], setQuitErr=sqe[1];
  var sqb=useState(false), quitBusy=sqb[0], setQuitBusy=sqb[1];
  // Le mode test est porté par la SESSION, plus par un état React seul : il survit
  // à un rechargement, se voit sur tous les postes et depuis la modale du site.
  useEffect(function(){
    var r=db.ref(DB_ROOT+"/session/modeTest");
    var f=r.on("value",function(s){ setTest(s.val()===true); });
    return function(){ r.off("value",f); };
  },[]);
  // Surcharge des textes élève : ce que le professeur a écrit prime sur le seed.
  var stx=useState(0), setTextesV=stx[1];
  useEffect(function(){
    var r=db.ref(DB_ROOT+"/session/textes");
    var f=r.on("value",function(s){ TEXTES_SURCHARGE=s.val()||{}; setTextesV(function(n){return n+1;}); });
    return function(){ r.off("value",f); };
  },[]);
  // ── Shunt §8 du socle 1.1.0 : le professeur déjà connecté au site MJPC entre
  // directement (leçon M9 : is_prof → authentifié, sans repasser par le code).
  // Sans session MJPC, le portail natif de l'app est inchangé.
  var ssh=useState(false), shuntProf=ssh[0], setShuntProf=ssh[1];
  useEffect(function(){
    var sess=null;
    try{ sess=lireSessionMJPC(); }catch(e){ sess=null; }
    if(sess && sess.is_prof===true){ setAuth(true); setShuntProf(true); }
  },[]);
  useEffect(function(){
    var q=new URLSearchParams(window.location.search);
    var md=q.get("mode"), vw=q.get("view");
    if(vw==="board"||md==="board") setMode("board");
    else if(vw==="phone") setMode("phone");
    else if(md==="prof") setMode("prof");
    else if(md==="eleve") setMode("eleve");
    else if(md==="mesLectures"||vw==="mesLectures") setMode("mesLectures");   // ouverture directe depuis le site
  },[]);
  // La sortie du test ne s'annonce QUE si tout a été supprimé. Un refus du serveur
  // laisse le mode test actif, affiche les chemins fautifs, et ne remet pas la session
  // à zéro : mieux vaut un test qui refuse de sortir qu'un résidu invisible.
  function quitterTest(){
    if(quitBusy) return;
    setQuitBusy(true); setQuitErr("");
    purgeTestMJPC(db, {volatils:true, classe:true}).then(function(pg){
      if(!pg.ok){
        setQuitBusy(false);
        setQuitErr("Le mode test n'est pas sorti proprement : "+pg.refus.length+" élément(s) n'ont pas pu être supprimés — "
          + pg.refus.map(function(x){ return x.chemin+" ("+x.message+")"; }).join(" · ")
          + ". Les données fictives sont encore présentes : réessaie avant de démarrer une séance réelle.");
        return null;
      }
      return db.ref(DB_ROOT+"/session").update({classeSlug:"", reader:"", demarreeLe:null, sessionId:null, absents:[], passageId:"", startedAt:null, messageFinIdx:null, pauseStartedAt:null, pausedDuration:0, phaseLockee:null, modeTest:null, codesTest:null})
        .then(function(){ setQuitBusy(false); setTest(false); setMode(null); });
    }).catch(function(e){
      setQuitBusy(false);
      setQuitErr("La sortie du mode test a échoué : "+((e&&e.message)||"erreur inconnue")+". Des données fictives sont peut-être encore présentes.");
    });
  }
  // Gate code 1312 sur tout accès prof/tableau/téléphone (URL directe ou bouton accueil)
  if((mode==="prof"||mode==="board"||mode==="phone") && !auth){
    return h(CodeGate,{onOk:function(){setAuth(true);},onCancel:function(){setMode(null); try{window.history.replaceState({},"",window.location.pathname);}catch(e){}}});
  }
  try{ window.__AM_VUE = mode || "accueil"; }catch(e){}     // décide où une alerte technique peut s'afficher
  if(mode==="prof") return h(AppProf,{onBack:function(){setMode(null);},test:test,onQuitTest:quitterTest,quitErr:quitErr,quitBusy:quitBusy});
  if(mode==="board") return h(VueBoard,{onBack:function(){setMode(null);}});
  if(mode==="phone") return h(PhonePilot,{onBack:function(){setMode(null);},test:test,onQuitTest:quitterTest,quitErr:quitErr,quitBusy:quitBusy});
  if(mode==="eleve") return h(AppEleve,{onBack:function(){setMode(null);}});
  if(mode==="mesLectures") return h(MesLectures,{onBack:function(){setMode(null);}});
  return h(Accueil,{go:setMode,test:test,onTest:function(){setTest(true);}});
}

function FbBanner(){
  var bad=false;
  try{ var u=(firebase.app().options.databaseURL)||""; if(!u||u.indexOf("REMPLACER")>=0) bad=true; }catch(e){ bad=true; }
  if(!bad) return null;
  return h("div",{style:{position:"fixed",top:0,left:0,right:0,zIndex:3000,background:"var(--rouge)",color:"#fff",padding:"9px 14px",fontSize:".84rem",fontWeight:700,textAlign:"center",lineHeight:1.35}},
    "⚠️ Config Firebase non renseignée — remplace les « REMPLACER… » en haut du fichier (puis déploie sur GitHub Pages). Sans ça, rien ne peut être enregistré.");
}
function PastilleVersion(){
  return h("div",{style:{position:"fixed",bottom:10,right:10,zIndex:2500,background:"rgba(31,31,46,.72)",color:"#fff",
      borderRadius:8,padding:"3px 8px",font:"700 11px system-ui,sans-serif",letterSpacing:".02em",pointerEvents:"none"},
    title:"Version de l'application"}, "v"+APP_VERSION);
}
function Root(){ return h(React.Fragment,null, h(FbBanner), h(App), h(PastilleVersion)); }

// ═══════ DEBUG : ErrorBoundary React pour capter les erreurs production-build ═══════
// À retirer une fois le bug Cannot read 'slice' localisé.
function ErrorBoundary(props){ this.props=props; this.state={err:null,stack:""}; }
ErrorBoundary.prototype = Object.create(React.Component.prototype);
ErrorBoundary.prototype.constructor = ErrorBoundary;
ErrorBoundary.getDerivedStateFromError = function(error){ return {err:error, stack:(error&&error.stack)||""}; };
ErrorBoundary.prototype.componentDidCatch = function(error, info){
  var pile=(error&&error.stack||"")+"\n\n--- React component stack ---"+(info&&info.componentStack||"");
  __amJournaliser("erreur React", (error&&error.message)||error, pile);
  this.setState({err:error, stack:pile});
};
ErrorBoundary.prototype.render = function(){
  if(this.state.err){
    var full = "ERREUR REACT\n" + String(this.state.err && this.state.err.message || this.state.err) + "\n\n" + this.state.stack;
    // Vue tableau ou tablette élève : PAS de trace de pile devant la classe. Un écran
    // sobre, et l'incident est déjà journalisé dans le nœud de diagnostic.
    if(!__amVuePrivee()){
      return h("div",{style:{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,textAlign:"center",background:"var(--fond)",color:"var(--noir)"}},
        h("div",{style:{fontSize:"2.6rem",marginBottom:10}},"⏸"),
        h("div",{style:{fontWeight:800,fontSize:"1.05rem",marginBottom:6}},"L'écran s'est arrêté un instant."),
        h("p",{style:{fontSize:".92rem",lineHeight:1.5,maxWidth:420,color:"var(--gris)"}},"Rien de ce qui a déjà été enregistré n'est perdu. Recharge cette page pour reprendre."),
        h("button",{className:"btn btn-violet btn-lg",style:{marginTop:16},onClick:function(){window.location.reload();},
          title:"Recharger la page pour reprendre là où on en était."},"🔄 Recharger"));
    }
    // Écran professeur : la trace complète, copiable, parce que c'est ici qu'elle sert.
    return h("div",{style:{position:"fixed",top:0,left:0,right:0,bottom:0,background:"#dc2626",color:"#fff",padding:16,fontFamily:"monospace",fontSize:12,zIndex:99999,overflow:"auto"}},
      h("div",{style:{fontSize:18,fontWeight:900,marginBottom:8}},"🐞 Incident technique — écran professeur"),
      h("div",{style:{display:"flex",gap:8,marginBottom:12,position:"sticky",top:0,background:"#dc2626",padding:"4px 0"}},
        h("button",{id:"__rb_copy",style:{background:"#fff",color:"#dc2626",border:0,padding:"10px 16px",borderRadius:6,fontWeight:800,fontSize:13,cursor:"pointer"},
          onClick:function(ev){
            ev.stopPropagation();
            var btn=document.getElementById("__rb_copy");
            if(navigator.clipboard && navigator.clipboard.writeText){
              navigator.clipboard.writeText(full).then(function(){ btn.textContent="✓ Copié !"; }, function(){ btn.textContent="❌ Échec"; });
            } else {
              var pre = document.getElementById("__rb_pre");
              if(pre){
                var rng = document.createRange(); rng.selectNodeContents(pre);
                var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(rng);
                btn.textContent = "✓ Texte sélectionné — Cmd/Ctrl+C";
              }
            }
          }},"📋 Copier l'erreur"),
        h("button",{style:{background:"transparent",color:"#fff",border:"1px solid #fff",padding:"10px 16px",borderRadius:6,fontWeight:800,fontSize:13,cursor:"pointer"},
          onClick:function(ev){ ev.stopPropagation(); window.location.reload(); }},"🔄 Recharger")),
      h("div",{style:{marginBottom:8,fontWeight:700}}, String(this.state.err && this.state.err.message || this.state.err)),
      h("pre",{id:"__rb_pre",style:{whiteSpace:"pre-wrap",fontSize:11,userSelect:"text",WebkitUserSelect:"text",margin:0}}, this.state.stack));
  }
  return this.props.children;
};

ReactDOM.createRoot(document.getElementById("root")).render(h(ErrorBoundary,null,h(Root)));
</script>
