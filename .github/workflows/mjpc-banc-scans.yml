name: MJPC - banc complet des scans

on:
  push:
    branches:
      - c15-remise-zero
    paths:
      - .github/workflows/mjpc-banc-scans.yml
      - MANDATS/REDACTION-UNIVERSELLE/maquette/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scans:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      verdict: ${{ steps.banc.outputs.verdict }}
      captures: ${{ steps.archives.outputs.captures }}
    steps:
      - name: Recuperer le code public du commit demande
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Verifier les sources du banc de reference
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, subprocess
          root = pathlib.Path("MANDATS/REDACTION-UNIVERSELLE/maquette")
          expected = {
              "avancement.js": "e5c2aa4b01dbc4949827235a34b59f170f1307d0",
              "banc/avancement.mjs": "73cac6dc110330aad9d067ccd5f3efc9d501de86",
              "remise-zero.js": "4261fb4d153bc393650d29abdb99481caa8ec3f9",
              "banc/remise-zero.mjs": "abfcd2ce75c14abe86074e8c7f9cc6c7846571db",
              "scan.js": "ade07d1a90701696d62f1ca8fcc4072187fcf5ae",
              "recopie.js": "eabeb708094324a1c8ca03d57c501a5abc0578d0",
              "recopie.css": "c9080da44e371cf39d005ddeb7f04005a97a9502",
              "gen-maquette.py": "25d53e41afe2b0d2f9682417ac44709fde438e69",
              "banc/banc.mjs": "cf0a4dd433374334738c67d98dd0e529f8e2ca1d",
              "banc/recopie.mjs": "3ecbc1294bf8bf7f02749862edd91cee34c7692a",
              "banc/fixture-recopie.py": "b96a0b58aa121522fa75599c0ffd521c55a4f757",
              "banc/verifier-construction.py": "97151c3877e98a7bf2cc90f991eeda51e9b9fae9",
              "C15-maquette-remise-zero-v1-essai2.html": "230438bddd2447f3baf1e89394cc6fd068dc40c8",
              "banc/recopie-lignes-essai.png": "238ee23b628f28751a3550be91d3c570f603bc58",
              "T399-maquette-redaction-scans-v14.html": "c7fb23f32a9280c528f5b1f91229cd945d9f0102",
              "paquet-essai.pdf": "9b4ec27e91a0e6586300945759fb1fa3835a6827",
              "paquet-reperes.pdf": "8a33a028ac1147a07334851ea1cbd96861fde264",
              "scan.css": "35cf61768e07a1a5949f81288084028ae9ba9603",
              "eleve.js": "c0469c5546f26192b0db029a8b70ab75917e272d",
              "grille2.json": "f843068e78b226ac971353a9f627ca3dfbd39391",
              "../../../SAUVEGARDES/redaction-1.1.0-RU-avant-scans-2026-10-30.html": "3c1ed7de294c338d940c4d699a7e707934cf05d0",
          }
          for name, wanted in expected.items():
              actual = subprocess.check_output(["git", "hash-object", str(root / name)], text=True).strip()
              if actual != wanted:
                  raise SystemExit("Source differente : " + name + " " + actual)
              print("Source verifiee :", name, actual)
          PY
          node --version
          npm --version
          node --check MANDATS/REDACTION-UNIVERSELLE/maquette/avancement.js
          node --check MANDATS/REDACTION-UNIVERSELLE/maquette/remise-zero.js
          node --check MANDATS/REDACTION-UNIVERSELLE/maquette/banc/remise-zero.mjs
          node --check MANDATS/REDACTION-UNIVERSELLE/maquette/recopie.js
          node --check MANDATS/REDACTION-UNIVERSELLE/maquette/banc/banc.mjs
          python3 MANDATS/REDACTION-UNIVERSELLE/maquette/banc/verifier-construction.py C15-maquette-remise-zero-v1-essai2.html

      - name: Installer les dependances de test epinglees
        shell: bash
        run: |
          set -euo pipefail
          DEPS_DIR="$RUNNER_TEMP/mjpc-banc-deps"
          npm install --prefix "$DEPS_DIR" --ignore-scripts --no-audit --no-fund playwright@1.56.1 pdfjs-dist@3.11.174
          node "$DEPS_DIR/node_modules/playwright/cli.js" install chromium --with-deps --only-shell

      - name: Executer tout le banc existant et la recopie
        id: banc
        shell: bash
        run: |
          set -euo pipefail
          BANC_DIR="$GITHUB_WORKSPACE/MANDATS/REDACTION-UNIVERSELLE/maquette"
          DEPS_DIR="$RUNNER_TEMP/mjpc-banc-deps"
          export NODE_PATH="$DEPS_DIR/node_modules"
          export PDFJS="$DEPS_DIR/node_modules/pdfjs-dist/build/"
          set +e
          node "$BANC_DIR/banc/banc.mjs" C15-maquette-remise-zero-v1-essai2.html "$RUNNER_TEMP/mjpc-banc-captures" 2>&1 | tee "$RUNNER_TEMP/mjpc-banc.log"
          issue=$?
          set -e
          python3 - <<'PY'
          import os, pathlib
          rows = (pathlib.Path(os.environ["RUNNER_TEMP"]) / "mjpc-banc.log").read_text(errors="replace").splitlines()
          verdicts = [r.strip() for r in rows if r.startswith("BANC : ") or r.startswith("ARRÊT : ")]
          fails = [r.strip() for r in rows if r.startswith("✗ ")]
          verdict = verdicts[-1] if verdicts else "Banc interrompu"
          if fails:
              verdict += " - " + " | ".join(fails)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("verdict=" + verdict[:240] + "\n")
          PY
          exit "$issue"

      - name: Conserver le resultat et les captures dans le journal gratuit
        id: archives
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, os, pathlib, zipfile
          tmp = pathlib.Path(os.environ["RUNNER_TEMP"])
          log = tmp / "mjpc-banc.log"
          captures = tmp / "mjpc-banc-captures"
          text = log.read_text(errors="replace") if log.exists() else "Le banc n'a pas atteint son lancement."
          pngs = sorted(captures.glob("*.png")) if captures.exists() else []
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("captures=" + str(len(pngs)) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("## Banc complet des scans\n\n")
              out.write("Sources et dependances epinglees ; aucune modification du code de l'app.\n\n")
              out.write("Captures PNG : " + str(len(pngs)) + ". Archive inscrite dans le journal, sans stockage d'artefact.\n\n")
              out.write("~~~text\n" + text[-20000:] + "\n~~~\n")
          if pngs:
              archive = io.BytesIO()
              with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as pack:
                  for p in pngs:
                      pack.writestr(p.name, p.read_bytes())
              raw = archive.getvalue()
              encoded = base64.b64encode(raw).decode("ascii")
              print("MJPC_CAPTURES_ZIP_BEGIN", len(raw), hashlib.sha256(raw).hexdigest())
              for pos in range(0, len(encoded), 12000):
                  print("MJPC_CAPTURES_ZIP_DATA " + encoded[pos:pos+12000])
              print("MJPC_CAPTURES_ZIP_END")
          PY

  resultat:
    name: "${{ needs.scans.outputs.verdict || 'Banc non execute' }} - ${{ needs.scans.outputs.captures || '0' }} captures"
    needs: scans
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Afficher le verdict mesure du banc
        env:
          VERDICT: ${{ needs.scans.outputs.verdict }}
          CAPTURES: ${{ needs.scans.outputs.captures }}
          RESULTAT: ${{ needs.scans.result }}
        shell: bash
        run: |
          printf "%s\n" "$VERDICT" "Captures PNG : $CAPTURES"
          test "$RESULTAT" = success
