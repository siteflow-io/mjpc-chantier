<!-- COIFFE D'ESSAI — conscience n°7. À poser juste après <head> dans une livraison locale,
     À RETIRER avant tout push (deux blocs <script> isolés, retrait d'une ligne).
     · bac-a-sable : LECTURES autorisées (portail, chapitres, empreintes prof), ÉCRITURES
       Firebase bloquées (PUT/POST/PATCH/DELETE) — PROUVÉ au banc : seuls des GET sortent.
       Sans les lectures, l'entrée prof échoue (« aucune empreinte prof posée »).
     · bac-decor : décor JSON PUR (22 écrans sur 5 séances du chapitre 3e/10, tiré du
       PowerPoint réel de Paul), posé dans seances[n].deroule.ecrans — exactement là où
       l'IA écrira au chantier des prompts. JAMAIS de contenu en dur dans le code du site.
     Ouvrir la livraison avec ?n=3e, sinon écran de garde « Lien invalide ». -->
<script id="bac-a-sable">
/* BAC À SABLE (v2) — conscience n°7. LECTURES autorisées (portail, chapitres, empreintes prof),
   ÉCRITURES bloquées : PUT / POST / PATCH / DELETE vers le hub n'atteignent jamais Firebase.
   Le code livré n'est pas modifié en dessous. */
(function(){
  var HUB='firebasedatabase.app';
  var ECRIT={PUT:1,POST:1,PATCH:1,DELETE:1};
  var bloquees=0;
  function annonce(m,u){
    bloquees++;
    try{console.warn('[BAC] écriture bloquée:',m,String(u).slice(0,100));}catch(e){}
    var el=document.getElementById('bac-bandeau');
    if(el) el.textContent='🔒 BAC À SABLE — '+bloquees+' écriture(s) bloquée(s) · lectures actives · rien ne part vers Firebase';
  }
  var vraiFetch=window.fetch;
  window.fetch=function(url,opts){
    var u=(typeof url==='string')?url:(url&&url.url)||'';
    var m=((opts&&opts.method)||'GET').toUpperCase();
    if(u.indexOf(HUB)>=0 && ECRIT[m]){
      annonce(m,u);
      return Promise.resolve(new Response(JSON.stringify(opts&&opts.body?JSON.parse(opts.body):null),{status:200,headers:{'Content-Type':'application/json'}}));
    }
    return vraiFetch.apply(this,arguments);
  };
  var vraiOpen=XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open=function(m,u){
    this.__bloque=(String(u).indexOf(HUB)>=0 && ECRIT[String(m).toUpperCase()]);
    if(this.__bloque) annonce(m,u);
    return vraiOpen.apply(this,arguments);
  };
  var vraiSend=XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.send=function(body){
    if(this.__bloque){
      var self=this;
      setTimeout(function(){
        try{
          Object.defineProperty(self,'readyState',{value:4,configurable:true});
          Object.defineProperty(self,'status',{value:200,configurable:true});
          Object.defineProperty(self,'responseText',{value:body||'null',configurable:true});
        }catch(e){}
        if(self.onreadystatechange) self.onreadystatechange();
        if(self.onload) self.onload();
      },5);
      return;
    }
    return vraiSend.apply(this,arguments);
  };
  document.addEventListener('DOMContentLoaded',function(){
    var d=document.createElement('div');
    d.id='bac-bandeau';
    d.style.cssText='position:fixed;z-index:999999;left:0;right:0;bottom:0;background:#7a1f2b;color:#fff;font:13px system-ui,sans-serif;padding:7px 12px;text-align:center';
    d.textContent='🔒 BAC À SABLE — lectures actives · toute écriture vers Firebase est bloquée';
    document.body.appendChild(d);
  });
})();
</script>
