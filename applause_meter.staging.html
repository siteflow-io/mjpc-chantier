<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>L'Applaudimètre — Lecture coévaluée</title>
<style>

/* ==================================================================
   COMMUN (base, variables, composants transverses, animations)
   ================================================================== */

:root{
  /* Charte vivante MJPC (reprise QCM) */
  --turquoise:#00BFA6; --jaune:#FFD23F; --rose:#FF3E7F; --violet:#6A4CE0;
  --bleu:#2196F3; --noir:#1A1A2E; --blanc:#FFFFFF; --vert:#22C55E;
  --rouge:#EF4444; --gris:#64748B; --gris-clair:#F1F5F9; --bordure:#E2E8F0;
  /* Barres applaudimètre — gradient « en chemin » → « superbe », jamais punitif */
  --bar-bas:#A7F3D0;   /* vert tendre (ça vient) */
  --bar-mid:#34D399;   /* vert franc */
  --bar-haut:#FFB020;  /* orange chaud */
  --bar-top:#FFD23F;   /* doré (superbe) */
  --radius:16px; --radius-sm:11px;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

body{font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;background:var(--gris-clair);color:var(--noir);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}

button{font-family:inherit;cursor:pointer;border:none}

.wrap{max-width:1100px;margin:0 auto;padding:18px}

.btn-accueil{font-size:1.25rem;font-weight:800;padding:18px 30px;border-radius:var(--radius);min-width:280px;color:#fff;box-shadow:0 8px 22px rgba(0,0,0,.12);transition:transform .12s,box-shadow .12s}

.btn-accueil:active{transform:translateY(2px) scale(.99)}

.btn-prof{background:linear-gradient(135deg,var(--violet),#8B6CF0)}

.btn-eleve{background:linear-gradient(135deg,var(--turquoise),#2DD4BF)}

.btn-board{background:linear-gradient(135deg,var(--bleu),#42A5F5)}

/* ---- Header générique ---- */
.hdr{display:flex;align-items:center;gap:12px;padding:14px 18px;background:#fff;border-bottom:2px solid var(--bordure);position:sticky;top:0;z-index:50}

.hdr h2{font-size:1.15rem;font-weight:900;color:var(--violet);flex:1}

.btn-back{background:var(--gris-clair);color:var(--gris);font-weight:700;padding:9px 14px;border-radius:10px;font-size:.9rem}

.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:800;letter-spacing:.3px}

.badge-test{background:var(--rose);color:#fff}

/* ---- Tooltip prof « i » (parité MJPC) ---- */
.info-i{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:var(--violet);color:#fff;font-size:11px;font-weight:700;font-family:Georgia,serif;cursor:help;margin-left:6px;position:relative;vertical-align:middle;outline:none}

.info-i:hover .info-tip,.info-i:focus .info-tip{display:block}

.info-tip{display:none;position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);background:var(--noir);color:#fff;font-size:12px;font-weight:400;font-family:inherit;padding:9px 11px;border-radius:8px;white-space:normal;width:248px;z-index:1000;pointer-events:none;line-height:1.45;text-align:left;box-shadow:0 6px 18px rgba(0,0,0,.25)}

/* ---- Cartes / champs (panneau prof) ---- */
.card{background:#fff;border-radius:var(--radius);padding:18px;margin:14px 0;border:1px solid var(--bordure);box-shadow:0 2px 10px rgba(0,0,0,.04)}

.card h3{color:var(--violet);font-weight:900;font-size:1.05rem;margin-bottom:10px;display:flex;align-items:center}

.field{margin-bottom:14px}

.field label{display:block;font-weight:700;font-size:.9rem;margin-bottom:6px;color:var(--noir)}

.field input,.field textarea,.field select{width:100%;padding:.7rem .9rem;border:2px solid var(--bordure);border-radius:10px;font-size:.95rem;font-family:inherit;background:#fff;transition:border-color .2s}

.field textarea{min-height:150px;resize:vertical;line-height:1.5}

.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px rgba(106,76,224,.15)}

.btn{padding:13px 18px;border-radius:11px;font-weight:800;font-size:.95rem;color:#fff;transition:transform .1s}

.btn:active{transform:translateY(1px)}

.btn-violet{background:var(--violet)}

.btn-turq{background:var(--turquoise)}

.btn-bleu{background:var(--bleu)}

.btn-rose{background:var(--rose)}

.btn-vert{background:var(--vert)}

.btn-gris{background:var(--gris)}

.btn-ghost{background:var(--gris-clair);color:var(--gris)}

.btn-lg{padding:16px 22px;font-size:1.05rem;width:100%}

.btn-row{display:flex;gap:10px;flex-wrap:wrap}

.tabs{display:flex;gap:8px;padding:12px 18px 0;flex-wrap:wrap}

.tab{padding:10px 16px;border-radius:10px 10px 0 0;font-weight:800;font-size:.92rem;background:var(--gris-clair);color:var(--gris)}

.tab.active{background:#fff;color:var(--violet);box-shadow:0 -2px 8px rgba(0,0,0,.05)}

.muted{color:var(--gris);font-size:.88rem;line-height:1.5}

.pill{display:inline-block;background:var(--gris-clair);border-radius:999px;padding:5px 12px;margin:3px;font-size:.85rem;font-weight:600}

@keyframes helpBreath{0%,100%{opacity:.78;transform:scale(1)}50%{opacity:1;transform:scale(1.045)}}

/* ---- Carte Mode checkpoints (Réglages) ---- */
.checkbox-row{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer;padding:6px 0}

.checkbox-row input{width:18px;height:18px;accent-color:var(--violet)}

@keyframes boardShift{0%,100%{background-position:0% 0%}50%{background-position:100% 100%}}

@keyframes cpFlash{0%,90%,100%{opacity:.55}45%{opacity:1}}

@keyframes cpStampIn{from{opacity:0;transform:translateY(8px) scale(.85)}to{opacity:1;transform:translateY(0) scale(1)}}

@keyframes floatUp{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-120px) scale(1.3)}}

@keyframes orbePulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.15);opacity:1}}

@keyframes bpFloat{0%,100%{transform:translate(0,0);opacity:.35}50%{transform:translate(-18px,-26px);opacity:.6}}

@keyframes glowPulse{0%,100%{box-shadow:0 0 22px 3px var(--jaune)}50%{box-shadow:0 0 42px 11px var(--jaune)}}

@keyframes chronoPulse{0%,100%{transform:translateX(-50%) scale(1);text-shadow:0 0 18px rgba(255,180,40,.7);box-shadow:0 0 22px rgba(255,180,40,.4)}50%{transform:translateX(-50%) scale(1.08);text-shadow:0 0 36px rgba(255,210,79,1);box-shadow:0 0 40px rgba(255,210,79,.7)}}

@keyframes finMsgIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}60%{transform:translate(-50%,-50%) scale(1.04)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}

@keyframes breathe{0%{transform:scale(.55);box-shadow:0 0 30px rgba(124,92,255,.3)}40%{transform:scale(1);box-shadow:0 0 100px rgba(124,92,255,.55)}100%{transform:scale(.55);box-shadow:0 0 30px rgba(124,92,255,.3)}}

/* ---- Formulaire de connexion élève (NOM + Prénom, pattern correction_dictee) ---- */
.form-wrap{padding:16px;max-width:480px;margin:0 auto}

.form-connect{background:#fff;padding:20px;border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.08)}

.form-connect input{font-size:1.15rem;letter-spacing:.04em;padding:12px;width:100%;border-radius:10px;border:1px solid #d0d4dd}

.form-connect input:focus{border-color:var(--violet);outline:none;box-shadow:0 0 0 3px rgba(124,92,255,.18)}

.form-err{color:#bf2a2a;font-size:.9rem;background:rgba(248,113,113,.1);padding:10px 14px;border-radius:10px;margin:10px 0;border:1px solid rgba(248,113,113,.25)}

.btn-add-occ{display:block;width:calc(100% - 16px);padding:14px;margin:6px 8px;background:rgba(124,92,255,.08);border:1px dashed rgba(124,92,255,.4);border-radius:12px;font-weight:600;color:var(--violet);cursor:pointer;font-size:.95rem;font-family:inherit}

.btn-add-occ:hover{background:rgba(124,92,255,.14)}

@keyframes tpillIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}

@keyframes dotPulse{0%,100%{opacity:1}50%{opacity:.5}}

.modal-close{position:absolute;top:14px;right:16px;background:var(--gris-clair);width:36px;height:36px;border-radius:50%;font-size:1.1rem;color:var(--gris);font-weight:800}

@keyframes helpPulse{0%,100%{box-shadow:0 6px 18px rgba(0,0,0,.25),0 0 0 0 rgba(255,210,63,.7);transform:scale(1)}50%{box-shadow:0 6px 18px rgba(0,0,0,.25),0 0 0 14px rgba(255,210,63,0);transform:scale(1.08)}}

@media(max-width:600px){
  .accueil h1{font-size:1.9rem} .board-reader{font-size:2.2rem}
  .board-meters{gap:18px} .board .meter{width:21vw} .board .meter-track{height:60vh}
}

/* ==================================================================
   PROF (interface prof : help, passages, seances, checkin, accueil...)
   ================================================================== */

/* ---- Accueil ---- */
.accueil{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:24px;background:linear-gradient(160deg,#fff 0%,var(--gris-clair) 100%)}

.accueil h1{font-size:2.4rem;font-weight:900;color:var(--violet);letter-spacing:-.5px}

.accueil .sub{color:var(--gris);font-size:1.05rem;max-width:430px;line-height:1.5}

.classe-btn{display:block;width:100%;text-align:left;padding:14px;border-radius:12px;background:var(--gris-clair);color:var(--noir);font-weight:700;font-size:1rem;margin-bottom:8px;border:2px solid transparent}

.classe-btn.sel{border-color:var(--violet);background:rgba(106,76,224,.07)}

/* ---- Réglage curseur (vitesse décroissance) ---- */
.range-row{display:flex;align-items:center;gap:12px}

.range-row input[type=range]{flex:1}

.range-val{font-weight:800;color:var(--violet);min-width:90px;text-align:right;font-size:.9rem}

.help-key{display:inline-block;animation:helpBreath 3.6s ease-in-out infinite;color:#5b3fd4;font-weight:700}

/* ---- Séances archivées (liste dans Pilotage) ---- */
.seances-list{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto;padding:2px}

.seance-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:#f9faff;border-radius:8px;border:1px solid var(--bordure)}

.seance-info{flex:1;min-width:0}

.seance-lib{font-weight:700;color:var(--noir);font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.seance-meta{font-size:.78rem;color:var(--gris);margin-top:2px}

/* ---- Liste des passages de la séance + modale détail ---- */
.passages-list{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow-y:auto;padding:2px}

.passage-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:#f9faff;border-radius:10px;border:1px solid var(--bordure);cursor:pointer;font-family:inherit;text-align:left;transition:all .15s}

.passage-row:hover{border-color:var(--violet);background:rgba(124,92,255,.05)}

.passage-info{flex:1;min-width:0}

.passage-lecteur{font-weight:700;color:var(--noir);font-size:.95rem}

.passage-statut{font-size:.78rem;margin-top:2px;font-weight:600}

.passage-statut.st-ok{color:#16a34a}

.passage-statut.st-annule{color:#dc2626}

.passage-statut.st-encours{color:#7c5cff}

.passage-arrow{color:var(--violet);font-size:1.4rem;font-weight:700;flex-shrink:0}

/* Modale détail d'un passage */
.mp-modal{max-width:780px}

.mp-sec-title{margin-top:18px;margin-bottom:10px;font-size:1rem;color:var(--violet);font-weight:800;letter-spacing:.02em}

.mp-grille{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}

.mp-checkpoints{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}

.mp-cp-col{background:#fafbfd;border-radius:10px;padding:10px 8px;border:1px solid var(--bordure);text-align:center}

.mp-cp-emoji{font-size:1.6rem;line-height:1;margin-bottom:4px}

.mp-cp-count{font-weight:800;color:#7c5cff;font-size:1.1rem;margin-bottom:6px}

.mp-cp-list{display:flex;flex-direction:column;gap:3px;font-family:ui-monospace,Menlo,monospace;font-size:.78rem;color:var(--gris)}

.mp-cp-time{background:rgba(124,92,255,.1);padding:2px 6px;border-radius:4px;font-weight:600}

/* ---- Feedback flux IA (étape 9) ---- */
.ia-msg{margin-top:10px;padding:10px 14px;border-radius:10px;font-size:.9rem;font-weight:600;line-height:1.4}

.ia-msg.ok{color:#16a34a;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3)}

.ia-msg.err{color:#bf2a2a;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.3)}

/* ---- Modale Check-in absents (pattern QCM répliqué) ---- */
.checkin-list{max-height:50vh;overflow-y:auto;border:1px solid #e2e6ef;border-radius:10px;margin:14px 0;background:#f9faff}

.checkin-row{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border:none;background:transparent;text-align:left;cursor:pointer;border-bottom:1px solid #eef0f8;font-size:1rem;color:var(--noir);transition:background .15s;font-family:inherit}

.checkin-row:last-child{border-bottom:none}

.checkin-row:hover{background:rgba(124,92,255,.06)}

.checkin-row.abs{background:rgba(248,113,113,.07);color:#bf2a2a}

.checkin-row.abs .checkin-nom{text-decoration:line-through;text-decoration-color:rgba(191,42,42,.4)}

.checkin-pict{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(34,197,94,.18);color:#16a34a;font-size:.85rem;font-weight:700;flex-shrink:0}

.checkin-row.abs .checkin-pict{background:rgba(248,113,113,.2);color:#dc2626}

.checkin-nom{flex:1;font-weight:600}

.checkin-summary{text-align:center;color:var(--gris);font-weight:600;padding:6px 0;font-size:.92rem}

/* magenta */
.compliments-bar{padding:10px 12px;background:#fff;border-top:2px solid var(--bordure)}

.compliments-bar .ttl{font-size:.8rem;font-weight:800;color:var(--gris);margin-bottom:6px}

/* ---- Modale d'aide (mode d'emploi à sections) ---- */
.help-back{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:2000;display:flex;align-items:flex-start;justify-content:center;padding:3vh 2vw;overflow-y:auto}

.help-modal{background:#fff;border-radius:20px;max-width:760px;width:100%;padding:1.7rem 1.9rem;position:relative;max-height:94vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 4px var(--jaune)}

.help-modal h1{color:var(--violet);font-weight:900;margin-bottom:.3rem;font-size:1.5rem}

.help-modal .subtitle{color:var(--gris);font-size:.92rem;margin-bottom:1.1rem;font-style:italic}

.help-section{background:var(--gris-clair);border-radius:14px;margin-bottom:.7rem;border-left:5px solid var(--violet);overflow:hidden}

.help-section-header{padding:.85rem 1rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:900;color:var(--violet);font-size:.98rem;user-select:none}

.help-section-header .arrow{transition:transform .2s;font-size:.8rem}

.help-section.open .help-section-header .arrow{transform:rotate(90deg)}

.help-section-body{display:none;padding:0 1rem 1rem;line-height:1.6;color:var(--noir);font-size:.9rem}

.help-section.open .help-section-body{display:block}

.help-section-body p{margin-bottom:.5rem}

.help-section-body strong{color:var(--violet)}

.help-section-body ul{margin:.4rem 0 .7rem 1.3rem}

.help-section-body li{margin-bottom:.3rem}

.help-section-body .important{background:#FFF8E1;border-left:3px solid var(--jaune);padding:.55rem .75rem;border-radius:6px;margin:.5rem 0}

.help-fab{position:fixed;bottom:18px;right:18px;background:var(--jaune);color:var(--noir);width:52px;height:52px;border-radius:50%;font-size:1.5rem;font-weight:900;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:1500;display:flex;align-items:center;justify-content:center}

.help-fab.pulse{animation:helpPulse 1.8s ease-in-out infinite}

/* ==================================================================
   TABLEAU (board, meters, claps, courbes, checkpoints...)
   ================================================================== */

.accueil .clap{font-size:3.4rem;margin-bottom:-6px}

/* ---- BARRES applaudimètre (board + élève) ---- */
.meter-wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:end}

.meter{display:flex;flex-direction:column;align-items:center;gap:8px}

.meter-track{position:relative;width:100%;background:#EEF2F7;border-radius:14px;overflow:hidden;border:2px solid var(--bordure)}

.meter-fill{position:absolute;left:0;right:0;bottom:0;border-radius:0 0 11px 11px;transition:height .18s cubic-bezier(.22,1,.36,1);background:linear-gradient(180deg,var(--bar-top),var(--bar-haut) 40%,var(--bar-mid) 75%,var(--bar-bas))}

.meter-emoji{font-size:1.7rem}

.meter-label{font-weight:800;font-size:.82rem;text-align:center;color:var(--noir);line-height:1.15}

.meter-glow{box-shadow:0 0 26px 4px var(--jaune)}

.cp-seuil-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:14px;margin-top:6px}

.cp-seuil-col{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;background:rgba(124,92,255,.04);border-radius:10px;border:1px solid rgba(124,92,255,.12)}

.cp-seuil-bar{height:140px;display:flex;justify-content:center;align-items:center}

.cp-vrange{writing-mode:vertical-lr;direction:rtl;width:36px;height:140px;accent-color:var(--violet);cursor:pointer}

.cp-seuil-val{font-weight:800;color:var(--violet);font-size:1rem;font-variant-numeric:tabular-nums}

.cp-seuil-emoji{font-size:1.6rem;line-height:1}

.cp-seuil-lbl{font-size:.74rem;text-align:center;color:var(--noir);font-weight:600;line-height:1.15}

/* ---- VUE BOARD (projection — très lisible de loin) ---- */
.board{position:relative;overflow:hidden;height:100vh;background:linear-gradient(165deg,var(--noir),#2A2A4A);background-size:170% 170%;animation:boardShift 24s ease infinite;color:#fff;display:flex;flex-direction:column;padding:22px 30px}

.board-top{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;margin-bottom:10px}

.board-reader{font-size:3.2rem;font-weight:900;color:var(--jaune);letter-spacing:-1px;text-align:center;line-height:1}

.board-sub{color:#B9C0E0;font-size:1.05rem;font-weight:600}

.board-meters{flex:1;display:flex;justify-content:center;align-items:stretch;gap:48px;padding:20px 0;min-height:0}

.board-meters.crit-6,.board-meters.crit-7{gap:32px}

.board-meters.crit-8{gap:22px}

.board .meter{width:110px;max-width:13vw;height:100%;min-height:0;justify-content:flex-end}

.board-meters.crit-5 .meter,.board-meters.crit-6 .meter{width:92px;max-width:11vw}

.board-meters.crit-7 .meter,.board-meters.crit-8 .meter{width:78px;max-width:9vw}

.board .meter-track{flex:1;min-height:0;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:6px 4px;display:flex;flex-direction:column-reverse;gap:1px;overflow:hidden;width:100%}

.board .meter-seg{flex:1;border-radius:2px;background:rgba(255,255,255,.05)}

/* ---- Mode checkpoints : ligne flash au seuil + pile horaires + compteur ---- */
.board .meter{position:relative}

.board .meter-trackwrap{position:relative;width:100%;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}

.board .meter-trackwrap .meter-track{width:100%;height:100%}

.board .cp-line{position:absolute;left:6px;right:6px;height:3px;border-radius:2px;background:linear-gradient(to right,transparent,#ffd24f 18%,#fff 50%,#ffd24f 82%,transparent);box-shadow:0 0 12px #ffd24f,0 0 24px rgba(255,210,79,.6);animation:cpFlash 2.4s ease-in-out infinite;pointer-events:none;z-index:5;transform:translateY(-50%)}

.board .cp-stack{position:absolute;right:-72px;display:flex;flex-direction:column;gap:3px;font-family:ui-monospace,Menlo,monospace;pointer-events:none;z-index:6;transform:translateY(-50%)}

.board .cp-time{font-size:.78rem;color:#ffd24f;background:rgba(255,210,79,.08);padding:2px 7px;border-radius:4px;border:1px solid rgba(255,210,79,.22);font-weight:600;white-space:nowrap;text-align:center}

.board .cp-time.latest{font-size:.9rem;font-weight:700;text-shadow:0 0 8px rgba(255,210,79,.6);border-color:rgba(255,210,79,.5);animation:cpStampIn .5s ease-out}

.board .cp-count{color:#ffd24f;font-weight:800;font-size:1rem;text-shadow:0 0 8px rgba(255,210,79,.5);margin-left:8px;letter-spacing:.02em}

.board .meter-emoji{font-size:2.6rem}

.board .meter-label{color:#fff;font-size:1.15rem}

.board .meter-pct{font-size:2.1rem;font-weight:900;color:#fff;text-shadow:0 0 12px rgba(255,210,63,.5);font-variant-numeric:tabular-nums;margin-bottom:6px}

.board-count{text-align:center;color:#B9C0E0;font-size:1rem;font-weight:700;padding:8px}

.board-claps{position:fixed;pointer-events:none;font-size:2rem;animation:floatUp 1.1s ease-out forwards}

.board-empty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#B9C0E0;text-align:center}

.board-empty .big{font-size:4rem}

/* ---- Décor animé du board (subtil : ne distrait pas des 4 barres) ---- */
.board-decor{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}

.board > *:not(.board-decor){position:relative;z-index:1}

.board-orbe{position:absolute;border-radius:50%;filter:blur(2px);animation:orbePulse 5s ease-in-out infinite}

.board-orbe-1{width:280px;height:280px;top:-60px;left:-40px;background:radial-gradient(circle,rgba(255,210,63,.16),rgba(255,210,63,0))}

.board-orbe-2{width:360px;height:360px;bottom:-90px;right:-60px;background:radial-gradient(circle,rgba(124,92,255,.18),rgba(124,92,255,0));animation-delay:-2s}

.board-orbe-3{width:200px;height:200px;top:38%;left:58%;background:radial-gradient(circle,rgba(255,255,255,.06),rgba(255,255,255,0));animation-delay:-3.5s}

.board-particule{position:absolute;border-radius:50%;width:7px;height:7px;background:radial-gradient(circle,rgba(255,255,255,.6),rgba(255,255,255,0))}

.bp0{top:18%;left:12%;animation:bpFloat 24s ease-in-out infinite}

.bp1{top:65%;left:8%;width:5px;height:5px;animation:bpFloat 28s ease-in-out infinite -3s}

.bp2{top:30%;left:88%;animation:bpFloat 26s ease-in-out infinite -7s}

.bp3{top:76%;left:82%;width:5px;height:5px;animation:bpFloat 25s ease-in-out infinite -2s}

.bp4{top:48%;left:30%;width:9px;height:9px;animation:bpFloat 30s ease-in-out infinite -10s}

.bp5{top:22%;left:66%;animation:bpFloat 27s ease-in-out infinite -5s}

/* pulsation douce des barres hautes (respire au lieu d'un halo figé) */
.board .meter-glow{animation:glowPulse 1.2s ease-in-out infinite}

/* pluie de 👏 quand ça applaudit fort */
.board-claps-zone{position:absolute;left:0;right:0;bottom:16%;height:0;pointer-events:none}

.clap-rise{position:absolute;bottom:0;font-size:2.4rem;animation:floatUp 1.2s ease-out forwards}

/* ---- Minuteur, gel et célébration de fin ---- */
.board-chrono{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:3;font-family:ui-monospace,Menlo,monospace;font-size:2.8rem;font-weight:900;color:#fff;text-shadow:0 0 12px rgba(255,255,255,.25);font-variant-numeric:tabular-nums;letter-spacing:.04em;padding:4px 22px;background:rgba(0,0,0,.18);border-radius:14px;border:1px solid rgba(255,255,255,.08)}

.board-chrono.alert{color:#ffd24f;animation:chronoPulse 1s ease-in-out infinite;border-color:rgba(255,210,79,.4);background:rgba(255,180,40,.12)}

.board-paillettes-zone{position:absolute;left:0;right:0;bottom:0;top:0;pointer-events:none;overflow:hidden;z-index:3}

.paillette-rise{position:absolute;bottom:0;font-size:2.6rem;animation:floatUp 1.6s ease-out forwards}

.board-fin-message{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);font-size:3.4rem;font-weight:900;color:#fff;text-shadow:0 0 24px rgba(255,210,79,.55),0 4px 14px rgba(0,0,0,.55);text-align:center;z-index:4;animation:finMsgIn .8s cubic-bezier(.18,.89,.32,1.18);padding:22px 44px;background:rgba(15,15,30,.45);border-radius:24px;backdrop-filter:blur(10px);border:1px solid rgba(255,210,79,.3);box-shadow:0 0 60px rgba(124,92,255,.35),0 0 120px rgba(255,210,79,.25);max-width:88%}

.board-breath-circle{width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(124,92,255,.45) 0%,rgba(124,92,255,.18) 55%,rgba(124,92,255,0) 100%);animation:breathe 10s ease-in-out infinite}

/* ---- Phases vote / bilan : écran neutre tableau + écrans tablette élève ---- */
.board-neutre{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:40px;animation:finMsgIn .5s ease-out}

.board-neutre-emoji{font-size:5rem;margin-bottom:24px;filter:drop-shadow(0 0 32px rgba(255,255,255,.25))}

.board-neutre-titre{font-size:2.6rem;font-weight:900;letter-spacing:.01em;text-shadow:0 0 24px rgba(255,255,255,.15),0 4px 14px rgba(0,0,0,.5);margin-bottom:14px;color:#fff}

.board-neutre-sub{font-size:1.1rem;color:rgba(255,255,255,.6);max-width:680px;line-height:1.5;font-weight:500}

.board-vote-counter{margin-top:32px;font-size:1.5rem;font-weight:800;color:#ffd24f;text-shadow:0 0 16px rgba(255,210,79,.5);font-variant-numeric:tabular-nums;padding:14px 28px;background:rgba(255,210,79,.08);border-radius:14px;border:1px solid rgba(255,210,79,.25);letter-spacing:.02em}

.courbe-wrap{background:#fafbfd;border-radius:10px;padding:10px;border:1px solid var(--bordure)}

.courbe-svg{display:block;width:100%;height:200px}

.courbe-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px;justify-content:center;font-size:.82rem;color:var(--gris)}

.courbe-leg-item{display:flex;align-items:center;gap:6px}

.courbe-leg-dot{width:10px;height:10px;border-radius:50%;display:inline-block;box-shadow:0 0 4px rgba(0,0,0,.2)}

/* bande discrète des tables actives en direct */
.board-tables{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:2px 0 6px;min-height:24px}

.board-tpill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:50px;background:rgba(255,255,255,.08);color:#cdd3ee;font-size:.78rem;font-weight:700;border:1px solid rgba(255,255,255,.12);animation:tpillIn .4s ease-out}

.board-tpill .dot{width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 6px #34d399;animation:dotPulse 1.6s ease-in-out infinite}

.clap-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}

.clap-c0{background:linear-gradient(135deg,var(--turquoise),#2DD4BF)}

.clap-c1{background:linear-gradient(135deg,var(--bleu),#42A5F5)}

.clap-c2{background:linear-gradient(135deg,var(--violet),#8B6CF0)}

.clap-c3{background:linear-gradient(135deg,var(--rose),#FF6FA0)}

.clap-c4{background:linear-gradient(135deg,#f59e0b,#fbbf24)}

/* ambre */
.clap-c5{background:linear-gradient(135deg,#10b981,#34d399)}

/* émeraude */
.clap-c6{background:linear-gradient(135deg,#6366f1,#818cf8)}

/* indigo */
.clap-c7{background:linear-gradient(135deg,#ec4899,#f472b6)}

/* ==================================================================
   ELEVE (zones tap, vote, bilan, compliments...)
   ================================================================== */

/* Pause côté tablette élève (reprend le cercle respirant 4/6) */
.eleve-pause{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;text-align:center}

.eleve-pause-label{font-size:.9rem;font-weight:600;color:rgba(80,60,140,.6);letter-spacing:.4em;text-transform:uppercase;margin-bottom:30px}

.eleve-pause-circle{width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(124,92,255,.5) 0%,rgba(124,92,255,.18) 60%,transparent 100%);animation:breathe 10s ease-in-out infinite}

.eleve-pause-msg{font-size:.95rem;color:rgba(80,60,140,.7);max-width:280px;margin-top:30px;line-height:1.5}

.eleve-vote-wait{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 24px;text-align:center;flex:1}

.eleve-vote-wait .big{font-size:3.4rem;margin-bottom:18px}

.eleve-vote-wait .vote-titre{font-size:1.4rem;font-weight:800;color:var(--violet);margin-bottom:12px}

/* ---- Phase vote : sélecteur d'occupant ---- */
.vote-selection{padding:24px 16px;flex:1;display:flex;flex-direction:column;align-items:center;text-align:center}

.vote-selection .vote-titre{font-size:1.5rem;font-weight:800;color:var(--violet);margin-bottom:10px}

.vote-occ-list{width:100%;max-width:420px;display:flex;flex-direction:column;gap:8px;margin-top:14px}

.vote-occ-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:12px;background:#fff;border:2px solid var(--bordure);font-size:1rem;cursor:pointer;font-family:inherit;text-align:left;transition:all .15s}

.vote-occ-row:hover{border-color:var(--violet);background:rgba(124,92,255,.04)}

.vote-occ-row.voted{background:#f0f4ff;color:var(--gris);cursor:default;border-color:#e2e6ef}

.vote-occ-row.voted:hover{border-color:#e2e6ef;background:#f0f4ff}

.vote-occ-row.dim{background:rgba(124,92,255,.06);border-style:dashed;border-color:rgba(124,92,255,.25);cursor:default;color:var(--gris)}

.vote-occ-name{font-weight:700;color:var(--noir)}

.vote-occ-row.voted .vote-occ-name,.vote-occ-row.dim .vote-occ-name{color:var(--gris)}

.vote-occ-state{font-size:.88rem;color:var(--violet);font-weight:600}

.vote-occ-row.voted .vote-occ-state{color:#22c55e}

/* ---- Phase vote : formulaire (4 questions, échelle 4 niveaux) ---- */
.vote-form{padding:16px;flex:1;overflow-y:auto}

.vote-form-hdr{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--bordure);margin-bottom:14px}

.vote-form-titre{font-size:1.05rem;font-weight:800;color:var(--noir)}

.vote-q-block{margin-bottom:18px;background:#fff;border-radius:12px;padding:14px;border:1px solid var(--bordure)}

.vote-q-titre{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--noir);margin-bottom:10px;font-size:1rem;line-height:1.3}

.vote-q-emoji{font-size:1.5rem;flex-shrink:0}

.vote-q-choix{display:grid;grid-template-columns:1fr 1fr;gap:6px}

.vote-choix{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:10px;border:2px solid var(--bordure);background:#f9faff;cursor:pointer;font-family:inherit;transition:all .15s;color:var(--noir)}

.vote-choix:hover{border-color:var(--violet);background:rgba(124,92,255,.06)}

.vote-choix.sel{border-color:var(--violet);background:rgba(124,92,255,.14);box-shadow:0 0 0 3px rgba(124,92,255,.18)}

.vote-choix-emoji{font-size:1.7rem;line-height:1}

.vote-choix-label{font-size:.82rem;font-weight:600;text-align:center}

/* ---- Phase bilan : grille École Directe (lecteur uniquement) ---- */
.bilan{padding:20px 16px;flex:1;display:flex;flex-direction:column;overflow-y:auto}

.bilan-hdr{text-align:center;margin-bottom:18px}

.bilan-emoji-grand{font-size:3rem;margin-bottom:6px}

.bilan-titre{font-size:1.4rem;font-weight:800;color:var(--violet)}

.bilan-grille{display:flex;flex-direction:column;gap:10px}

.bilan-crit{background:#fff;border-radius:14px;border:2px solid var(--bordure);overflow:hidden;display:flex;flex-direction:column}

.bilan-crit-emoji{font-size:2.4rem;text-align:center;padding:14px 0 4px}

.bilan-crit-label{text-align:center;font-weight:700;color:var(--noir);padding:0 14px 10px;font-size:.95rem}

.bilan-crit-niveau{text-align:center;font-weight:800;padding:12px;font-size:1rem;background:rgba(0,0,0,.02);border-top:2px solid}

/* ---- Zones multi-occupants (1 / 2 / 3 colonnes) ---- */
.zones-multi{display:grid;gap:8px;padding:8px;flex:1;align-content:stretch}

.zones-1{grid-template-columns:1fr}

.zones-2{grid-template-columns:1fr 1fr}

.zones-3{grid-template-columns:1fr 1fr 1fr}

.zone-occ{background:#fff;border-radius:14px;border:2px solid var(--bordure);padding:6px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}

.zone-occ.zone-lecteur{background:rgba(124,92,255,.08);border-color:rgba(124,92,255,.35)}

.zone-hdr{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;margin-bottom:6px;font-weight:700;color:var(--noir);font-size:.95rem}

.zone-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.zone-rm{background:none;border:none;color:var(--gris);font-size:1.3rem;cursor:pointer;padding:0 6px;line-height:1;border-radius:6px;transition:all .15s}

.zone-rm:hover{color:#dc2626;background:rgba(248,113,113,.1)}

.zone-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;flex:1;grid-auto-rows:1fr}

.zone-grid.crit-3{grid-template-columns:repeat(3,1fr);grid-template-rows:1fr}

.zone-grid.crit-4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}

.zone-grid.crit-5,.zone-grid.crit-6{grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr}

.zone-grid.crit-7,.zone-grid.crit-8{grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr}

.zone-grid .clap-btn{font-size:.72rem}

.zone-grid .clap-btn .ce{font-size:1.4rem}

.zone-grid .clap-btn .cl{font-size:.65rem}

.zone-overlay{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px}

.zone-overlay .big{font-size:2.6rem;margin-bottom:4px}

/* ---- VUE ÉLÈVE (tablette tactile) ---- */
.eleve{min-height:100vh;display:flex;flex-direction:column;background:var(--gris-clair)}

.eleve-reader{text-align:center;padding:14px;background:#fff;border-bottom:2px solid var(--bordure)}

.eleve-reader .who{font-size:1.5rem;font-weight:900;color:var(--violet)}

.eleve-reader .lbl{font-size:.82rem;color:var(--gris);font-weight:600}

.clap-btn{border-radius:18px;color:#fff;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative;overflow:hidden;border:none;transition:transform .08s;user-select:none;min-height:130px}

.clap-btn:active{transform:scale(.97)}

.clap-btn .ce{font-size:2.4rem;z-index:2}

.clap-btn .cl{font-size:1rem;z-index:2;text-align:center;padding:0 8px;text-shadow:0 1px 2px rgba(0,0,0,.25)}

.clap-btn .clap-fill{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.28);transition:height .15s;z-index:1}

.comp-chip{display:inline-block;padding:8px 13px;margin:4px;border-radius:999px;background:var(--gris-clair);font-weight:700;font-size:.9rem;border:2px solid transparent}

.comp-chip.on{background:var(--jaune);border-color:var(--bar-haut);color:var(--noir)}

.eleve-wait{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:30px;color:var(--gris)}

.eleve-wait .big{font-size:3.4rem}

.choice-list{display:flex;flex-direction:column;gap:10px;max-width:460px;margin:0 auto;width:100%}

.choice-list .classe-btn{font-size:1.1rem;text-align:center}

</style>
<style id="mjpc-tactile-480">
/* ══════════════════════════════════════════════════════════════════════════
   M14 (27/07/2026) — TACTILE ≤480 px, ÉCRANS PROFESSEUR COMPRIS.
   Bloc SÉPARÉ et purement additif : la charte CSS propre de l'app (exception
   du 15/07) n'est pas modifiée. Rien ne s'applique au-dessus de 480 px, donc
   le rendu ordinateur est inchangé.
   ══════════════════════════════════════════════════════════════════════════ */
@media(max-width:480px){
  /* en-têtes : le titre ne pousse plus les boutons hors de l'écran */
  .hdr{flex-wrap:wrap;gap:6px;padding:8px 10px}
  .hdr h2{font-size:1rem;flex:1 1 100%;order:3;margin:2px 0 0}
  .btn-back{padding:8px 12px;font-size:.85rem;min-height:40px}
  /* onglets du panneau professeur : trois cibles tenables au pouce */
  .tabs{gap:4px;padding:0 6px}
  .tab{padding:9px 6px;font-size:.78rem;min-height:42px;flex:1}
  /* cartes et champs : marges réduites, hauteurs de doigt */
  .wrap{padding:8px}
  .card{padding:12px 11px;margin-bottom:10px;border-radius:12px}
  .card h3{font-size:.98rem}
  .field label{font-size:.85rem}
  .field input,.field select,.field textarea{min-height:42px;font-size:.95rem}
  input[type=range]{height:34px}
  /* réglages : le plus dense de l'app — une colonne, jamais de débordement */
  .range-row{gap:8px}
  .range-val{min-width:56px;font-size:.82rem}
  .btn-row{flex-wrap:wrap;gap:6px}
  .btn-row .btn{flex:1 1 auto;min-height:42px}
  .btn{min-height:42px}
  /* archives et listes : l'action reste atteignable sans zoom */
  .seance-row{flex-wrap:wrap;gap:6px}
  .seance-info{flex:1 1 100%}
  .seances-list .btn{padding:8px 12px}
  /* tablette élève : les zones restent empilées et lisibles */
  .zones-multi{gap:6px;padding:6px}
  .zones-2,.zones-3{grid-template-columns:1fr}
  .zone-hdr{font-size:.88rem}
  .clap-btn .cl{font-size:.6rem}
  /* le bouton d'aide et la pastille de version ne se chevauchent pas */
  .help-fab{width:46px;height:46px;font-size:1.1rem}
}
</style>
</head>

// ── 4. Lecture robuste d'un roster : extractEleves ──
// Tolère les 3 formats rencontrés dans les données réelles :
//   liste ["NOM Prénom", …] · objet indexé {0:…, archivee:…} ·
//   objet {nom, eleves:[{nomComplet}|{nom,prenom}|{name}|"…"]}
function extractEleves(fbClasse, cfgEleves){
  cfgEleves = cfgEleves || [];
  var META={niveau:1,annee:1,id:1,title:1,nom:1,archivee:1,couleur:1,cree_le:1,published:1,eleves:1};
  function clean(a){return (a||[]).filter(function(x){return x&&typeof x==="string"&&x.trim();});}
  function nomDe(v){
    if(typeof v==="string") return v;
    if(v&&typeof v==="object"){
      if(v.nomComplet) return v.nomComplet;
      if(v.nom&&v.prenom) return String(v.nom).toUpperCase()+" "+v.prenom;
      if(v.name) return v.name;
    }
    return null;
  }
  if(Array.isArray(fbClasse)){ var a=clean(fbClasse.map(nomDe)); if(a.length) return a; }
  if(fbClasse&&typeof fbClasse==="object"&&!Array.isArray(fbClasse)){
    if(Array.isArray(fbClasse.eleves)){ var e=clean(fbClasse.eleves.map(nomDe)); if(e.length) return e; }

}

// ── 5. Écriture NON destructive d'une classe : ecrireClasse ──
// Remplace UNIQUEMENT la liste d'élèves ; préserve toute métadonnée existante
// (archivee, niveau, couleur, …) ; normalise au format canonique
// {eleves:["NOM Prénom",…], …métadonnées} : les élèves-objets ({nomComplet},
// {nom,prenom}, {name}) sont ramenés à la chaîne, les résidus indexés {0:…} purgés.
// meta (optionnel) : métadonnées à poser/mettre à jour (ex. {niveau:"4e"}) —
// appliquées PAR-DESSUS l'existant, jamais en le remplaçant.
// Transaction Firebase : atomique, idempotente, sûre en concurrence.
function ecrireClasse(db, nomClasse, eleves, meta, cb){
  if(typeof meta==="function"){ cb=meta; meta=null; }
  var nom=cleClasse(nomClasse);
  if(!nom){ if(cb) cb(new Error("Nom de classe vide")); return; }
  function nomDe(v){
    if(typeof v==="string") return v.trim();
    if(v&&typeof v==="object"){
      if(v.nomComplet) return String(v.nomComplet).trim();
      if(v.nom&&v.prenom) return String(v.nom).toUpperCase()+" "+String(v.prenom).trim();
      if(v.name) return String(v.name).trim();
    }
    return null;
  }
  var propres=(eleves||[]).map(nomDe).filter(function(e){return e&&typeof e==="string";});
  db.ref("classes/"+nom).transaction(function(cur){
    var out={eleves:propres};
    if(cur&&typeof cur==="object"&&!Array.isArray(cur)){
      for(var k in cur){
        if(k==="eleves") continue;          // remplacée
        if(/^\d+$/.test(k)) continue;       // résidu indexé : purgé (les élèves vivent dans .eleves)
        out[k]=cur[k];                      // métadonnée : préservée
      }
    }
    if(meta&&typeof meta==="object"){ for(var m in meta){ if(meta[m]!==undefined) out[m]=meta[m]; } }
    if(out.archivee===undefined) out.archivee=false;
    return out;
  }, function(err, committed){ if(cb) cb(err||null, committed); });
}

// ── 7. Identification nominative : le portail commun (logique) ──
// Toute identification produit des élèves SINGULIERS (clé canonique), que le
// travail soit individuel ou en groupe. Le groupe est un contenant, pas une identité.
// resolveEleves(roster, saisies) → [{nom, cle}] ou {erreur}
//   roster  : liste des noms de la classe (extractEleves)
//   saisies : ["DUPONT Marie", …] (chips) ou [{nom:"DUPONT",prenom:"Marie"}] (champs)
function resolveEleves(roster, saisies){
  var res=[], vus={};
  for(var i=0;i<(saisies||[]).length;i++){
    var s=saisies[i], trouve=null;
    if(typeof s==="string"){
      for(var j=0;j<roster.length;j++){ if(roster[j]===s){trouve=roster[j];break;} }
      if(!trouve){ var k=sanMJPC(s); for(j=0;j<roster.length;j++){ if(sanMJPC(roster[j])===k){trouve=roster[j];break;} } }
    } else if(s&&s.nom&&s.prenom){
      var nomU=String(s.nom).trim().toUpperCase(), preL=String(s.prenom).trim().toLowerCase();
      for(j=0;j<roster.length;j++){
        var parts=roster[j].split(" ");
        var rNom=parts.slice(0,-1).join(" ").toUpperCase(), rPre=(parts[parts.length-1]||"").toLowerCase();
        if(rNom===nomU&&rPre===preL){trouve=roster[j];break;}
      }
    }
    if(!trouve) return {erreur:"\u00c9l\u00e8ve introuvable : "+(typeof s==="string"?s:(s.nom+" "+s.prenom))+". V\u00e9rifie l'orthographe."};
    var cle=sanMJPC(trouve);
    if(vus[cle]) return {erreur:"\u00c9l\u00e8ve s\u00e9lectionn\u00e9 deux fois : "+trouve};
    vus[cle]=1; res.push({nom:trouve, cle:cle});
  }
  if(!res.length) return {erreur:"Aucun \u00e9l\u00e8ve identifi\u00e9."};
  return res;
}

// ── 8. Session partagée MJPC : l'app reconnaît qui est déjà connecté au site ──
// Le site MJPC écrit 'mjpc_eleve' (sessionStorage + localStorage, même origine).
// L'app la LIT ; elle ne l'écrit jamais. Validité : 12 h par défaut (une journée
// de cours). Une session invalide ou périmée → null → portail natif de l'app.
function lireSessionMJPC(ttlMs){
  var ttl = ttlMs || 12*3600*1000;
  var brut = null;
  try{ brut = sessionStorage.getItem("mjpc_eleve") || localStorage.getItem("mjpc_eleve"); }catch(e){}
  if(!brut) return null;
  var s; try{ s = JSON.parse(brut); }catch(e){ return null; }
  if(!s || typeof s!=="object") return null;
  if(!s.ts || (Date.now()-s.ts) > ttl) return null;          /* périmée */
  if(s.is_prof===true) return {is_prof:true, display:s.display||"Professeur", ts:s.ts};
  var nom = s.display || ((s.nom||"")+" "+(s.prenom||"")).trim();
  if(!nom || !s.classe) return null;
  return {is_prof:false, nom:nom, classe:s.classe, ts:s.ts};
}
// La session dit « CLÉMENT Noé, 4e Hugo » — l'app VÉRIFIE contre le registre
// officiel (/classes) avant d'ouvrir : classe existante, élève au registre.
// Rend l'identité résolue {nom (celui du registre), classe, cle} ou null.
function validerEleveMJPC(session, classesData){
  if(!session || session.is_prof) return null;
  var cl = (classesData||{})[session.classe];
  if(!cl || (cl&&cl.archivee)) return null;
  var roster = extractEleves(cl, []);
  var cible = sanMJPC(session.nom);
  for(var i=0;i<roster.length;i++){
    if(sanMJPC(roster[i])===cible) return {nom:roster[i], classe:session.classe, cle:cible};
  }
  return null;
}

function median(arr){
  if(!arr || !arr.length) return null;
  var s=arr.slice().sort(function(a,b){return a-b;});
  var m=Math.floor(s.length/2);
  return s.length%2 ? s[m] : Math.round((s[m-1]+s[m])/2);
}

  Object.keys(tablettes||{}).forEach(function(tid){

    tot+=occs.length;
    occs.forEach(function(o){ if(o && o.nom===reader) lec++; });
  });
  return {attendus:Math.max(0,tot-lec), totalOccupants:tot, lecteursDansOccupants:lec};
}

// Liste des slugs présents (occupants de toutes les tablettes connectées) — exclut les absents marqués
function slugsPresents(tablettes, absents){
  var abs=(absents||[]).reduce(function(o,s){o[s]=true;return o;},{});
  var out=[];
  Object.keys(tablettes||{}).forEach(function(tid){
    var occs=toArr(tablettes[tid] && tablettes[tid].occupants);
    occs.forEach(function(o){ if(o && o.slug && !abs[o.slug]) out.push(o.slug); });
  });
  return out;
}

// Vérifie si un slug peut s'inscrire en mode spontané, retourne {ok:bool, raison:string (avec noms parlants)}
function peutSinscrire(slug, compteurs, presentsSlugs, presentsNoms, ecart, dejaInscrits){
  presentsSlugs = presentsSlugs || [];
  presentsNoms = presentsNoms || [];
  compteurs = compteurs || {};
  dejaInscrits = dejaInscrits || {};
  if(dejaInscrits[slug]) return {ok:false, raison:"Tu es déjà dans la file d'attente."};
  if(!ecart || ecart===0) return {ok:true};                    // illimité
  var monC=compteurs[slug]||0;
  var minC=999;
  presentsSlugs.forEach(function(s){
    var c=compteurs[s]||0;
    if(c<minC) minC=c;
  });
  if(minC===999) minC=0;
  if(monC <= minC + ecart - 1) return {ok:true};               // seuil strict
  // Liste les présents en retard (compteur ≤ minC) pour message parlant
  var retard=[];
  presentsSlugs.forEach(function(s,i){
    var c=compteurs[s]||0;
    if(c<=minC && s!==slug){
      var nom=presentsNoms[i]||s;
      retard.push(prenom(nom));
    }
  });
  var liste = retard.length===0 ? "d'autres camarades" : (retard.length<=4 ? retard.join(", ") : retard.slice(0,4).join(", ")+" et "+(retard.length-4)+" autre"+(retard.length-4>1?"s":""));
  return {ok:false, raison:"Tu as déjà lu "+monC+" fois. Laisse d'abord "+liste+" essayer (ils ont lu "+minC+" fois)."};
}

// Identifie les élèves « timides » : présents + jamais lu ET au moins `trigger` passages des autres ont eu lieu
function slugsTimides(presentsSlugs, compteurs, totalPassages, trigger){
  presentsSlugs = presentsSlugs || [];
  if(!totalPassages || totalPassages<trigger) return [];
  return presentsSlugs.filter(function(s){return !(compteurs && compteurs[s]);});
}

// Hash stable pour un slug (pour tirer un msg timide reproductible)
function hashStr(s){ var h=0; for(var i=0;i<s.length;i++){ h=((h<<5)-h)+s.charCodeAt(i); h|=0; } return Math.abs(h); }

// Message timide tiré pour ce slug, change à chaque palier de passages (stable entre 2 passages)
function msgTimideStable(slug, totalPassages, pool){
  if(!pool || !pool.length) return null;
  var idx=(hashStr(slug)+totalPassages)%pool.length;
  return pool[idx];
}

// Compte les passages terminés non annulés dans /historiqueLectures filtré par sessionId
function compterPassagesTermines(historique, passagesSession){
  if(!passagesSession) return 0;
  var n=0;
  Object.keys(passagesSession).forEach(function(pid){
    var p=historique[pid];
    if(p && p.bilanTermine && !p.annule) n++;
  });
  return n;
}

// opts (optionnel) : {nbLignes, dureeSec} pour override du minuteur (mode spontané)
function _setReaderImpl(session, nom, opts){
  db.ref(DB_ROOT+"/live").remove();

  var upd={reader:nom, messageFinIdx:null, pauseStartedAt:null, pausedDuration:0, phaseLockee:null, nbLignes:null, dureeOverride:null};
  if(nom){
    var newPid="p_"+Date.now();
    upd.passageId=newPid; upd.startedAt=Date.now();
    // Démarrer EN PAUSE : le chrono ne tourne pas, les élèves voient le cercle respirant,

    upd.pauseStartedAt=Date.now();

    // Archive immédiatement les métadonnées dans le passage (sinon perdues à la fin de séance)
    var metaArchive={lecteur:nom, startsAt:Date.now(), classeSlug:(session&&session.classeSlug)||""};
    if(opts && opts.nbLignes) metaArchive.nbLignes=opts.nbLignes;
    if(estSessionTest(session)) metaArchive.test=true;    // passage semé en mode test : historiqueLectures est un nœud PLAT,
                                                         // sans ce drapeau la purge ne peut pas le distinguer d'un passage réel
    db.ref(DB_ROOT+"/historiqueLectures/"+newPid).update(metaArchive);
  } else {
    upd.passageId=""; upd.startedAt=null;       // FIX : reset startedAt côté nom vide
  }
  db.ref(DB_ROOT+"/session").update(upd);
}

// ════════════ MODE TEST — ÉLÈVES FICTIFS ET GARDE SUR LA CLÉ ════════════
// Liste canonique gravée le 22/07/2026 pour tout l'écosystème. Les 24 noms réels
// qui figuraient ici jusqu'au 27/07/2026 produisaient de VRAIES clés sanMJPC, et
// l'app indexe ses nœuds par ces clés (compteurLectures, file, tablettes) : une
// séance de test incrémentait donc le compteur d'équité d'une élève réelle.
// Incident fondateur de la règle : le bac à sable du QCM a détruit les codes de
// 7 élèves réels par collision de clé.
var TEST_ELEVES = [
  "BERNARD Emma","DUPONT Marie","LEROY Hugo",
  "MARTIN Lucas","MOREAU Léa","PETIT Thomas"
];
var TEST_CLES = TEST_ELEVES.map(function(n){ return sanMJPC(n); });
// Codes des élèves fictifs : ils vivent dans le nœud de l'app (applaudimetre/session/codesTest),
// JAMAIS dans /codes racine. C'est le point exact où le bac à sable du QCM a fauté : il écrivait
// ses codes de test dans /codes, et sa purge a emporté ceux de 7 élèves réels. Ici /codes n'est
// ni écrit ni purgé, jamais : le mode test reste pourtant pleinement jouable, code compris.
function codesTestMJPC(){
  var m={};
  TEST_CLES.forEach(function(c,i){ m[c]=String(1001+i); });
  return m;
}

// Vérification AVANT tout semis : aucune clé fictive ne doit être portée par un
// élève réel. Le contrôle porte sur la CLÉ, jamais sur l'orthographe.
// Lecture CIBLÉE clé par clé sous /codes (le nœud entier n'est jamais lu : l'écran
// d'accueil est public). Rend {libres, collisions:[{cle, ou}], refus:[…]}.
function clesFictivesLibres(db){
  var jobs = TEST_CLES.map(function(c){
    return db.ref("codes/"+c).once("value").then(
      function(s){ return s.exists() ? {cle:c, ou:"codes/"+c} : null; },
      function(e){ return {cle:c, ou:"codes/"+c, refus:(e&&e.message)||"lecture refusée"}; });
  });
  jobs.push(db.ref("classes").once("value").then(
    function(s){
      var out=[], data=s.val()||{};
      Object.keys(data).forEach(function(k){
        if(estClasseTest(k) || estClasseInterne(k)) return;      // les classes internes ne comptent pas
        extractEleves(data[k], []).forEach(function(nom){
          var cle=sanMJPC(nom);
          if(TEST_CLES.indexOf(cle)!==-1) out.push({cle:cle, ou:"classes/"+k});
        });
      });
      return out;
    },
    function(e){ return [{cle:"(toutes)", ou:"classes", refus:(e&&e.message)||"lecture refusée"}]; }));
  return Promise.all(jobs).then(function(res){
    var col=[];
    res.forEach(function(r){
      if(!r) return;
      if(Object.prototype.toString.call(r)==="[object Array]") col=col.concat(r);
      else col.push(r);
    });
    return {libres:col.length===0, collisions:col};
  });
}

// Un passage/une séance semés en mode test portent test:true. Sans ce drapeau,
// aucune purge ne peut distinguer un passage de test d'un passage réel dans
// historiqueLectures, qui est un nœud PLAT.
// ════════════ PORTAIL À CODE — LECTURE CIBLÉE ════════════
// Les autres apps chargent /codes ENTIER dans le navigateur (patron M11). Ici l'écran
// est une TABLETTE ÉLÈVE : y déposer les 122 codes de l'établissement serait une fuite.
// L'app lit donc UNE clé, celle que l'élève vient lui-même de désigner en tapant son
// nom. Mesuré sur le hub le 27/07 : les 117 élèves des 4 classes réelles se résolvent
// tous par clé directe, le repli exhaustif par « name » n'apporterait rien.
// L'app ne FABRIQUE jamais un code : /codes est créé et géré par le site.
function lireCodeEleveMJPC(db, cle, codesTest){
  // en mode test, le code fictif fait foi et /codes n'est même pas consulté
  if(codesTest && codesTest[cle]!==undefined && codesTest[cle]!==null){
    return Promise.resolve({etat:"trouve", code:String(codesTest[cle]), test:true});
  }
  return db.ref("codes/"+cle).once("value").then(function(s){
    var v=s.val();
    if(v===null || v===undefined) return {etat:"absent", code:null};
    if(typeof v==="string") return {etat:"trouve", code:String(v)};
    if(v && v.code!==undefined && v.code!==null) return {etat:"trouve", code:String(v.code)};
    return {etat:"absent", code:null};
  }, function(e){
    return {etat:"erreur", code:null, message:(e&&e.message)||"lecture impossible"};
  });
}

// ════════════ PURGE DU MODE TEST — EXHAUSTIVE ET VÉRIFIÉE ════════════
// Ne touche QUE ce qui est reconnaissable comme donnée de test : drapeau test:true,
// classe de test, ou clé fictive. Tous les nœuds indexés par clé-élève sont couverts
// (compteurLectures, file, tablettes), pas seulement les quatre d'avant le 27/07.
// CHAQUE suppression est vérifiée : les refus du serveur sont collectés et rendus.
// « Terminé » ne se dit jamais sans que tout ait réussi.
//   opts.volatils : + live / liveSnapshot / compliments (état projeté du test)
//   opts.classe   : + la classe fictive de /classes
function purgeTestMJPC(db, opts){
  opts = opts || {};
  var refus = [];
  function lire(chemin){
    return db.ref(chemin).once("value").then(
      function(s){ return s.val()||{}; },
      function(e){ refus.push({chemin:chemin, message:"lecture impossible : "+((e&&e.message)||"refusée")}); return {}; });
  }
  // PRÉCAUTION CAPITALE : « MARTIN Lucas » ou « PETIT Thomas » peuvent parfaitement
  // exister dans une classe réelle. Tant que ce n'est pas écarté, une clé fictive
  // NE SUFFIT PAS à désigner une donnée de test : seuls le drapeau test:true et la
  // classe de test font foi. Sinon la purge détruirait le compteur d'équité, la file
  // ou les passages d'un élève réel homonyme — précisément le sinistre à éviter.
  return clesFictivesLibres(db).then(function(v){
  var clesSures = v.libres;
  if(!clesSures) refus.push({chemin:"(clés fictives)", message:"identité réelle homonyme détectée ("+v.collisions.map(function(c){return c.cle;}).join(", ")+") : purge limitée aux données marquées, les nœuds indexés par clé ne sont pas touchés"});
  return Promise.all([
    lire(DB_ROOT+"/seances"), lire(DB_ROOT+"/historiqueLectures"), lire(DB_ROOT+"/file"),
    lire(DB_ROOT+"/compteurLectures"), lire(DB_ROOT+"/tablettes"), lire(DB_ROOT+"/votes")
  ]).then(function(r){
    var seances=r[0], hist=r[1], file=r[2], compteurs=r[3], tablettes=r[4], votes=r[5];
    var chemins=[], pidsTest={};
    Object.keys(seances).forEach(function(sid){
      var s=seances[sid]||{};
      if(s.test===true || estClasseTest(s.classeSlug)){
        chemins.push(DB_ROOT+"/seances/"+sid);
        Object.keys(s.passages||{}).forEach(function(pid){ pidsTest[pid]=1; });
      }
    });
    Object.keys(hist).forEach(function(pid){
      var pa=hist[pid]||{};
      if(pa.test===true || estClasseTest(pa.classeSlug)) pidsTest[pid]=1;
      else if(clesSures && !pa.classeSlug && TEST_CLES.indexOf(sanMJPC(pa.lecteur||""))!==-1) pidsTest[pid]=1;   // passage ancien, sans classe : rattrapé seulement si la clé est sûre
    });
    Object.keys(pidsTest).forEach(function(pid){
      chemins.push(DB_ROOT+"/historiqueLectures/"+pid);
      if(Object.prototype.hasOwnProperty.call(votes, pid)) chemins.push(DB_ROOT+"/votes/"+pid);
    });
    if(clesSures){
      Object.keys(file).forEach(function(k){ if(TEST_CLES.indexOf(k)!==-1) chemins.push(DB_ROOT+"/file/"+k); });
      Object.keys(compteurs).forEach(function(k){ if(TEST_CLES.indexOf(k)!==-1) chemins.push(DB_ROOT+"/compteurLectures/"+k); });
      Object.keys(tablettes).forEach(function(t){
        var occ=toArr((tablettes[t]||{}).occupants);
        var fictive = occ.length>0;
        for(var i=0;i<occ.length;i++){ if(TEST_CLES.indexOf(occ[i]&&occ[i].slug)===-1){ fictive=false; break; } }
        if(fictive) chemins.push(DB_ROOT+"/tablettes/"+t);
      });
    }
    if(opts.volatils) chemins=chemins.concat([DB_ROOT+"/live", DB_ROOT+"/liveSnapshot", DB_ROOT+"/compliments"]);
    if(opts.classe) chemins.push("classes/"+TEST_SLUG);
    // La remontée MJPC des passages de test vit sous le profil de la CLASSE FICTIVE :
    // sans cette ligne, le mode test laisserait des traces dans les profils élèves.
    chemins.push("mjpcProfils/"+TEST_SLUG);
    if(!chemins.length) return {ok:refus.length===0, refus:refus, chemins:[]};
    return Promise.allSettled(chemins.map(function(c){
      return db.ref(c).remove().then(function(){ return c; }, function(e){
        return Promise.reject({chemin:c, message:(e&&e.message)||"refus du serveur"});
      });
    })).then(function(res){
      res.forEach(function(x){ if(x.status==="rejected") refus.push(x.reason||{chemin:"(inconnu)", message:"refus"}); });
      return {ok:refus.length===0, refus:refus, chemins:chemins};
    });
  });
  });
}

// Battement de cœur : écrit tout de suite, puis toutes les 45 s, et poste un dernier
// signal à la fermeture de l'onglet — sendBeacon survit à la fermeture, un update
// Firebase ordinaire non. Rend la fonction d'arrêt (à appeler au démontage React).
function presenceBattement(cle, faireRec){
  if(!cle) return function(){};
  var timer=null, vivant=true;
  function battre(){
    if(!vivant) return;
    try{ db.ref(DB_ROOT+"/presence/"+cle).update(presenceRecord(faireRec())).catch(function(){}); }catch(e){}
  }
  function adieu(){
    try{
      var base=String((firebase.app().options.databaseURL)||"").replace(/\/+$/,"");
      if(!base || !navigator.sendBeacon) return;
      var rec=presenceRecord(faireRec()); rec.parti_le=Date.now();
      navigator.sendBeacon(base+"/"+DB_ROOT+"/presence/"+cle+".json?x-http-method-override=PATCH",
        new Blob([JSON.stringify(rec)], {type:"application/json"}));
    }catch(e){}
  }
  battre();
  timer=setInterval(battre, PRESENCE_BATTEMENT_MS);
  window.addEventListener("pagehide", adieu);
  window.addEventListener("beforeunload", adieu);
  return function(){
    vivant=false;
    if(timer) clearInterval(timer);
    window.removeEventListener("pagehide", adieu);
    window.removeEventListener("beforeunload", adieu);
    adieu();
  };
}
function presenceEnLigne(presence){
  var out=[], now=Date.now(), d=presence||{};
  Object.keys(d).forEach(function(k){
    var r=d[k]||{};
    if(r.last_seen && (now-r.last_seen)<PRESENCE_FRAIS_MS && !r.parti_le) out.push(r);
    else if(r.last_seen && (now-r.last_seen)<PRESENCE_FRAIS_MS && r.parti_le && r.parti_le<r.last_seen) out.push(r);
  });
  return out.sort(function(a,b){ return String(a.display||"").localeCompare(String(b.display||"")); });
}

// ════════════ CORBEILLE — 2e ceinture d'archive (contrat du site MJPC) ════════════
// AUCUNE destruction sans archive. Format canonique du site, vérifié sur pièces :
// corbeille/<AAAA-MM-JJ>/<motif>_<HHMMSS> = {_meta:{chemin,app,motif,ts,…}, data}.
// Le champ est data — JAMAIS contenu (bug de M13 corrigé au LOT-COUTURES).
// UNE ENTRÉE PAR CHEMIN : le plan de restauration du site ne restaure un nœud entier
// que si _meta.chemin est renseigné, donc un chemin par entrée, jamais un sous-arbre.
function _anneeScolaireMJPC(){ var d=new Date(), y=d.getFullYear(); return (d.getMonth()<7)?((y-1)+"-"+y):(y+"-"+(y+1)); }
function corbeillePutMJPC(db, motif, chemin, valeur, suffixe){
  var d=new Date();
  var jour=d.toISOString().slice(0,10);
  var hms=("0"+d.getHours()).slice(-2)+("0"+d.getMinutes()).slice(-2)+("0"+d.getSeconds()).slice(-2);
  var cle=String(motif).replace(/[^a-z0-9_-]/gi,"-")+"_"+hms+(suffixe?("_"+suffixe):"");
  var payload={_meta:{motif:motif, chemin:chemin, app:MJPC_APP.id, source:MJPC_APP.id,
                      date:d.toISOString(), ts:Date.now(), annee:_anneeScolaireMJPC()},
               data:(valeur===undefined?null:valeur)};
  return db.ref("corbeille/"+jour+"/"+cle).set(payload).then(function(){ return "corbeille/"+jour+"/"+cle; });
}
// Archive N chemins AVANT toute destruction. Si une seule archive échoue, TOUT est
// abandonné : rien n'est détruit (patron analyse_logique / LOT-COUTURES).
function corbeilleArchiverPuisDetruire(db, motif, entrees){
  var faites=[];
  return Promise.allSettled(entrees.map(function(e, i){
    return corbeillePutMJPC(db, motif, e.chemin, e.valeur, String(i+1));
  })).then(function(res){
    var echecs=[];
    res.forEach(function(x, i){
      if(x.status==="fulfilled") faites.push(x.value);
      else echecs.push({chemin:entrees[i].chemin, message:(x.reason&&x.reason.message)||"archive refusée"});
    });
    if(echecs.length) return {ok:false, phase:"archive", echecs:echecs, archives:faites};
    return Promise.allSettled(entrees.map(function(e){
      return db.ref(e.chemin).remove().then(function(){ return e.chemin; }, function(err){
        return Promise.reject({chemin:e.chemin, message:(err&&err.message)||"suppression refusée"});
      });
    })).then(function(res2){
      var ech2=[];
      res2.forEach(function(x){ if(x.status==="rejected") ech2.push(x.reason); });
      return {ok:ech2.length===0, phase:"suppression", echecs:ech2, archives:faites};
    });
  });
}

var MIN_CRIT=3, MAX_CRIT=8;

function parseCriteresJSON(txt){
  // Tolère du markdown ```json ... ``` autour
  var clean=(txt||"").trim().replace(/^```(?:json)?\s*/i,"").replace(/```\s*$/,"").trim();
  if(!clean) return {err:"Colle d'abord le JSON renvoyé par l'IA."};
  var obj;
  try { obj=JSON.parse(clean); }
  catch(e){ return {err:"JSON invalide — "+e.message}; }
  if(!obj || !Array.isArray(obj.criteres)) return {err:"Champ « criteres » manquant ou ce n'est pas un tableau."};
  var n=obj.criteres.length;
  if(n<MIN_CRIT || n>MAX_CRIT) return {err:"Il faut entre "+MIN_CRIT+" et "+MAX_CRIT+" critères ; j'en compte "+n+"."};
  for(var i=0;i<n;i++){
    var c=obj.criteres[i];
    if(!c||typeof c!=="object") return {err:"Critère "+(i+1)+" : objet JSON attendu."};
    if(!c.emoji||typeof c.emoji!=="string") return {err:"Critère "+(i+1)+" : « emoji » manquant ou vide."};
    if(!c.label||typeof c.label!=="string") return {err:"Critère "+(i+1)+" : « label » manquant ou vide."};
    if(!c.questionVotant||typeof c.questionVotant!=="string") return {err:"Critère "+(i+1)+" : « questionVotant » manquant ou vide."};
  }
  return {ok:obj.criteres.map(function(c){return {emoji:c.emoji.trim(), label:c.label.trim(), questionVotant:c.questionVotant.trim()};})};
}

/* slugify supprimé (14/07/2026) : la clé de /classes est le nom tel quel (cleClasse, décision §12) — plus de tirets */
function prenom(full){
  if(!full) return "";
  var parts = String(full).trim().split(/\s+/);
  for(var i=parts.length-1;i>=0;i--){
    if(parts[i].length>1 && parts[i]!==parts[i].toUpperCase()) return parts[i];
  }
  return parts[parts.length-1];
}
// Couche défensive Firebase : objet {0:..,1:..} -> array, null -> []
function toArr(v){
  if(v===null||v===undefined) return [];
  if(Array.isArray(v)) return v;
  if(typeof v==="object"){
    var ks=Object.keys(v);
    if(ks.length && ks.every(function(k){return String(parseInt(k,10))===k;}))
      return ks.sort(function(a,b){return a-b;}).map(function(k){return v[k];});
    return Object.keys(v).map(function(k){return v[k];});
  }
  return [v];
}
/* extractEleves local supprimé (14/07/2026) : le canon du socle MJPC-CORE fait foi
   (il gère en plus les élèves-objets dans les listes et la méta "published"). */
function reglagesSafe(r){
  r = r || {};
  var crit = toArr(r.criteres);
  if(crit.length<MIN_CRIT || crit.length>MAX_CRIT) crit = CRITERES_DEFAUT.slice();
  var seuils = toArr(r.seuilsCheckpoints);
  // aligne longueur des seuils sur le nombre de critères (complète par 70 % ou tronque)
  while(seuils.length<crit.length) seuils.push(70);
  if(seuils.length>crit.length) seuils=seuils.slice(0,crit.length);
  var comp = toArr(r.compliments);
  if(!comp.length) comp = COMPLIMENTS_DEFAUT.slice();
  if(comp.length>MAX_COMP) comp = comp.slice(0,MAX_COMP);
  // ──── Spontanée ────
  var msgT = toArr(r.messagesTimides);
  if(!msgT.length) msgT = MESSAGES_TIMIDES_DEFAUT.slice();
  if(msgT.length>MAX_MSGT) msgT = msgT.slice(0,MAX_MSGT);
  var ecart = parseInt(r.ecartLectures,10);
  if(isNaN(ecart) || ecart<0 || ecart>10) ecart = REGLAGES_DEFAUT.ecartLectures;
  var spl = parseInt(r.secsParLigne,10);
  if(isNaN(spl) || spl<1 || spl>30) spl = REGLAGES_DEFAUT.secsParLigne;
  var trig = parseInt(r.timideTrigger,10);
  if(isNaN(trig) || trig<1 || trig>20) trig = REGLAGES_DEFAUT.timideTrigger;
  return {
    nbTables: r.nbTables || NB_TABLES_DEFAUT,
    decay: (r.decay===undefined?REGLAGES_DEFAUT.decay:r.decay),
    boost: (r.boost===undefined?REGLAGES_DEFAUT.boost:r.boost),
    complimentsOn: (r.complimentsOn===undefined?true:!!r.complimentsOn),
    dureeSec: Math.max(15, Math.min(300, parseInt(r.dureeSec,10) || REGLAGES_DEFAUT.dureeSec)),
    modeCheckpoints: !!r.modeCheckpoints,
    seuilsCheckpoints: seuils.map(function(v){return Math.max(0,Math.min(100,Number(v)||0));}),
    criteres: crit,
    compliments: comp,
    modeSpontane: !!r.modeSpontane,
    ecartLectures: ecart,
    secsParLigne: spl,
    messagesTimides: msgT,
    messagesTimidesOn: (r.messagesTimidesOn===undefined?true:!!r.messagesTimidesOn),
    timideTrigger: trig,
    texteAuTableauOn: !!r.texteAuTableauOn,
    // bornes choix élève
    nbLignesMin: Math.max(1, parseInt(r.nbLignesMin,10) || REGLAGES_DEFAUT.nbLignesMin),
    nbLignesMax: Math.max(2, parseInt(r.nbLignesMax,10) || REGLAGES_DEFAUT.nbLignesMax),
    dureeMin: Math.max(10, parseInt(r.dureeMin,10) || REGLAGES_DEFAUT.dureeMin),
    dureeMax: Math.max(20, parseInt(r.dureeMax,10) || REGLAGES_DEFAUT.dureeMax)
  };
}

      )),

        h("ul",null,

          h("li",null,h("strong",null,"Te connecter : "),"tape ton NOM en MAJUSCULES, puis ton Prénom. Tu apparais en bas dans la liste des occupants."),
          h("li",null,h("strong",null,"S'ajouter en cours : "),"si un camarade arrive sur ta tablette pendant la séance, il tape « + Ajouter » en bas et se connecte (jusqu'à 3 occupants par tablette)."),
