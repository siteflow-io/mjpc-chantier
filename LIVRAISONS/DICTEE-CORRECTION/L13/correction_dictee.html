/* Purge exhaustive : tout ce que la génération a écrit, et rien d'autre.
   Rend la liste des chemins effacés pour que le prof voie ce qui a été fait. */
function purgerDonneesTest(cb){
  var d=genererDonneesTest();
  var chemins=[];
  d.dictees.forEach(function(x){ chemins.push("correction_dictee/"+x.id); });
  chemins.push("classes/"+d.classe);
  Object.keys(d.codes).forEach(function(k){ chemins.push("codes/"+k); });
  TEST_CODES_ANCIENS.forEach(function(k){ chemins.push("codes/"+k); });   /* [ELEVE-1 ④] les codes fictifs d'avant le renommage */
  var restants=chemins.length, effaces=[];
  chemins.forEach(function(c){
    db.ref(c).remove().then(function(){ effaces.push(c); }).catch(function(){})
      .then(function(){ if(--restants===0 && cb) cb(effaces); });
  });
}

// appelle la fonction RÉELLE (etatDicteeEleve, txt, supprimerDicteeAvecCorbeille) :
// aucune logique n'est recopiée ici.
function OutilsTestSouche(p){
  var s1=useState(""),msg=s1[0],setMsg=s1[1];
  var s2=useState(null),etats=s2[0],setEtats=s2[1];

  function verifierLesQuatreEtats(){
    db.ref("correction_dictee").once("value",function(snap){
      var val=snap.val()||{};
      var lignes=[];
      [TEST_DICTEE_A,TEST_DICTEE_B].forEach(function(id){
        var v=val[id]; if(!v) return;
        var d={id:id,title:(v.config||{}).title||id,results:v.results||{},
               autocorrection:v.autocorrection||{},absents:v.absents||{},
               copyPublishedAt:v.copyPublishedAt||null};
        TEST_ELEVES.forEach(function(e){
          var et=etatDicteeEleve(d,san(e));   // LA fonction réelle
          lignes.push({dictee:d.title,eleve:e.split(" ").pop(),code:et.code,label:et.label});
        });
      });
      setEtats(lignes);
      var codes={}; lignes.forEach(function(l){codes[l.code]=true});
      var attendus=["terminee","afaire","attente","absent"];
      var manquants=attendus.filter(function(c){return !codes[c]});
      setMsg(manquants.length===0
        ? "Les 4 états sont présents dans le bac à sable."
        : "États manquants : "+manquants.join(", ")+" — regénère le bac à sable.");
    });
  }

  function testerEditeurDeTextes(){
    var essai="[test] Ce texte a été modifié depuis le bac à sable.";
    db.ref("correction_dictee_textes").once("value",function(sn){
      var v=sn.val()||{};
      if(v.liste_vide===essai){
        delete v.liste_vide;
        db.ref("correction_dictee_textes").set(v).then(function(){
          setMsg("Texte remis à l'original. Recharge la vue élève pour le constater.");
        });
      } else {
        v.liste_vide=essai;
        db.ref("correction_dictee_textes").set(v).then(function(){
          setMsg("Texte modifié. Incarne un élève SANS dictée pour le voir : « "+txt("liste_vide")+" ». Reclique pour revenir à l'original.");
        });
      }
    });
  }

  function testerLaCorbeille(){
    db.ref("correction_dictee/"+TEST_DICTEE_B).once("value",function(sn){
      if(!sn.val()){ setMsg("La dictée de test B n'existe pas : regénère le bac à sable."); return; }
      supprimerDicteeAvecCorbeille({id:TEST_DICTEE_B,title:"Dictée test — pas encore corrigée"},function(){
        var j=new Date().toISOString().slice(0,10);

          setMsg(ks.length
            ? "Archivée : corbeille/"+j+"/"+ks[ks.length-1]+" — et un export JSON a été téléchargé. Regénère le bac à sable pour la retrouver."

      });

      " — ces boutons appellent les fonctions réelles de l'app, pas des copies."),

      h("button",Object.assign({},b,{onClick:verifierLesQuatreEtats,title:"Calcule l'état de chaque élève de test avec etatDicteeEleve(), la fonction qu'utilise « Mes dictées »."}),"\u2713 Vérifier les 4 états"),
      h("button",Object.assign({},b,{onClick:testerEditeurDeTextes,title:"Modifie le texte « liste vide » puis le remet : le va-et-vient se constate côté élève incarné."}),"\u270f\ufe0f Tester l'éditeur de textes"),
      h("button",Object.assign({},b,{style:{marginRight:6,marginBottom:6,color:"#b00"},onClick:testerLaCorbeille,title:"Supprime la dictée de test B par le chemin réel (corbeille MJPC + export JSON)."}),"\ud83e\uddf9 Tester la corbeille")

function ModeTest(p){
  var sE=useState(null),etat=sE[0],setEtat=sE[1];
  var sB=useState(false),busy=sB[0],setBusy=sB[1];
  function rafraichirEtat(){
    db.ref("correction_dictee/"+TEST_DICTEE_A).once("value",function(s1){
      db.ref("classes/"+classeTestId()).once("value",function(s2){
        setEtat({dictee:!!s1.val(),classe:!!s2.val()});
      },function(){setEtat({dictee:!!s1.val(),classe:false})});
    },function(){setEtat({dictee:false,classe:false})});
  }
  useEffect(rafraichirEtat,[]);
  function generer(){
    setBusy(true);
    var d=genererDonneesTest();
    /* Nettoyage des zombies AVANT de générer : un bac à sable ne s'empile jamais. */
    purgerDonneesTest(function(){
      ecrireClasse(db, d.classe, d.eleves, {nom:d.classe, niveau:"5e"}, function(){   /* [ELEVE-1 ④] le 2e élève fictif est aménagé d'après sa « fiche » ; partira avec la classe de test */
        var am={};d.eleves.forEach(function(e,i){am[san(e)]={sexe:i%2?"m":"f",dicteeAmenagee:i===1};});db.ref("classes/"+d.classe+"/amenagements").set(am);});
      var maj={};
      Object.keys(d.codes).forEach(function(k){
        maj["codes/"+k]={code:d.codes[k],name:(function(){ for(var i=0;i<d.eleves.length;i++){ if(san(d.eleves[i])===k) return d.eleves[i]; } return k; })(),classe:d.classe,createdAt:Date.now()};
      });
      d.dictees.forEach(function(x){ maj["correction_dictee/"+x.id]=x.payload; });
      db.ref().update(maj).then(function(){ setBusy(false); rafraichirEtat(); p.onGenere&&p.onGenere(); })
        .catch(function(e){ setBusy(false); alert("La g\u00e9n\u00e9ration a \u00e9chou\u00e9 : "+(e&&e.message||"raison inconnue")); });
    });
  }
  function purger(){
    if(!confirm("Effacer le bac \u00e0 sable ?\n\nSeront supprim\u00e9s : les 2 dict\u00e9es de test, la classe "+classeTestId()+" et les 6 codes fictifs.\nAucune donn\u00e9e r\u00e9elle n\u2019est touch\u00e9e."))return;
    setBusy(true);
    purgerDonneesTest(function(effaces){ setBusy(false); rafraichirEtat(); p.onPurge&&p.onPurge(effaces.length); });
  }
  function incarner(nom){
    var u=window.location.pathname+"?mode=eleve&incarner="+encodeURIComponent(san(nom));
    window.open(u,"_blank");
  }
  var actif=etat&&(etat.dictee||etat.classe);
  return h("div",{className:"card"},
    h("div",{className:"m6-mobile-col",style:{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}},
      h("h2",{style:{margin:0}},"\ud83e\uddea Mode test"),
      h("span",{className:"etat-dictee "+(actif?"etat-afaire":"etat-attente")},actif?"Bac \u00e0 sable actif":"Aucun bac \u00e0 sable")
    ),
    h("p",{style:{fontSize:".85rem",color:"var(--text-sub)"}},
      "Un clic cr\u00e9e une classe fictive, deux dict\u00e9es et six \u00e9l\u00e8ves avec leurs codes \u2014 de quoi voir exactement ce que voit un \u00e9l\u00e8ve dans chaque situation. Rien de r\u00e9el n\u2019est touch\u00e9.",
      ifo("Classe "+classeTestId()+" (invisible des \u00e9l\u00e8ves, jamais archiv\u00e9e). Dict\u00e9e A : corrig\u00e9e et rendue, avec un \u00e9l\u00e8ve absent. Dict\u00e9e B : pas encore corrig\u00e9e.",{below:true})
    ),
    h("div",{style:{display:"flex",gap:8,flexWrap:"wrap",marginBottom:actif?12:0}},
      h("button",{className:"btn btn-primary",disabled:busy,onClick:generer},busy?"\u2026":(actif?"\ud83d\udd04 Regénérer":"\ud83e\uddea Créer le bac à sable")),
      actif?h("button",{className:"btn-sm btn-ghost",disabled:busy,style:{color:"#b00"},onClick:purger},"\ud83e\uddf9 Tout effacer"):null
    ),
    actif?h("div",null,
      h(OutilsTestSouche,null),
      h("p",{style:{fontSize:".82rem",color:"var(--text-sub)",margin:"12px 0 6px"}},"Se mettre \u00e0 la place d\u2019un \u00e9l\u00e8ve (nouvel onglet) :"),
      h("div",{style:{display:"flex",gap:6,flexWrap:"wrap"}},
        TEST_ELEVES.map(function(e){
          var suffixe = san(e)==="zztest_moreau_sacha" ? " (absent)" : (san(e)==="zztest_robert_chloe" ? " (sans copie)" : "");
          return h("button",{key:e,className:"btn-sm btn-ghost",style:{fontSize:".8rem"},onClick:function(){incarner(e)}},
            e.split(" ").pop()+suffixe);
        })
      )
    ):null
  );
}

// M6quater — État d'une dictée pour l'élève. QUATRE dimensions se croisent :
//   ⓪ l'élève était-il là     (absents/<clé>)               — PRIORITAIRE sur tout
//   ① la dictée est publiée   (config.published)            — filtrée en amont
//   ② la copie est rendue     (copyPublishedAt)
//   ③ le travail de l'élève   (results, autocorrection)
// L'absence prime : dire « pas encore corrigée » à un élève qui n'était pas là est faux.
// L'état rendu porte un champ `rattrapage` : point d'accroche du RATTRAPAGE MODAL
// (chantier X — proposer une autre modalité, dont la dictée audio en étude, et inscrire
// la modalité retenue sur la copie finale). Il vaut null tant que le chantier n'est pas
// ouvert ; aucun appelant ne doit supposer sa présence.
function etatDicteeEleve(d,cle){
  if(d.absents&&d.absents[cle]) return {code:"absent",label:"Tu \u00e9tais absent(e)",
    ouvrable:false,montrerNote:false,rattrapage:null};
  var corr=d.results?d.results[cle]:null;
  if(!corr) return {code:"attente",label:"Pas encore corrig\u00e9e",ouvrable:false,montrerNote:false,rattrapage:null};
  if(!d.copyPublishedAt) return {code:"nonrendue",label:"Disponible apr\u00e8s la s\u00e9ance",
                                 ouvrable:false,montrerNote:false,rattrapage:null,date:dateVueCopie(d,corr)};
  var ac=(d.autocorrection||{})[cle]||null;
  var total=ac&&typeof ac.total==="number"?ac.total:null;
  var solved=ac&&typeof ac.solved==="number"?ac.solved:0;
  if(total!==null&&total>0&&solved>=total)
    return {code:"terminee",label:"Termin\u00e9e",ouvrable:true,montrerNote:true,rattrapage:null,date:dateVueCopie(d,corr)};
  return {code:"afaire",label:"\u00c0 faire",ouvrable:true,montrerNote:true,rattrapage:null,date:dateVueCopie(d,corr),
          reste:(total!==null&&total>0)?(total-solved):null};
}

    if(!codesData)return null;

    var ks=Object.keys(codesData);
    for(var i=0;i<ks.length;i++){
      var v=codesData[ks[i]];
      if(v&&v.name&&sanMJPC(v.name)===cle) return v.code?String(v.code):null;
      if(sanMJPC(ks[i])===cle) return (typeof v==="string")?v:(v&&v.code?String(v.code):null);
    }
    return null;
  }

  function doLogin(nomPropose,prenomPropose){
    var nom=(typeof nomPropose==="string"?nomPropose:nomInput).trim().toUpperCase();
    var prenom=(typeof prenomPropose==="string"?prenomPropose:prenomInput).trim();
    var code=codeInput.trim();
    if(!nom||!prenom){setErrMsg("Entre ton nom et ton pr\u00e9nom.");return}
    if(!code){setErrMsg("Entre ton code personnel (4 chiffres).");return}


    // Le nom doit exister dans un roster (le registre officiel fait foi)
    var registre=classesData||CLASSES||{};
    var rosterComplet=[];
    Object.keys(registre).forEach(function(c){
      extractEleves(registre[c],[]).forEach(function(e){ if(rosterComplet.indexOf(e)<0) rosterComplet.push(e); });
    });
    dictees.forEach(function(d){ (d.eleves||[]).forEach(function(e){ if(rosterComplet.indexOf(e)<0) rosterComplet.push(e); }); });
    var res=resolveEleves(rosterComplet,[{nom:nom,prenom:prenom}]);
    if(res&&res.erreur){setErrMsg("Aucun \u00e9l\u00e8ve \u00e0 ce nom. V\u00e9rifie l\u2019orthographe de ton nom et de ton pr\u00e9nom.");return}
    var moi=res[0];

    /* M-SÉCU-2 : vérification par EMPREINTE, repli clair (aucun élève dehors à ce morceau) */
    var entree=mjpcEntreeCode(codesData,moi.cle);
    if(!entree){setErrMsg("Ton code n\u2019est pas encore enregistr\u00e9. Viens me voir pour qu\u2019on le mette en place.");return}
    mjpcVerifierCode(entree,code).then(function(rOK){
      if(!rOK.ok){setErrMsg(mjpcMessageRefusEleve(rOK.voie)||"Ce code ne correspond pas. V\u00e9rifie tes 4 chiffres.");return}
      mjpcRetirerBoutonProf();
      _finLoginEleve();
    });
    return;
    function _finLoginEleve(){

    setErrMsg("");
    var cls="";
    var kc=Object.keys(registre);
    for(var ci=0;ci<kc.length;ci++){
      var rr=extractEleves(registre[kc[ci]],[]);
      for(var ri=0;ri<rr.length;ri++){ if(san(rr[ri])===moi.cle){cls=kc[ci];break} }
      if(cls)break;
    }
    setIdentite({nom:moi.nom,cle:moi.cle,classe:cls,via:"code"});
    if(p.moitie)moitieEcrire(p.moitie,{nom:moi.nom,cle:moi.cle,classe:cls,via:"code"});
    }
  }

  // ── « Mes dictées » : toutes les dictées de l'élève, corrigées ou non ──
  if(screen==="mesdictees"){
    if(!classesData||!dictees.length) return h("div",{className:"container fade-up",style:{paddingTop:40,textAlign:"center"}},

            return h("div",{key:d.id,className:"m6-mobile-col mesdictees-ligne"+(et.ouvrable?"":" non-ouvrable"),
              style:{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,padding:"11px 14px",
                     border:"1.5px solid var(--border)",borderRadius:10,marginBottom:8,
                     cursor:et.ouvrable?"pointer":"default"},
              onClick:et.ouvrable?function(){ouvrirDictee(d)}:null},

                )

              h("div",{style:{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}},
                h("span",{className:"etat-dictee etat-"+et.code},et.label),
                (et.montrerNote&&d.showNote!==false&&c&&typeof c.note!=="undefined")?
                  h("span",{style:{fontWeight:700,color:noteColor(c.note,baseDeCopie(c,d.base))}},noteFr(c.note)+"/"+baseDeCopie(c,d.base)):null,
                et.ouvrable?h("span",{style:{color:"var(--primary)",fontWeight:600,fontSize:".9rem"}},"Ouvrir \u2192"):null
              )
            );
          })
      ),
      errMsg&&h("p",{style:{color:"var(--coral)",fontSize:".88rem"}},errMsg)
    );
  }

  // ── Dictée pas encore corrigée : on le dit, on ne fait pas semblant ──
  if(screen==="attente"&&attente){
    return h("div",{className:"container fade-up",style:{paddingTop:30}},
      h("div",{className:"card",style:{textAlign:"center"}},
        h("h1",null,attente.title),
        h("p",{className:"subtitle"},attente.classe),
        (function(){
          var e=identite?etatDicteeEleve(attente,identite.cle):{code:"attente"};
          var msg = e.code==="absent"
              ? txt("invitation_rattrapage")
            : e.code==="nonrendue"
              ? "Ta copie est corrig\u00e9e. "+txt("attente_copie")
              : "Cette dict\u00e9e n\u2019est pas encore corrig\u00e9e. Tes erreurs \u00e0 revoir appara\u00eetront ici apr\u00e8s la s\u00e9ance de correction.";
          return h("p",{style:{fontSize:".95rem",color:"var(--text-sub)",maxWidth:420,margin:"0 auto 18px"}},msg);
        })(),

    h("div",{className:"card",style:{textAlign:"center"}},
      h("p",{style:{fontWeight:600,marginBottom:12}},"Les exercices de cette dict\u00e9e ne sont pas ouverts."),

  if(screen==="exercices") return h("div",{className:"container fade-up"},
    h(ExercicesEleve,{dicteeId:eleveData.dictee.id,eleve:eleveData.eleve,onBack:function(){

      else setScreen("correction");
    }})
  );
  if(screen==="copie") return h(MaCopie,{data:eleveData,onExercices:function(){setScreen("exercices")},onLogout:retourListe});
  return null;
}

// MODULE EXERCICES — banque d'exercices personnalisés générée par IA

// Prompt IA spécifique à la production de JSON exercices (vs HTML)
// ─── Prompt IA exercices : décomposé en deux zones distinctes ───
// Zone éditable (ce que tu changes pour personnaliser le type d'exos / niveau / thèmes)
var PROMPT_DIRECTIVES_DEFAULT = "Tu es un professeur de fran\u00e7ais expert en didactique. Je te fournis ci-dessous le JSON d'une dict\u00e9e corrig\u00e9e. Tu dois produire un JSON d'exercices personnalis\u00e9s, dans le FORMAT d\u00e9crit plus bas (et rien d'autre, ni HTML, ni commentaire externe).\n\n=== R\u00c8GLES P\u00c9DAGOGIQUES ===\n\n- Exercices_classe : analyse les erreurs faites par AU MOINS 3 \u00e9l\u00e8ves dans le JSON. Pour chaque difficult\u00e9 collective, cr\u00e9e UN exercice avec 4 \u00e0 6 items.\n- Exercices_personnels : pour CHAQUE \u00e9l\u00e8ve ayant fait au moins 3 erreurs, cr\u00e9e 2 \u00e0 4 exercices cibl\u00e9s sur SES erreurs (pas celles des autres). La cl\u00e9 doit \u00eatre le pr\u00e9nom normalis\u00e9 (minuscules, sans accent, espaces remplac\u00e9s par _).\n- ALTERNE les types d'exercices au sein de chaque s\u00e9rie : par exemple un QCM, puis un exo de copie, puis une r\u00e9\u00e9criture, puis un exo d'\u00e9criture libre. Ne fais PAS QUE des QCM \u2014 varie selon ce qui aidera vraiment l'\u00e9l\u00e8ve.\n- Choisis le type d'item selon l'objectif :\n  \u2022 QCM : pour discriminer entre formes proches (homophones, accords ambigus)\n  \u2022 TROUS : pour entra\u00eener un automatisme (conjugaison, terminaison)\n  \u2022 R\u00c9\u00c9CRITURE : pour transformer (changement de temps, de personne, voix active/passive)\n  \u2022 COPIE : pour ancrer l'orthographe lexicale d'un mot/expression difficile (recopier en attention)\n  \u2022 \u00c9CRITURE : pour produire (mobiliser une notion en production libre, faire 2-3 phrases sur consigne)\n- Pour les trous, UN SEUL MOT par null (jamais une expression).\n- Pour reecriture, donne 1 \u00e0 3 variantes accept\u00e9es pour couvrir les flottements normaux (accords libres, ponctuation).\n- Niveau de langue adapt\u00e9 au niveau scolaire indiqu\u00e9 dans le JSON.\n- AUCUN commentaire en dehors du JSON. Le JSON commence par { et se termine par }.";

// Zone fixe (spec technique JSON — modifiable en mode expert si tu veux d'autres types d'items, mais l'app reconnaît officiellement qcm/trous/reecriture)
var PROMPT_FORMAT_DEFAULT = "=== FORMAT JSON DE SORTIE ===\n\n{\n  \"exercices_classe\": [\n    {\n      \"id\": \"ex_classe_1\",\n      \"titre\": \"Titre court\",\n      \"regle\": \"Rappel de r\u00e8gle (max 4 lignes)\",\n      \"items\": [ ... voir types ci-dessous ... ]\n    }\n  ],\n  \"exercices_personnels\": {\n    \"prenom_eleve_normalise\": [ { ... m\u00eame structure ... } ]\n  }\n}\n\n=== TYPES D'ITEMS DISPONIBLES (5 types) ===\n\n1. QCM : un seul bon choix\n{\n  \"type\": \"qcm\",\n  \"enonce\": \"Consigne courte (ex: Choisis la bonne orthographe)\",\n  \"phrase\": \"Phrase avec ___ \u00e0 la place du mot manquant\",\n  \"propositions\": [\"proposition 1\", \"proposition 2\", \"proposition 3\"],\n  \"reponse\": 1\n}\n(reponse = index 0-bas\u00e9 de la bonne proposition)\n\n2. TROUS : phrase \u00e0 trous, un champ par mot\n{\n  \"type\": \"trous\",\n  \"enonce\": \"Compl\u00e8te avec le verbe au bon temps\",\n  \"segments\": [\"Le chat \", null, \" la souris et \", null, \" sur le toit.\"],\n  \"reponses\": [\"attrape\", \"saute\"]\n}\n(segments = tableau alternant cha\u00eenes et null ; null = case \u00e0 remplir ; reponses align\u00e9 sur l'ordre des null. Un null = UN seul mot \u00e0 remplir).\n\n3. R\u00c9\u00c9CRITURE : transformer une phrase\n{\n  \"type\": \"reecriture\",\n  \"enonce\": \"R\u00e9\u00e9cris au pass\u00e9 compos\u00e9\",\n  \"phrase\": \"Phrase de d\u00e9part\",\n  \"reponse_exacte\": \"Phrase attendue\",\n  \"reponses_acceptees\": [\"Variante 1 accept\u00e9e\", \"Variante 2\"]\n}\n(reponses_acceptees facultatif, pour les variantes)\n\n4. COPIE : recopier une phrase en focalisant sur un point pr\u00e9cis\n{\n  \"type\": \"copie\",\n  \"enonce\": \"Recopie cette phrase en faisant bien attention aux accents\",\n  \"phrase\": \"La phrase \u00e0 recopier exactement (souvent contenant le mot/expression cibl\u00e9).\",\n  \"lignes\": 2\n}\n(lignes = nombre de lignes blanches pour la recopie, par d\u00e9faut 2)\n\n5. \u00c9CRITURE : production \u00e9crite libre avec crit\u00e8res\n{\n  \"type\": \"ecriture\",\n  \"enonce\": \"\u00c9cris 3 phrases utilisant les pronoms relatifs lequel et laquelle\",\n  \"criteres\": [\"Au moins 3 phrases\", \"Utiliser lequel et laquelle\", \"Sujet libre\"],\n  \"lignes\": 5\n}\n(criteres = liste de points \u00e0 respecter ; lignes = nombre de lignes blanches pour \u00e9crire)\n\nN.B. : qcm/trous/reecriture sont auto-corrig\u00e9s c\u00f4t\u00e9 \u00e9l\u00e8ve dans l'app. copie/ecriture sont saisis en texte libre c\u00f4t\u00e9 \u00e9l\u00e8ve, et corrig\u00e9s manuellement par le prof.\n\n=== JSON DE LA DICT\u00c9E ===\n{{JSON_DICTEE}}";

/* La validation des exercices — MÊMES contrôles métier qu'avant, mais les motifs
   S'ACCUMULENT et CITENT l'élément fautif au lieu de s'arrêter au premier. */
function cdValiderExercices(parsed){
  var V=mjpcValidation(8);
  if(!parsed||typeof parsed!=='object'||Array.isArray(parsed)){
    V.exige(false,'La r\u00e9ponse doit \u00eatre un ensemble d\u2019exercices, pas une simple liste ni un texte.');
    return V;
  }
  V.exige(Array.isArray(parsed.exercices_classe),'Il manque les exercices pour toute la classe (\u00ab exercices_classe \u00bb, une liste).');
  V.exige(parsed.exercices_personnels&&typeof parsed.exercices_personnels==='object'&&!Array.isArray(parsed.exercices_personnels),
          'Il manque les exercices personnels (\u00ab exercices_personnels \u00bb, un ensemble par \u00e9l\u00e8ve).');
  var TYPES=['qcm','trous','reecriture','ordre','paires','libre'];
  function exercices(list,ou){
    if(!Array.isArray(list)){V.cite(ou,'devrait contenir une liste d\u2019exercices.');return;}
    list.forEach(function(ex,n){
      var titre=(ex&&(ex.titre||ex.id))||('n\u00b0 '+(n+1));
      if(!ex||!Array.isArray(ex.items)){V.cite(ou+', exercice '+titre,'n\u2019a pas de questions (\u00ab items \u00bb, une liste).');return;}
      items(ex.items,ou+', exercice '+titre);
    });
  }
  function items(list,ou){
    if(!Array.isArray(list)){V.cite(ou,'devrait contenir une liste de questions.');return;}
    list.forEach(function(it,i){
      var ref=ou+', question '+(i+1);
      if(!it||!it.type){V.cite(ref,'n\u2019indique pas son type. Types possibles : '+TYPES.join(', ')+'.');return;}
      if(TYPES.indexOf(it.type)<0)V.cite(ref,'utilise un type inconnu (\u00ab '+it.type+' \u00bb). Types possibles : '+TYPES.join(', ')+'.');
      if(it.type==='qcm'){
        if(!Array.isArray(it.propositions)||it.propositions.length<2)V.cite(ref,'est un choix multiple : il lui faut au moins deux propositions.');
        if(typeof it.reponse!=='number')V.cite(ref,'est un choix multiple : indique le num\u00e9ro de la bonne proposition (0 pour la premi\u00e8re).');
      }else if(it.type==='trous'){
        if(!Array.isArray(it.segments))V.cite(ref,'est un texte \u00e0 trous : il lui faut la liste des morceaux de phrase (\u00ab segments \u00bb).');
        if(!Array.isArray(it.reponses))V.cite(ref,'est un texte \u00e0 trous : il lui faut la liste des r\u00e9ponses.');
        if(Array.isArray(it.segments)&&Array.isArray(it.reponses)){
          var n=it.segments.filter(function(x){return x===null;}).length;
          if(n!==it.reponses.length)V.cite(ref,'a '+n+' trou(s) mais '+it.reponses.length+' r\u00e9ponse(s) : il en faut autant.');
        }
      }else if(it.type==='reecriture'||it.type==='ordre'||it.type==='paires'){
        if(it.type==='ordre'&&!Array.isArray(it.elements))V.cite(ref,'demande de remettre en ordre : il lui faut la liste des \u00e9l\u00e9ments.');
        if(it.type==='paires'&&!Array.isArray(it.paires))V.cite(ref,'demande d\u2019associer : il lui faut la liste des paires.');
        if(it.type==='reecriture'&&!it.consigne)V.cite(ref,'est une r\u00e9\u00e9criture : il lui faut une consigne.');
      }
    });
  }
  if(parsed.exercices_classe)exercices(parsed.exercices_classe,'Exercices de la classe');
  if(parsed.exercices_personnels&&typeof parsed.exercices_personnels==='object'){
    Object.keys(parsed.exercices_personnels).forEach(function(cle){
      var bloc=parsed.exercices_personnels[cle];
      exercices(Array.isArray(bloc)?bloc:[bloc],'Exercices de '+cle);
    });
  }
  return V;
}
function assemblePrompt(directives, format){
  /* M-PROMPT-4 : présentation brève en tête (pièce assemblée, texte persisté intact) */
  return mjpcPromptAvecPresentation(_assemblePromptBrut(directives,format),{breve:true});
}
function _assemblePromptBrut(directives, format){
  return (directives||PROMPT_DIRECTIVES_DEFAULT) + "\n\n" + (format||PROMPT_FORMAT_DEFAULT);
}


// Normalise une réponse pour comparaison (minuscule, sans accent, espaces réduits, ponctuation finale optionnelle)
function exNormalize(s){
  if(s==null)return "";
  return String(s).trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[\u2019\u2018\u0027\u0060]/g,"'")
    .replace(/\s+/g," ")
    .replace(/[.!?\u2026]+$/,"");
}

// Vérifie si une réponse élève correspond à l'attendu (pour reecriture et trous)
function exCheck(userAnswer, expected, accepted){
  var na = exNormalize(userAnswer);
  if(na===exNormalize(expected))return true;
  if(Array.isArray(accepted)){
    for(var i=0;i<accepted.length;i++){
      if(na===exNormalize(accepted[i]))return true;
    }
  }
  return false;
}

// Vérifie un item complet : retourne {ok:bool, details:[bool,bool,...]}
function exCheckItem(item, userInput){
  if(!item)return{ok:false,details:[]};
  if(item.type==="qcm"){
    var ok = (parseInt(userInput,10)===item.reponse);
    return {ok:ok, details:[ok]};
  }
  if(item.type==="trous"){
    var reps = item.reponses||[];
    var inputs = userInput||[];
    var details = reps.map(function(r,i){
      return exCheck(inputs[i]||"", r, null);
    });
    return {ok:details.every(function(d){return d}), details:details};
  }
  if(item.type==="reecriture"){
    var ok = exCheck(userInput||"", item.reponse_exacte, item.reponses_acceptees);
    return {ok:ok, details:[ok]};
  }
  if(item.type==="copie"){
    // Comparaison stricte sur le texte recopié (normalisation espaces + casse douce)
    var attendu = String(item.phrase||"").trim().replace(/\s+/g," ");
    var saisi = String(userInput||"").trim().replace(/\s+/g," ");
    var ok = (attendu === saisi);
    return {ok:ok, details:[ok], attendu:attendu};
  }
  if(item.type==="ecriture"){
    // Production libre : pas d'auto-correction. On marque "saisi" si non vide.
    var saisi = String(userInput||"").trim();
    var ok = (saisi.length > 0);
    return {ok:ok, details:[ok], libre:true};
  }
  return {ok:false, details:[]};
}

// Normalise un prénom pour matcher avec les clés exercices_personnels
function exKeyForEleve(eleveName){
  if(!eleveName)return "";
  var parts = eleveName.split(/\s+/);
  var prenom = parts.length>1 ? parts[parts.length-1] : eleveName;
  return exNormalize(prenom).replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"");
}

// Récupère les exercices applicables à un élève (classe + personnels)
function exGetForEleve(exercicesData, eleveName){
  if(!exercicesData)return{classe:[], personnels:[]};
  var classe = toArr(exercicesData.exercices_classe||[]);
  var key = exKeyForEleve(eleveName);
  var personnels = (exercicesData.exercices_personnels && exercicesData.exercices_personnels[key]) || [];
  personnels = toArr(personnels);
  return {classe:classe, personnels:personnels};
}

  // ─── Génère une fiche d'exercices imprimable depuis le JSON pour un élève ───
  function ficheJsonHtmlPourEleve(eleveName){
    // escapeHtml local (la version globale est définie dans d'autres scopes uniquement)
    function escapeHtml(s){
      return String(s==null?"":s).replace(/[&<>"']/g, function(c){
        return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
      });
    }
    var ex = exGetForEleve(exercices, eleveName);
    var classe = ex.classe || [];
    var perso = ex.personnels || [];
    if(perso.length===0 && classe.length===0)return null;
    function renderItem(item, idx){
      if(!item || !item.type)return '';
      var enonce = item.enonce ? '<div class="enonce">'+escapeHtml(item.enonce)+'</div>' : '';
      if(item.type==="qcm"){
        // Escape AVANT le replace pour éviter d'injecter du HTML non escapé si la phrase contient < > & "
        var phrase = escapeHtml(item.phrase||"").replace(/___/g,'<span class="trou">_____</span>');
        // QCM en grille 2 colonnes (gain de place majeur)
        var props = (item.propositions||[]).map(function(p,i){
          var letters="ABCDEFGH";
          return '<div class="qcm-prop"><span class="qcm-letter">'+letters[i]+'.</span> <span class="qcm-box">\u25a1</span> '+escapeHtml(p)+'</div>';
        }).join("");
        return '<div class="item"><div class="item-num">'+(idx+1)+'.</div><div class="item-body">'+enonce+'<div class="qcm-phrase">'+phrase+'</div><div class="qcm-props">'+props+'</div></div></div>';
      }
      if(item.type==="trous"){
        var segs = item.segments||[];
        // Si pas de segments OU aucun null dans segments → fallback : afficher la phrase + une ligne de réponse
        var hasBlank = segs.some(function(s){return s===null});
        if(segs.length===0 || !hasBlank){
          var phrase = item.phrase || segs.filter(function(s){return s!==null}).map(function(s){return String(s||"")}).join("");
          return '<div class="item"><div class="item-num">'+(idx+1)+'.</div><div class="item-body">'+enonce+
            '<div class="item-reponse-libre">'+escapeHtml(phrase)+' <span class="ligne-reponse">__________________</span></div></div></div>';
        }
        var phraseHtml = segs.map(function(s){
          if(s===null)return '<span class="trou-input">__________</span>';
          return escapeHtml(String(s||""));
        }).join("");
        return '<div class="item"><div class="item-num">'+(idx+1)+'.</div><div class="item-body">'+enonce+'<div class="trous-phrase">'+phraseHtml+'</div></div></div>';
      }
      if(item.type==="reecriture"){
        return '<div class="item"><div class="item-num">'+(idx+1)+'.</div><div class="item-body">'+enonce+
          '<div class="reec-phrase"><strong>'+escapeHtml(item.phrase||"")+'</strong></div>'+
          '<div class="reec-ligne">\u2192 ____________________________________________________________</div>'+
          '<div class="reec-ligne reec-ligne-2">____________________________________________________________</div></div></div>';
      }
      // COPIE : phrase source bien visible + N lignes blanches pour recopier (par défaut 2)
      if(item.type==="copie"){
        var nLignesC = parseInt(item.lignes,10);
        if(!nLignesC || nLignesC < 1) nLignesC = 2;
        var lignesC = "";
        for(var lc=0; lc<nLignesC; lc++){
          lignesC += '<div class="copie-ligne">____________________________________________________________</div>';
        }
        return '<div class="item"><div class="item-num">'+(idx+1)+'.</div><div class="item-body">'+enonce+
          '<div class="copie-source"><strong>\u00ab '+escapeHtml(item.phrase||"")+' \u00bb</strong></div>'+
          lignesC+'</div></div>';
      }
      // ECRITURE : énoncé + critères en liste + N lignes blanches pour écrire (par défaut 5)
      if(item.type==="ecriture"){
        var nLignesE = parseInt(item.lignes,10);
        if(!nLignesE || nLignesE < 1) nLignesE = 5;
        var lignesE = "";
        for(var le=0; le<nLignesE; le++){
          lignesE += '<div class="ecriture-ligne">____________________________________________________________</div>';
        }
        var criteres = "";
        if(Array.isArray(item.criteres) && item.criteres.length > 0){
          criteres = '<ul class="ecriture-criteres">'+item.criteres.map(function(c){
            return '<li>'+escapeHtml(String(c||""))+'</li>';
          }).join("")+'</ul>';
        }
        return '<div class="item"><div class="item-num">'+(idx+1)+'.</div><div class="item-body">'+enonce+
          criteres + lignesE +
          '</div></div>';
      }
      // Fallback pour tout autre type d'item : énoncé + phrase + ligne de réponse
      if(item.enonce || item.phrase){
        var phr = item.phrase || "";
        return '<div class="item"><div class="item-num">'+(idx+1)+'.</div><div class="item-body">'+enonce+
          (phr ? '<div class="qcm-phrase">'+escapeHtml(phr)+'</div>' : '')+
          '<div class="item-reponse-libre"><span class="ligne-reponse">________________________________</span></div></div></div>';
      }
      return '';
    }
    function renderEx(exo){
      var titre = exo.titre ? '<div class="ex-titre">'+escapeHtml(exo.titre)+'</div>' : '';
      var regle = exo.regle ? '<div class="ex-regle">'+escapeHtml(exo.regle)+'</div>' : '';
      var items = exo.items || [];
      // Si tous les items partagent le MÊME énoncé, on l'affiche une seule fois en tête (gain de place)
      var commonEnonce = null;
      if(items.length>1){
        var first = items[0] && items[0].enonce;
        if(first && items.every(function(it){return it && it.enonce === first})){
          commonEnonce = first;
        }
      }
      var consigne = commonEnonce ? '<div class="consigne">'+escapeHtml(commonEnonce)+'</div>' : '';
      var itemsHtml = items.map(function(it, idx){
        // Si énoncé commun retiré, on passe à renderItem un item sans enonce
        if(commonEnonce){
          var clean = Object.assign({}, it);
          delete clean.enonce;
          return renderItem(clean, idx);
        }
        return renderItem(it, idx);
      }).join("");

  // ─── Impression rapide pour les élèves sélectionnés ────────────
  function trouverSectionEleve(doc, eleveName, eleveKey){
    // Essaie plusieurs conventions de structure HTML possibles
    var sels = [
      '[data-eleve="'+eleveName+'"]',
      '[data-eleve-key="'+eleveKey+'"]',
      '[data-name="'+eleveName+'"]',
      '#eleve-'+eleveKey,
      '#exos-'+eleveKey,
      '#fiche-'+eleveKey,
      '#'+eleveKey,
      '.eleve-'+eleveKey,
      '.fiche-'+eleveKey
    ];
    for(var i=0;i<sels.length;i++){
      try{
        var el=doc.querySelector(sels[i]);
        if(el)return el;
      }catch(e){}
    }
    // Fallback : chercher un titre h1/h2/h3 contenant le nom de l'élève
    var hs=doc.querySelectorAll("h1, h2, h3, h4, .eleve, .nom-eleve, .fiche, section, article");
    for(var j=0;j<hs.length;j++){
      var txt=(hs[j].textContent||"").trim();
      if(txt&&txt.indexOf(eleveName)>=0&&txt.length<200){
        // C'est probablement un titre/section. Remonter à l'ancêtre logique (section/article/div parent)
        var parent=hs[j];
        while(parent&&parent.parentElement&&parent.parentElement.tagName&&!/^(SECTION|ARTICLE|MAIN|BODY)$/i.test(parent.tagName)){
          if(parent.tagName==="DIV"&&parent.children.length>1)break;
          parent=parent.parentElement;
        }
        return parent||hs[j];
      }
    }
    return null;
  }

  function imprimerSelection(){

  function _imprimerSelectionImpl(){
    setImpMsg("");
    var hasJsonExos = exercices && (exercices.exercices_classe || exercices.exercices_personnels);
    var hasHtmlExos = exHtml && exHtml.content;
    if(!hasJsonExos && !hasHtmlExos){
      setImpMsg("\u274c Aucun exercice disponible (ni JSON ni HTML).");
      setTimeout(function(){setImpMsg("")},3000);return;
    }
    var selectedNames=Object.keys(selImp).filter(function(k){return selImp[k]});
    if(selectedNames.length===0){setImpMsg("\u274c Coche au moins un \u00e9l\u00e8ve.");setTimeout(function(){setImpMsg("")},3000);return}

    // ─── BRANCHE JSON : génération à la volée d'une fiche imprimable par élève ───
    if(hasJsonExos){
      var fiches=[];
      var notFoundJ=[];
      selectedNames.forEach(function(name){
        var fiche = ficheJsonHtmlPourEleve(name);
        if(fiche)fiches.push(fiche);
        else notFoundJ.push(name);
      });
      if(fiches.length===0){
        setImpMsg("\u274c Aucun exercice trouv\u00e9 pour les \u00e9l\u00e8ves coch\u00e9s : "+notFoundJ.join(", ")+". Ils n\u2019ont peut-\u00eatre pas d\u2019exercices personnels (moins de 3 erreurs ?).");
        return;
      }
      if(notFoundJ.length>0){
        setImpMsg("\u274c Aucune fiche pour : "+notFoundJ.join(", ")+" (pas d\u2019exercices personnels). Aucune impression.");
        return;
      }
      var bodyJ = fiches.join("\n");
      var printHtmlJ = '<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>Exercices \u00e0 imprimer</title>'+styleImpressionJson()+'</head><body>'+bodyJ+'</body></html>';
      // Affiche dans une overlay (pas de window.open qui peut être bloqué)
      setImpPrintHtml(printHtmlJ);
      setImpMsg("\u2705 "+fiches.length+" fiche(s) pr\u00eate(s). Clique sur \ud83d\udda8 Imprimer en haut.");
      setTimeout(function(){setImpMsg("")},6000);
      return;
    }

    // ─── BRANCHE HTML : détection de sections dans le HTML uploadé ───
    // Parse le HTML d'exercices dans un DOM temporaire
    var parser=new DOMParser();
    var doc=parser.parseFromString(exHtml.content,"text/html");
    // Pour chaque élève sélectionné, trouve sa section
    var sections=[];
    var notFound=[];
    selectedNames.forEach(function(name){
      var key=san(name);
      var sec=trouverSectionEleve(doc,name,key);
      if(sec)sections.push({name:name,html:sec.outerHTML});
      else notFound.push(name);
    });
    // Récupérer head (CSS + meta) pour conserver la mise en forme
    var head=doc.head?doc.head.innerHTML:"";
    var bodyClasses=doc.body?doc.body.className:"";
    // Refus net si aucune section n'est identifiable : pas de fallback caché
    if(sections.length===0){
      setImpMsg("\u274c Aucune section \u00e9l\u00e8ve d\u00e9tect\u00e9e dans le HTML. V\u00e9rifie qu\u2019il contient des marqueurs reconnaissables (ex. data-eleve=\"NOM Pr\u00e9nom\", id=\"eleve-NOM_Prenom\", ou un titre h1\u2013h4 contenant le nom).");
      return;
    }
    // Si certains élèves cochés n'ont pas de section trouvée, on refuse aussi : pas d'impression partielle silencieuse
    if(notFound.length>0){
      setImpMsg("\u274c Section non trouv\u00e9e pour : "+notFound.join(", ")+". Aucune impression. V\u00e9rifie les marqueurs dans le HTML.");
      return;
    }
    // OK : tous les élèves cochés ont une section identifiée
    var body=sections.map(function(s,i){
      return '<div class="mjpc-print-section" style="page-break-after:always;'+(i===sections.length-1?'page-break-after:auto;':'')+'">'+s.html+'</div>';
    }).join("\n");
    var printHtml='<!DOCTYPE html><html lang="fr"><head>'+head+'<style>@media print{.mjpc-print-section{page-break-after:always}.mjpc-print-section:last-child{page-break-after:auto}}</style></head><body class="'+bodyClasses+'">'+body+'</body></html>';
    // Affiche dans une overlay (pas de window.open qui peut être bloqué)
    setImpPrintHtml(printHtml);
    setImpMsg("\u2705 "+sections.length+" fiche(s) pr\u00eate(s). Clique sur \ud83d\udda8 Imprimer en haut.");
    setTimeout(function(){setImpMsg("")},6000);
  }

  function injecter(){

    /* M-PROMPT-1 : les motifs de refus S'ACCUMULENT et CITENT l'exercice fautif */

    if(!V.ok()){ setErrMsg("Je ne peux pas utiliser cette r\u00e9ponse :\n\u2022 "+V.motifs().join("\n\u2022 ")); return; }

  /* L'écriture n'a lieu qu'APRÈS confirmation de l'aperçu. */
  function injecterConfirme(parsed){
    setApercu(null);
    var ancien = exercices || null;   /* rien à remplacer → pas d'archive de rien */
    /* M-PROMPT-1 : ces contrôles vivent désormais dans cdValiderExercices (§12),
       où ils s'accumulent au lieu de s'arrêter au premier. */
    // Validation des types d'items
    function validateItems(items, ctx){
      if(!Array.isArray(items))return ctx+" : items doit \u00eatre un tableau";
      for(var i=0;i<items.length;i++){
        var it = items[i];
        if(!it||!it.type)return ctx+" item "+i+" : type manquant";
        if(it.type==="qcm"){
          if(!Array.isArray(it.propositions)||it.propositions.length<2)return ctx+" item "+i+" : propositions manquantes";
          if(typeof it.reponse!=="number")return ctx+" item "+i+" : reponse (index) manquant";
        } else if(it.type==="trous"){
          if(!Array.isArray(it.segments))return ctx+" item "+i+" : segments manquants";
          if(!Array.isArray(it.reponses))return ctx+" item "+i+" : reponses manquantes";
          var nullCount = it.segments.filter(function(s){return s===null}).length;
          if(nullCount!==it.reponses.length)return ctx+" item "+i+" : "+nullCount+" trous mais "+it.reponses.length+" r\u00e9ponses";
        } else if(it.type==="reecriture"){
          if(!it.reponse_exacte)return ctx+" item "+i+" : reponse_exacte manquante";
        } else {
          return ctx+" item "+i+" : type inconnu '"+it.type+"' (attendu qcm/trous/reecriture)";
        }
      }
      return null;
    }
    for(var i=0;i<parsed.exercices_classe.length;i++){
      var ex = parsed.exercices_classe[i];
      var err = validateItems(ex.items, "Exercice classe '"+(ex.titre||ex.id||i)+"'");
      if(err){setErrMsg(err);return}
    }
    var pk = Object.keys(parsed.exercices_personnels);
    for(var j=0;j<pk.length;j++){
      var exs = parsed.exercices_personnels[pk[j]];
      if(!Array.isArray(exs))continue;
      for(var k=0;k<exs.length;k++){
        var err2 = validateItems(exs[k].items, "Exercice perso '"+pk[j]+"' #"+k);
        if(err2){setErrMsg(err2);return}
      }
    }
    /* M-PROMPT-1 : l'archive part AVANT — mais seulement s'il y a quelque chose à
       perdre. ABANDON si elle échoue : jamais d'écrasement sec. */
    function ecrire(){
      db.ref("correction_dictee/"+p.dicteeId+"/exercices").set(parsed).then(function(){
        setMsg("\u2705 Exercices inject\u00e9s"+(ancien?" \u2014 la version pr\u00e9c\u00e9dente est \u00e0 la corbeille.":"."));
        setJsonInput("");setShowInject(false);
        setTimeout(function(){setMsg("")},4000);
      }).catch(function(e){setErrMsg("L\u2019enregistrement n\u2019a pas abouti : "+e.message+". Rien n\u2019a \u00e9t\u00e9 perdu.")});
    }
    if(!ancien){ ecrire(); return; }
    var ts=Date.now();
    var chemin="correction_dictee/"+p.dicteeId+"/exercices";
    var payload={_meta:{motif:"dictee-exercices",chemin:chemin,app:"correction_dictee",ts:ts},data:ancien};
    db.ref("corbeille/"+new Date(ts).toISOString().slice(0,10)+"/dictee-exercices_"+ts).set(payload).then(function(){
      ecrire();
    }).catch(function(e){
      setErrMsg("La mise \u00e0 la corbeille a \u00e9chou\u00e9 \u2014 rien n\u2019a \u00e9t\u00e9 remplac\u00e9. R\u00e9essaie quand la connexion est stable.");
    });
  }

// ─── COMPOSANT ÉLÈVE : RÉALISATION DES EXERCICES ─────────────────────
function ExercicesEleve(p){
  var sExo = useState(null), exercices = sExo[0], setExercices = sExo[1];
  var sHtml = useState(null), exHtml = sHtml[0], setExHtml = sHtml[1];
  var sLoad = useState(true), loading = sLoad[0], setLoading = sLoad[1];
  var sLoadH = useState(true), loadingH = sLoadH[0], setLoadingH = sLoadH[1];
  var sCur = useState({type:null,idx:0,itemIdx:0}), cur = sCur[0], setCur = sCur[1];
  var sAnsw = useState({}), answers = sAnsw[0], setAnswers = sAnsw[1];
  var sRes = useState({}), results = sRes[0], setResults = sRes[1];
  var sValid = useState(null), validated = sValid[0], setValidated = sValid[1];

  React.useEffect(function(){
    var ref = db.ref("correction_dictee/"+p.dicteeId+"/exercices");
    ref.on("value", function(snap){setExercices(snap.val()||null);setLoading(false)});
    var refH = db.ref("correction_dictee/"+p.dicteeId+"/exercices_html");
    refH.on("value", function(snap){setExHtml(snap.val()||null);setLoadingH(false)});
    // Charger les résultats existants pour cet élève
    var refR = db.ref("correction_dictee/"+p.dicteeId+"/exercices_results/"+san(p.eleve));
    refR.once("value").then(function(snap){
      var v = snap.val();
      if(v){
        setResults(v);
        if(v.answers)setAnswers(v.answers);
      }
    });
    return function(){ref.off();refH.off()};
  }, [p.dicteeId, p.eleve]);

  function saveResult(updated){
    db.ref("correction_dictee/"+p.dicteeId+"/exercices_results/"+san(p.eleve)).set(updated);
  }

  if(loading||loadingH)return h("div",{className:"card"},"Chargement\u2026");

  // Cas 1 : HTML monolithique uploadé → on le sert dans un iframe plein écran
  if(exHtml&&exHtml.content){
    return h("div",{style:{display:"flex",flexDirection:"column",height:"calc(100vh - 40px)"}},
      h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,padding:"10px 14px",background:"var(--card)",borderRadius:8,marginBottom:8,flexWrap:"wrap"}},
        h("div",null,
          h("strong",{style:{fontSize:"1rem"}},"\ud83c\udfaf Tes exercices personnalis\u00e9s"),
          h("div",{style:{fontSize:".78rem",color:"var(--muted)"}},"Fais-les sur ton cahier d\u2019abord pour r\u00e9fl\u00e9chir, puis viens taper tes r\u00e9ponses (si l\u2019exercice est interactif).")
        ),
        p.onBack&&h("button",{className:"btn-sm btn-ghost",onClick:p.onBack},"\u2190 Retour \u00e0 la correction")
      ),
      h("iframe",{srcDoc:exHtml.content,style:{flex:1,width:"100%",border:"1px solid var(--border)",borderRadius:8,background:"#fff",minHeight:500},sandbox:"allow-same-origin allow-scripts allow-forms"})
    );
  }

  // Cas 2 : JSON interactif injecté (système ExercicesEleve normal)
  if(!exercices){
    return h("div",{className:"card",style:{textAlign:"center",padding:30}},
      h("div",{style:{fontSize:"2rem",marginBottom:8}},"\ud83d\udcd6"),
      h("p",null,"Aucun exercice n'a encore \u00e9t\u00e9 mis en place pour cette dict\u00e9e."),
      p.onBack&&h("button",{className:"btn btn-ghost",onClick:p.onBack,style:{marginTop:10}},"\u2190 Retour")
    );
  }

  var bundle = exGetForEleve(exercices, p.eleve);
  var totalExos = bundle.classe.length + bundle.personnels.length;
  if(totalExos===0){
    return h("div",{className:"card",style:{textAlign:"center",padding:30}},
      h("div",{style:{fontSize:"2rem",marginBottom:8}},"\u2728"),
      h("p",null,"Aucun exercice ne t'a \u00e9t\u00e9 attribu\u00e9."),
      p.onBack&&h("button",{className:"btn btn-ghost",onClick:p.onBack,style:{marginTop:10}},"\u2190 Retour")
    );
  }

  // Liste d'exos
  if(!cur.type){
    function exStatus(typeKey, idx){
      var r = (results[typeKey]||{})[idx];
      if(!r||!r.items)return null;
      var ok = r.items.filter(function(x){return x===true}).length;
      var tot = r.items.length;
      return {ok:ok, tot:tot, done:r.completed===true};
    }
    // Calcul global : tous les exos sont-ils terminés ?
    var allExos = bundle.personnels.concat(bundle.classe);
    var allDone = allExos.length > 0 && allExos.every(function(ex, gIdx){
      var type = gIdx < bundle.personnels.length ? "personnels" : "classe";
      var idx = gIdx < bundle.personnels.length ? gIdx : gIdx - bundle.personnels.length;
      var st = exStatus(type, idx);
      return st && st.done;
    });
    // Score global (uniquement sur qcm/trous/reecriture, donc auto-corrigeables)
    var totalOk = 0, totalAuto = 0, totalSaisi = 0;
    ["personnels","classe"].forEach(function(typeKey){
      var pool = typeKey === "personnels" ? bundle.personnels : bundle.classe;
      pool.forEach(function(ex, idx){
        var items = toArr(ex.items||[]);
        var r = (results[typeKey]||{})[idx];
        if(!r || !r.items) return;
        items.forEach(function(it, i){
          var typeIt = it && it.type;
          if(typeIt === "ecriture" || typeIt === "copie"){
            if(r.items[i] === true || r.items[i] === false) totalSaisi++;
          } else if(typeIt === "qcm" || typeIt === "trous" || typeIt === "reecriture"){
            totalAuto++;
            if(r.items[i] === true) totalOk++;
          }
        });
      });
    });
    // ─── TODO ressenti élève ───────────────────────────────────────────────────────
    // À implémenter dans une future itération : zone d'écriture libre en bas de la
    // liste d'exercices, pour que l'élève écrive son ressenti scolaire sur la dictée
    // (s'est-il bien préparé ? quelles erreurs aurait-il pu éviter ? que ne refera-t-il
    // pas ? ce qu'il a compris ?). Stocker dans Firebase à :
    //   correction_dictee/{dicteeId}/exercices_results/{eleveKey}/ressenti
    //   (champ texte libre, mis à jour à chaque modification, visible côté prof
    //   dans la modale détail élève de l'onglet Suivi)
    // Idéalement avec autosave silencieux (debounce 1s).
    // ─────────────────────────────────────────────────────────────────────────────────
    return h("div",{className:"fade-up"},
      // ─── ÉCRAN DE FIN : visible uniquement quand tous les exos sont done ───
      allDone && h("div",{className:"card",style:{textAlign:"center",border:"2px solid var(--green)",background:"rgba(72,160,87,.06)"}},
        h("div",{style:{fontSize:"2.4rem",marginBottom:8}},"\ud83c\udf89"),
        h("h2",{style:{margin:"0 0 6px",color:"#1b6a30"}},"Bravo, tu as termin\u00e9 tous tes exercices !"),
        totalAuto > 0 && h("p",{style:{fontSize:"1.05rem",margin:"8px 0",fontWeight:600}},"Score auto-corrig\u00e9 : "+totalOk+" / "+totalAuto+" bonnes r\u00e9ponses"),
        totalSaisi > 0 && h("p",{style:{fontSize:".88rem",color:"var(--muted)",margin:"4px 0",fontStyle:"italic"}},totalSaisi+" exercice"+(totalSaisi>1?"s":"")+" de production (\u00e9criture / copie) enregistr\u00e9"+(totalSaisi>1?"s":"")+", que je corrigerai."),
        p.onBack && h("button",{className:"btn btn-primary",style:{marginTop:14},onClick:p.onBack},"\u2190 Quitter")
      ),
      h("div",{className:"card",style:{textAlign:"center"}},
        h("h2",{style:{margin:"0 0 6px"}},"\ud83c\udfaf Tes exercices"),
        h("p",{style:{color:"var(--muted)",margin:0,fontSize:".9rem"}},"Tu dois d'abord les faire sur ton cahier, puis venir taper tes r\u00e9ponses ici pour corriger.")
      ),
      bundle.personnels.length>0&&h("div",{className:"card"},
        h("h3",{style:{marginTop:0}},"\ud83d\udc64 Exercices pour toi"),
        bundle.personnels.map(function(ex,i){
          var st = exStatus("personnels",i);
          return h("button",{key:i,onClick:function(){setCur({type:"personnels",idx:i,itemIdx:0});setValidated(null)},
            style:{display:"block",width:"100%",textAlign:"left",padding:"12px 14px",margin:"6px 0",border:"1.5px solid "+(st&&st.done?"var(--green)":"var(--border)"),borderRadius:10,background:st&&st.done?"rgba(72,160,87,.08)":"var(--card)",cursor:"pointer",fontFamily:"inherit"}},
            h("div",{style:{fontWeight:700}},(st&&st.done?"\u2705 ":"")+(ex.titre||"Exercice "+(i+1))),
            h("div",{style:{fontSize:".82rem",color:"var(--muted)",marginTop:4}},
              toArr(ex.items).length+" item"+(toArr(ex.items).length>1?"s":"")+
              (st?" \u00b7 "+st.ok+"/"+st.tot+" r\u00e9ussi"+(st.ok>1?"s":""):"")
            )
          );
        })
      ),
      bundle.classe.length>0&&h("div",{className:"card"},
        h("h3",{style:{marginTop:0}},"\ud83d\udc65 Exercices pour la classe"),
        bundle.classe.map(function(ex,i){
          var st = exStatus("classe",i);
          return h("button",{key:i,onClick:function(){setCur({type:"classe",idx:i,itemIdx:0});setValidated(null)},
            style:{display:"block",width:"100%",textAlign:"left",padding:"12px 14px",margin:"6px 0",border:"1.5px solid "+(st&&st.done?"var(--green)":"var(--border)"),borderRadius:10,background:st&&st.done?"rgba(72,160,87,.08)":"var(--card)",cursor:"pointer",fontFamily:"inherit"}},
            h("div",{style:{fontWeight:700}},(st&&st.done?"\u2705 ":"")+(ex.titre||"Exercice "+(i+1))),
            h("div",{style:{fontSize:".82rem",color:"var(--muted)",marginTop:4}},toArr(ex.items).length+" item"+(toArr(ex.items).length>1?"s":"")+(st?" \u00b7 "+st.ok+"/"+st.tot+" r\u00e9ussi"+(st.ok>1?"s":""):""))
          );
        })
      ),
      p.onBack&&h("div",{style:{textAlign:"center",marginTop:14}},
        h("button",{className:"btn btn-ghost",onClick:p.onBack},"\u2190 Retour")
      )
    );
  }

  // Vue d'un exercice
  var pool = cur.type==="classe"?bundle.classe:bundle.personnels;
  var ex = pool[cur.idx];
  if(!ex)return h("div",null,"Exercice introuvable");
  var items = toArr(ex.items||[]);
  var item = items[cur.itemIdx];
  var ansKey = cur.type+"_"+cur.idx+"_"+cur.itemIdx;
  var userAns = answers[ansKey];

  function setAnswer(v){
    var na = Object.assign({},answers);
    na[ansKey] = v;
    setAnswers(na);
  }

  function validateItem(){
    var check = exCheckItem(item, userAns);
    setValidated(check);
    // Persist : on enregistre item par item
    var nr = JSON.parse(JSON.stringify(results||{}));
    if(!nr[cur.type])nr[cur.type]={};
    if(!nr[cur.type][cur.idx])nr[cur.type][cur.idx]={items:[],completed:false};
    // Aligne le tableau d'items
    while(nr[cur.type][cur.idx].items.length<items.length)nr[cur.type][cur.idx].items.push(null);
    nr[cur.type][cur.idx].items[cur.itemIdx] = check.ok;
    // Tracking essais : nb tentatives par item (non rétroactif, démarre avec ce code)
    nr[cur.type][cur.idx].attempts = nr[cur.type][cur.idx].attempts || [];
    while(nr[cur.type][cur.idx].attempts.length<items.length)nr[cur.type][cur.idx].attempts.push(0);
    nr[cur.type][cur.idx].attempts[cur.itemIdx] = (nr[cur.type][cur.idx].attempts[cur.itemIdx] || 0) + 1;
    // Marquer complete si tous les items validés
    if(nr[cur.type][cur.idx].items.every(function(x){return x===true||x===false})){
      nr[cur.type][cur.idx].completed = true;
    }
    nr.answers = Object.assign({}, answers);
    nr.answers[ansKey] = userAns;
    nr.lastUpdate = Date.now();
    setResults(nr);
    saveResult(nr);
  }

  function nextItem(){
    setValidated(null);
    if(cur.itemIdx<items.length-1){
      setCur(Object.assign({},cur,{itemIdx:cur.itemIdx+1}));
    } else {
      // Fin de l'exercice : retour à la liste
      setCur({type:null,idx:0,itemIdx:0});
    }
  }

  function prevItem(){
    setValidated(null);
    if(cur.itemIdx>0)setCur(Object.assign({},cur,{itemIdx:cur.itemIdx-1}));
  }

  function backToList(){
    setCur({type:null,idx:0,itemIdx:0});
    setValidated(null);
  }

  // Rendu d'un item selon son type
  function renderItem(){
    if(item.type==="qcm"){

            !isOublie&&ev.fautif&&h("span",{style:{position:"absolute",left:"50%",transform:"translateX(-50%)",top:"calc(100% + 12px)",fontSize:".6rem",color:"#999",textDecoration:"line-through",whiteSpace:"nowrap"}},ev.fautif),
            sp
          ));
          return acc;
        },[]).concat(
          extraMapEleve[tokens.length-1]?extraMapEleve[tokens.length-1].map(function(ex){
            return h("span",{key:"rexend"+ex.gi,style:{textDecoration:"line-through",textDecorationThickness:"2px",color:typeCouleur("X"),fontWeight:600,padding:"2px 4px",margin:"0 2px"},title:"Mot en trop dans ta copie \u2014 \u22120,5 pt"},ex.word)
          }):[]
        )
      )
    ),
    // Commentaires grammaticaux
    h("div",{className:"card"},
      h("div",{style:{fontSize:".78rem",color:"var(--muted)",marginBottom:10,fontWeight:600,textTransform:"uppercase"}},"Analyse de tes erreurs"),
      errors.map(function(err,i){
        var typeColor=typeTexte(err.type);
        var typeBg=typeRgba(err.type,.1);
        var typeLabel=typeLibelle(err.type);
        return h("div",{key:"gc"+i,style:{padding:"10px 0",borderBottom:i<errors.length-1?"1px solid var(--border)":"none"}},
          h("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:4}},
            h("span",{style:{width:24,height:24,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:".78rem",fontWeight:700,flexShrink:0,
              background:typeBg,color:typeColor}},i+1),
            h("span",{style:{fontWeight:700,fontSize:".95rem"}},"\u00ab "+err.word+" \u00bb"),
            h("span",{style:{fontSize:".8rem",padding:"2px 8px",borderRadius:6,fontWeight:600,
              background:typeBg,color:typeColor}},typeLabel)
          ),
          h("p",{style:{fontSize:".88rem",color:"#555",lineHeight:1.6,marginLeft:32}},gramComment(err))
        )
      }),
      extras.length>0&&extras.map(function(ex,i){
        return h("div",{key:"gex"+i,style:{padding:"10px 0",borderBottom:i<extras.length-1?"1px solid var(--border)":"none",borderTop:i===0?"1px solid var(--border)":"none",marginTop:i===0?6:0}},
          h("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:4}},
            h("span",{style:{width:24,height:24,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:".78rem",fontWeight:700,flexShrink:0,
              background:typeRgba("X",.1),color:typeCouleur("X")}},"+"),
            h("span",{style:{fontWeight:700,fontSize:".95rem",textDecoration:"line-through",color:typeCouleur("X")}},"\u00ab "+ex.word+" \u00bb"),
            h("span",{style:{fontSize:".8rem",padding:"2px 8px",borderRadius:6,fontWeight:600,background:typeRgba("X",.08),color:typeCouleur("X")}},"Mot en trop")
          ),
          h("p",{style:{fontSize:".88rem",color:"#555",lineHeight:1.6,marginLeft:32}},"Ce mot \u00e9tait dans ta copie mais ne devait pas y \u00eatre. \u00c9coute bien le rythme de la dict\u00e9e et n\u2019ajoute pas de mots que tu crois deviner.")
        );
      })
    ),
    ),
    // Boutons
    h("div",{style:{display:"flex",gap:8,marginTop:12,justifyContent:"center",paddingBottom:30,flexWrap:"wrap"}},
      h("button",{className:"btn btn-ghost",onClick:p.onBack},"\u2190 Retour"),
      p.onExercices&&liveConfig.exercicesOuverts&&aDesExos&&!dansHeureLancee(sessionDebut,heure)&&h("button",{className:"btn btn-primary",onClick:p.onExercices,title:"Passe \u00e0 tes exercices personnalis\u00e9s"},"\ud83c\udfaf Mes exercices"),
      estClasseTest(d.dictee&&d.dictee.classe)&&h("button",{className:"btn-sm btn-ghost",style:{color:"var(--coral)",borderColor:"rgba(197,48,48,.2)"},onClick:function(){
        if(confirm("Recommencer la correction ? Ta progression sera effac\u00e9e.")){
          db.ref("correction_dictee/"+d.dictee.id+"/autocorrection/"+d.key).remove();
          setAttempts({});setResults({});setHistory({});setFinished(false);
        }
      }},"\u21bb Recommencer")
    )
  );

// Lot 1 : la question qui bloquait l'élève à 0 point (réponse jamais vérifiée,
  // aucun point rendu) est retirée — décision de Paul. Sa banque sert au lot 2.

  return h("div",{className:"container fade-up",ref:racineRef,style:(p.moitie&&activeErr!==null)?{paddingBottom:420}:undefined},
    bandeauHC,   /* [L13] */
    // Idle warning
    // Bandeau rouge « Reprends le travail » retiré (demande de Paul, 29/09) : votre suivi garde l'état « inactif ».
    // Header sticky
    h("div",{className:"score-bar",style:{flexWrap:"wrap"}},
      legendeTypes(),
      h("div",{className:"score-val",style:{color:noteColor(score,5)}},acNoteTexte(score)),
      h("div",{style:{flex:1}},
        h("div",{className:"score-eleve"},d.eleve),
        h("div",{className:"score-info"},
          "/5 \u00b7 ",nSolved+"/"+totalErrors+" corrig\u00e9"+(nSolved>1?"s":""),
          " \u00b7 ",wrongAttempts+" essai"+(wrongAttempts>1?"s":"")+" rat\u00e9"+(wrongAttempts>1?"s":"")
        ),
        h("div",{className:"progress-wrap"},h("div",{className:"progress-fill",style:{width:(totalErrors?Math.round(nSolved/totalErrors*100):0)+"%"}}))
      ),
      h("div",{style:{display:"flex",flexDirection:"column",gap:4}},
        h("button",{className:"btn-sm btn-ghost",style:{fontSize:".8rem",padding:"4px 10px"},onClick:p.onBack},"\u2190"),
        h("button",{className:"btn-sm btn-ghost",style:{fontSize:".7rem",padding:"3px 8px",color:"var(--primary)"},onClick:function(){window.location.reload()}},"\ud83d\udd04",ifo("Recharge la page. Clique ici quand je te le demande.",{below:true,right:true}))
      )
    ),
    p.voisinAide?h("div",{className:"card",style:{background:"#fffbea",borderColor:"#f6d365",fontSize:".95rem",lineHeight:1.5,marginBottom:12}},
      d.eleve.split(" ").pop()+", c\u2019est toi qui tapes et qui r\u00e9fl\u00e9chis. "+p.voisinAide.prenom+", explique-lui d\u2019abord comment tu r\u00e9fl\u00e9chis sur ce mot, puis aidez-vous \u00e0 trouver la bonne r\u00e9ponse. Ne tape pas \u00e0 sa place : chaque essai rat\u00e9 fait perdre des points \u00e0 "+d.eleve.split(" ").pop()+"."):null,
    alerteHeure(),encartRegain(),
    // Text with masked words
    h("div",{className:"card"},
      h("p",{style:{fontSize:".82rem",color:"var(--muted)",marginBottom:8}},"Clique sur un mot masqu\u00e9 pour le corriger. Note de d\u00e9part : 5 pts. Chaque essai rat\u00e9 co\u00fbte "+acNoteTexte(totalErrors>0?5/totalErrors:0)+" pt ; le premier est offert."),
      (function(){
        var nA=errors.filter(function(e){return e&&e.type==="A"}).length;
        if(extras.length===0&&nA===0)return null;
        return h("div",{style:{marginBottom:10,padding:"10px 14px",background:typeRgba("X",.04),border:"1.5px solid "+typeRgba("X",.18),borderRadius:8,fontSize:".85rem",lineHeight:1.6}},
          extras.length>0&&h("div",{style:{color:typeCouleur("X"),fontWeight:600}},
            "\ud83d\udccc "+extras.length+" mot"+(extras.length>1?"s":"")+" en trop dans ta copie : "+(extras.length>1?"ils sont barr\u00e9s":"il est barr\u00e9")+" dans le texte \u2014 \u22120,5 pt"+(extras.length>1?" chacun":"")
          ),
          nA>0&&h("div",{style:{color:typeTexte("A"),fontWeight:600,marginTop:extras.length>0?6:0}},
            "\u26a0 "+nA+" mot"+(nA>1?"s":"")+" o\u00f9 j\u2019ai sign\u00e9 ta graphie (surlign\u00e9"+(nA>1?"s":"")+" en jaune) \u2014 aucun point retir\u00e9, mais soigne le trac\u00e9"
          )
        );
      })(),
      h("div",{className:"word-grid"},
        tokens.reduce(function(acc,w,i){
          // Insert extras before this token
          if(extraMapEleve[i-1])extraMapEleve[i-1].forEach(function(ex){
            acc.push(h("span",{key:"ex"+i+"_"+ex.gi,style:{textDecoration:"line-through",textDecorationThickness:"2px",color:typeCouleur("X"),fontWeight:600,padding:"2px 4px"}},ex.word))
          });
          var err=errMap[i];
          if(!err){
            var isP=isPunct(w);
            acc.push(h("span",{key:"w"+i,className:"word-btn"+(isP?" punct":""),style:{cursor:"default"}},w));
            return acc;
          }
          // Type A : signalement de graphie, affiché en clair, non cliquable, ne compte pas dans la note
          if(err.type==="A"){
            acc.push(h("span",{key:"w"+i,className:"word-btn err-a",style:{cursor:"default"},title:"J\u2019ai sign\u00e9 ta graphie ici. Aucun point retir\u00e9."},w,h("sub",{style:{fontSize:8,marginLeft:2}},"\u26a0")));
            return acc;
          }
          var solved=results[err.errIdx];
          var isActive=activeErr===err.errIdx;
          if(solved){
            acc.push(h("span",{key:"w"+i,className:"word-btn",style:{color:"var(--green)",fontWeight:700,borderBottom:"2px solid var(--green)"}},err.word," \u2713"));
            return acc;
          }
          // Masked word — clickable
          var typeCls="err-"+String(err.type||"I").toLowerCase();
          var blanks="";for(var j=0;j<w.length;j++)blanks+="\u2022";
          if(err.type==="M")blanks="____";
          if(err.type==="P")blanks="\u2022";
          acc.push(h("span",{key:"w"+i,className:"word-btn "+typeCls+(isActive?" last-touched":""),
            "data-err":err.errIdx,
            style:{cursor:"pointer",borderWidth:2,borderStyle:"solid",borderColor:typeCouleur(err.type)},
            onClick:function(){recordAction();setActiveErr(err.errIdx);setInputVal("");setFeedback(null)}},
            // Lot 1 : la bordure reste nette (couleur exacte de la légende) ; seules les lettres sont floutées.
            h("span",{style:{filter:isActive?"none":"blur(3px)",transition:"filter 0.2s"}},blanks,h("sub",{style:{fontSize:8,marginLeft:2}},err.type))
          ));
          return acc;
        },[]).concat(
          extraMapEleve[tokens.length-1]?extraMapEleve[tokens.length-1].map(function(ex){
            return h("span",{key:"exend"+ex.gi,style:{textDecoration:"line-through",textDecorationThickness:"2px",color:typeCouleur("X"),fontWeight:600,padding:"2px 4px"}},ex.word)
          }):[]
        )
      )
    ),
    // Active error input — lot 3b : en moitié de tablette, feuille en bas avec le clavier dessiné
    activeErr!==null&&p.moitie&&feuilleClavier(),
    activeErr!==null&&!p.moitie&&h("div",{className:"popup-overlay",style:{alignItems:"flex-start",paddingTop:"25vh"},onClick:function(){setActiveErr(null);setInputVal("");setFeedback(null)}},
      h("div",{style:{background:"var(--card)",borderRadius:16,padding:"18px 20px",maxWidth:360,width:"100%",boxShadow:"0 12px 40px rgba(0,0,0,.2)",position:"relative"},onClick:function(e){e.stopPropagation()}},
        h("div",{style:{display:"flex",alignItems:"center",gap:10,marginBottom:10}},
          h("span",{className:"badge badge-"+String(errors[activeErr].type||"I").toLowerCase(),style:{fontSize:".85rem",padding:"3px 10px"}},errors[activeErr].type),
          h("span",{style:{fontWeight:600,fontSize:".95rem"}},"Erreur n\u00b0"+(activeErr+1)),
          errors[activeErr].sansCout?h("span",{className:"forme-acc",style:{fontSize:".78rem",padding:"2px 8px",borderRadius:6,background:"#e6f4ec",color:"#1e6042",fontWeight:600}},"forme accept\u00e9e"):null,   /* [L11] la carte de l'erreur, sur ordinateur */
          (attempts[activeErr]||0)>0&&h("span",{style:{fontSize:".78rem",color:"var(--muted)",marginLeft:"auto"}},(attempts[activeErr]||0)+" essai"+(((attempts[activeErr]||0)>1)?"s":""))
        ),
        h("div",{style:{display:"flex",gap:8}},
          h("input",{ref:inputRef,value:inputVal,onChange:function(e){recordAction();setInputVal(e.target.value)},
            placeholder:"Tape le mot correct\u2026",
            style:{flex:1,padding:"10px 12px",fontSize:"1rem",borderColor:feedback?feedback.correct?"var(--green)":"var(--coral)":"var(--border)",background:feedback?feedback.correct?"var(--green-light)":"var(--coral-light)":"var(--card)",borderRadius:10},
            onKeyDown:function(e){if(e.key==="Enter")tryAnswer()}}),
          h("button",{className:"btn-sm btn-primary",style:{padding:"10px 16px"},onClick:tryAnswer},"\u2713")
        ),
        feedback&&h("div",{style:{marginTop:8,fontSize:".88rem",fontWeight:600,color:feedback.correct?"var(--green)":"var(--coral)",textAlign:"center"}},
          feedback.correct?"\u2713 Correct ! \u00ab "+feedback.answer+" \u00bb":"\u2717 R\u00e9essaie !"
        )
      )
    )
  );
}
</script>
