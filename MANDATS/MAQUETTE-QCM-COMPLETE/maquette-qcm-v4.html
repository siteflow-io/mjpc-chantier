var PROMPT_TEXTE = "Tu vas m'aider à écrire une évaluation QCM pour ma classe. Elle se passe dans mon application, en classe, deux élèves par tablette. Voici comment elle se déroule, puis les règles à respecter strictement.\n\nLE CHAPITRE\n{{CHAPITRE}}\nSes compétences, les seules que tu peux utiliser :\n{{COMPETENCES_CHAPITRE}}\n\nCOMMENT SE PASSE UNE QUESTION EN CLASSE\n1. Réflexion : l'élève voit l'énoncé seul, sans les choix, et écrit sa réponse en entier, à la main, sur sa feuille.\n2. Réponse : les choix apparaissent ; chacun son tour, l'élève pose son stylo, relit sa feuille et clique sur le ou les choix qui disent la même chose que ce qu'il a écrit. C'est sa feuille qui fait foi pour la note.\n3. Correction, après toutes les questions : l'élève recopie sur la tablette ce que dit sa feuille, puis je révèle la réponse et je commente.\nLa tablette ajoute toujours d'elle-même la case « Ma feuille ne dit aucun de ces choix ».\n\nLES DURÉES\n{{DUREES}}\nLa séance tient en 45 minutes utiles, questions et correction comprises.\n\nCE QUE TU FAIS, DANS CET ORDRE\n1. Pose-moi d'abord ces questions, numérotées, et attends mes réponses :\n   1. Donne-moi le cours sur lequel porte l'évaluation (la leçon, les fiches, les séances) : les bonnes réponses en reprendront les mots exacts.\n   2. Combien de questions ?\n   3. Combien à réponses multiples ?\n   4. Quel équilibre de difficultés (facile, standard, approfondi, expert) ?\n   5. Tout ou rien, ou partiel ?\n   6. Veux-tu une question bonus ?\n2. Propose-moi les questions, par petits groupes. Pour chacune : l'énoncé, les choix, la ou les bonnes réponses, la difficulté réelle, la ou les compétences, ce qu'elle vérifie, et la réponse que l'élève doit écrire sur sa feuille, en quelques mots.\n3. Pour les temps, tu ne devines jamais. Pour chaque question, demande-moi le temps de réflexion et le temps de réponse. Appuie-toi sur la vraie difficulté de la question et sur la longueur de la réponse à écrire. Si un temps que je te donne te paraît trop court pour écrire cette réponse, dis-le : « La question 7 ne rentre pas : … ». Si tu ne sais pas, demande-moi.\n4. Quand tous les temps sont donnés, calcule la durée de la séance avec les durées ci-dessus. Écris : « Ça rentre dans 45 minutes (total : … min) » ou « Ça ne rentre pas : il manque … minutes ». Si ça ne rentre pas, propose une solution sans l'appliquer (une question à retirer, des choix à raccourcir, la question bonus comme fusible) et attends mon accord.\n5. Tout au long de la discussion, tiens un cadrage mémorisé : à chaque étape, redonne en quelques lignes ce qui est décidé (questions validées, temps, compétences). Pose toujours tes questions numérotées. Le JSON est le résultat de notre discussion : je ne dois jamais avoir à le reprendre.\n6. Si je te colle un message de mon application qui commence par « Corrige ton JSON », corrige seulement ce qu'il cite et renvoie le JSON complet.\n\nRÈGLES POUR CHAQUE QUESTION\n1. L'énoncé est autonome : l'élève doit pouvoir répondre de mémoire, sans voir les choix. Jamais « Laquelle des propositions suivantes… ».\n2. L'énoncé dit la forme attendue de la réponse, par exemple « (le nom de la figure) » ou « (en un mot) », mais jamais le nombre de bonnes réponses.\n3. On doit pouvoir répondre en quelques mots sur la feuille. Pour une question « Sur ta copie, écris une phrase… », la feuille porte la phrase et, en dessous, la réponse courte : c'est cette réponse courte que l'élève rapproche des choix.\n4. Chaque choix est écrit comme l'élève l'écrirait. La bonne réponse reprend les mots exacts du cours. Les autres choix sont plausibles, mais clairement faux pour qui sait son cours. Les choix sont homogènes en longueur et en construction.\n5. Jamais de choix « aucune de ces réponses » : la tablette l'ajoute d'elle-même.\n6. Il n'y a pas de lettres : ne désigne jamais un choix par une lettre, ni dans l'énoncé, ni dans l'explication. Varie la place de la bonne réponse d'une question à l'autre.\n7. Une question vaut au plus 1 point. En tout ou rien, elle vaut 1 si la réponse est exacte, sinon 0. En partiel, chaque bonne case cochée rapporte une part du point (1 divisé par le nombre de bonnes cases), chaque mauvaise case cochée en retire autant, sans descendre sous 0.\n8. La difficulté dit la vraie difficulté de la question, rien d'autre : elle ne donne ni les points ni le temps.\n9. Une ou deux compétences par question, prises seulement dans la liste du chapitre. Chaque compétence que tu utilises porte sur au moins 3 questions ; si ce n'est pas possible, dis-le-moi.\n10. « Ce qu'elle vérifie » : une courte phrase à l'infinitif, dans les mots d'un élève, qui se lit après « À revoir en priorité : » comme après « Bravo, tu sais » ; par exemple « trouver l'antécédent d'un pronom relatif ». Jamais l'intitulé d'une compétence, jamais de jargon.\n11. L'explication est pour l'élève, à la correction : 1 à 3 phrases claires, qui justifient la bonne réponse ; tu peux dire pourquoi un autre choix est faux.\n12. La longueur : {{LIMITES}} Si une question dépasse et que je te dis que j'assume sa longueur, marque-la \"longueurAssumee\": true.\n13. La question bonus, si je t'en demande une, porte \"bonus\": true : elle compte dans les points gagnés, pas dans le total.\n\nLE FORMAT\n{\n  \"titre\": \"Titre de l'évaluation\",\n  \"chapitre\": \"identifiant du chapitre, celui donné plus haut\",\n  \"mode\": \"strict\",\n  \"questions\": [\n    {\n      \"enonce\": \"Énoncé autonome (forme attendue de la réponse)\",\n      \"choix\": [\"…\", \"…\", \"…\", \"…\"],\n      \"bonnes\": [0],\n      \"niveau\": \"standard\",\n      \"reflexion\": 40,\n      \"reponse\": 15,\n      \"competences\": [\"code de la compétence\"],\n      \"verifie\": \"ce qu'elle vérifie, à l'infinitif\",\n      \"explication\": \"1 à 3 phrases pour l'élève.\",\n      \"bonus\": false,\n      \"longueurAssumee\": false\n    }\n  ]\n}\n\"mode\" vaut \"strict\" (tout ou rien) ou \"partiel\". \"bonnes\" donne la place des bonnes réponses, en comptant à partir de 0. \"reflexion\" et \"reponse\" sont en secondes, ceux que je t'ai donnés. \"niveau\" prend l'une de ces valeurs :\n{{NIVEAUX}}";

gin-bottom:1.5mm;font-size:7.2pt}\ntbody.un{break-inside:avoid}\ntbody.un tr{break-inside:avoid}\ntbody.un tr:first-child{break-after:avoid}\ntr.comrow td{line-height:1.38}\n.ctrl{font-weight:bold;font-size:7.8pt;margin-top:1.2mm}\n.asavoir{border:1px dashed #555;padding:1mm 2.5mm;margin-top:1.4mm;font-size:7.2pt;line-height:1.35}\n.bas{display:grid;grid-template-columns:1.2fr 1fr;gap:6mm;margin-top:1.4mm;font-size:7pt;line-height:1.3}\n.bas b{font-weight:bold}\n<\/style><\/head><body>\n<div class=\"exemple\"><b>Exemple de la maquette.<\/b> Dans les commentaires, souligné en pointillés orange : une phrase proposée, pas encore validée par toi. Le reste vient mot pour mot de la correction de dictée (« dictée » devenu « évaluation ») ou de l'app d'aujourd'hui.<\/div>\n<div class=\"haut\"><h1>Notes et compétences<\/h1><div class=\"classe\">Classe : 3 ESSAI<\/div><\/div>\n<div class=\"infos\">\n<div><b>Évaluation :<\/b> 3e- éval 1 Analyse logique - Construire une phrase complexe<\/div>\n<div><b>Chapitre :<\/b> 3e, chapitre 1 — Poésie et peinture au XIXe siècle<\/div>\n<div><b>Séance :<\/b> 09/10/2026 · 11 questions · tout ou rien<\/div>\n<div><b>Copies :<\/b> rendues le 10/10/2026 — les notes sont définitives<\/div>\n<div><b>Note :<\/b> sur 20, arrondie au dixième<\/div>\n<div><b>Questions :<\/b> aucune écartée, aucune annulée<\/div>\n<\/div>\n<div class=\"mode\"><b>Pour École Directe.<\/b> Une ligne par élève, dans l'ordre alphabétique. « Note » : la note sur 20 du devoir.\nChaque colonne de compétence : le niveau de maîtrise de l'élève, en toutes lettres, parmi quatre : Très bonne maîtrise, Maîtrise satisfaisante, Maîtrise fragile, Maîtrise insuffisante.\n« Commentaire », sur la ligne sous l'élève : son commentaire pour ce devoir, à entrer tel quel dans la zone commentaire ; « — » : pas de commentaire. « Absent » : ni note, ni niveau, ni commentaire.\nLe cadre « À savoir », sous le tableau, ne s'entre pas.<\/div>\n<table>\n<colgroup><col style=\"width:50mm\"><col style=\"width:17mm\"><col style=\"width:58mm\"><col style=\"width:58mm\"><col style=\"width:48mm\"><col style=\"width:48mm\"><\/colgroup>\n<thead>\n<tr class=\"g\"><th rowspan=\"2\" style=\"text-align:left\">Élève<\/th><th rowspan=\"2\" style=\"text-align:center\">Note<br>sur 20<\/th><th colspan=\"2\">Compétences de l'évaluation<\/th><th colspan=\"2\">Point d'autonomie<\/th><\/tr>\n<tr><th><span class=\"c\">c4-langue-04<\/span><span class=\"l\">Q1 à Q11<\/span><\/th><th><span class=\"c\">c4-ecrire-02<\/span><span class=\"l\">Q5 à Q10<\/span><\/th><th><span class=\"c\">tr-personne-03<\/span><span class=\"l\">Être autonome et responsable<\/span><\/th><th><span class=\"c\">tr-methodes-02<\/span><span class=\"l\">S'impliquer dans les activités en classe et dans son travail personnel<\/span><\/th><\/tr>\n<\/thead>\n<tr><td class=\"el\">ABRIAL Julien<\/td><td class=\"note\">10,9<\/td><td class=\"niv bleu\">Maîtrise satisfaisante<span class=\"pts\">6/11<\/span><\/td><td class=\"niv bleu\">Maîtrise satisfaisante<span class=\"pts\">4/6<\/span><\/td><td class=\"niv rouge\">Maîtrise insuffisante<\/td><td class=\"niv rouge\">Maîtrise insuffisante<\/td><\/tr><tr class=\"comrow\"><td colspan=\"6\"><span class=\"lab\">Commentaire :<\/span> Bonne évaluation, avec quelques points isolés à surveiller. À revoir en priorité : <span class=\"prov\">dire ce qui peut être un antécédent<\/span>, <span class=\"prov\">dire que faire du « et » entre deux relatives coordonnées<\/span> et <span class=\"prov\">employer un pronom relatif composé<\/span>. <span class=\"prov\">Bravo, tu sais <\/span><span class=\"prov\">trouver l'antécédent d'un pronom relatif<\/span> et <span class=\"prov\">écrire une phrase DPP + PSR + FPP<\/span>. <span class=\"prov\">Pour cette évaluation, deux compétences ne sont pas atteintes : « Travailler seul et de façon responsable » et « S'investir dans son travail, en classe et à la maison ».<\/span> Enfin, ton estimation de ton nombre de bonnes réponses <span class=\"prov\"> /* La règle de note (288 à 293, 303, 332) */
function calc(p){
  var t = RT[p], f = RF[p], used = false, pts = [], st = [], flags = [];
  for(var q = 0; q < 3; q++){
    var fc = f[q], tc = t[q];
    if(fc === "-"){ pts.push(null); st.push("pasdit"); flags.push({q:q, txt:"pas de recopie"}); continue; }
    if(fc === "J"){ pts.push(1); st.push("j"); if(tc !== "J") flags.push({q:q, txt:"recopie juste, tablette fausse"}); continue; }
    if(fc === "A"){ flags.push({q:q, txt:"aucun de ces choix"}); pts.push(0); st.push("a"); continue; }   // « aucun de ces choix » vaut toujours 0 (477, 490)
    if(tc === "J" && !used){ used = true; pts.push(1); st.push("t"); continue; }
    pts.push(0); st.push(fc === "A" ? "a" : "f");
  }
  var complet = pts.indexOf(null) < 0;
  var n = pts.reduce(function(a, b){ return a + (b || 0); }, 0);
  var comp = {};
  EV.questions.forEach(function(q, qi){ q.competences.forEach(function(c){ comp[c] = comp[c] || {n:0, max:0}; comp[c].max++; comp[c].n += (pts[qi] || 0); }); });
  return {pts:pts, st:st, flags:flags, n:n, complet:complet, sur20:n*20/3, comp:comp};
}

function telPastille(p, qi, mode){
  // mode : "q" (pendant la question), "voile", "rep" (répond), "recopie", "pasrecopie", "corr" (après la révélation)
  if(mode === "voile") return {t:"🙈", cls:"tp-voile"};
  if(mode === "rep") return {t:"⏳", cls:"tp-attente"};
  if(mode === "pasrep") return {t:"⏳", cls:"tp-rouge"};
  if(mode === "recopie") return {t:"✍️", cls:"tp-recopie"};
  if(mode === "pasrecopie") return {t:"⏳", cls:"tp-rouge"};
  if(mode === "corr"){
    var s = calc(p).st[qi];
    return s === "j" ? {t:"✓", cls:"tp-juste"} : s === "t" ? {t:"＋", cls:"tp-trouvee"} : {t:"✗", cls:"tp-faux"};
  }

/* Tour 626 — le commentaire personnalisé de l'élève, sur le modèle de generateBilan de correction_dictee.html (Paul, 10/10 08:37).
   La dictée : une ouverture selon la note, les points à travailler (le domaine dominant), un conseil ciblé.
   Le QCM, même forme : une ouverture selon la maîtrise de la note (les 4 tranches, 339), les compétences à travailler,
   une phrase ciblée (le point d'autonomie, les questions faciles ratées, les questions difficiles réussies), l'estimation.
   Chaque phrase porte p:true quand elle est une proposition (elle n'existe ni dans la dictée ni dans la 7.7.1, mot pour mot). */
function commentaireQCM_626(r){
  var ph = [];
  // 1. L'ouverture : les phrases de la dictée, « dictée » devenu « évaluation » ; ses 5 paliers ramenés aux 4 niveaux de maîtrise
  var ouv = {
    vert:   {t:"Très belle évaluation, qui reflète une maîtrise solide."},
    bleu:   {t:"Bonne évaluation, avec quelques points isolés à surveiller."},
    orange: {t:"Évaluation fragile. Il faut consolider les bases avant la prochaine évaluation."},
    rouge:  {t:"Évaluation difficile. Reprends les notions essentielles point par point.", p:true}   // dictée : « les règles essentielles »
  };
  ph.push(ouv[r.niveau]);
  // 2. Les compétences : « Points à travailler : » (la dictée) pour une compétence en Maîtrise fragile ou insuffisante ; sinon « À consolider : »
  function liste(l){ l = l.map(function(x){ return "« " + x + " »"; }); return l.length < 2 ? l.join("") : l.slice(0, -1).join(", ") + " et " + l[l.length - 1]; }
  var faibles = r.comps.filter(function(c){ return c.niveau === "orange" || c.niveau === "rouge"; }).map(function(c){ return c.lib; });
  var moyennes = r.comps.filter(function(c){ return c.niveau === "bleu"; }).map(function(c){ return c.lib; });
  if(faibles.length) ph.push({t:"Points à travailler : " + liste(faibles) + "."});
  else if(moyennes.length) ph.push({t:"À consolider : " + liste(moyennes) + ".", p:true});
  // 3. Une phrase ciblée, la première qui s'applique
  if(r.autonomieRetiree) ph.push({t:"Les compétences « Être autonome et responsable » et « S'impliquer dans les activités en classe et dans son travail personnel » ne sont pas atteintes pour cette évaluation.", p:true});
  else if(r.facilesRatees >= 2) ph.push({t:"Conseil : commence par revoir les questions que tu as ratées alors qu'elles étaient faciles ou réussies par la plupart de la classe.", p:true});
  else if(r.difficilesReussies >= 2) ph.push({t:"Bravo pour les questions difficiles que tu as réussies.", p:true});
  // 4. L'estimation : les phrases de la 7.7.1 ; « nettement » quand l'écart est de deux niveaux ou plus (615)
  if(r.estimation === "ok") ph.push({t:"Ton estimation correspond à ton vrai résultat : tu te connais bien !"});
  else if(r.estimation === "sur") ph.push(r.ecart >= 2 ? {t:"Tu as nettement surestimé ce que tu avais réussi.", p:true} : {t:"Tu as un peu surestimé ce que tu avais réussi."});
  else if(r.estimation === "sous") ph.push({t:"Tu as fait mieux que ce que tu croyais."});
  return ph;
}

  phrase([ouv[r.niveau]]);
  // 2. À revoir en priorité (le titre du bloc de la 7.7.1) : les questions ratées, d'abord celles qui étaient faciles
  //    ou réussies par la plupart de la classe, puis les plus réussies par la classe ; trois au plus
  var ratees = r.questions.filter(function(q){ return q.pts === 0; }).sort(function(a, b){
    var pa = (a.niveau === "facile" || a.taux >= 50) ? 1 : 0, pb = (b.niveau === "facile" || b.taux >= 50) ? 1 : 0;
    return (pb - pa) || (b.taux - a.taux) || (a.n - b.n); }).slice(0, 3);
  var ameliorer = ratees.length ? liste(ratees.map(function(q){ return q.verifie; })).concat([{t:"."}]) : null;
  if(ameliorer && r.niveau !== "vert") phrase([{t:"À revoir en priorité : "}].concat(ameliorer));
  // 3. Bravo : les questions difficiles réussies (approfondi, expert), les plus rares d'abord ; deux au plus
  var difficiles = r.questions.filter(function(q){ return q.pts === 1 && (q.niveau === "approfondi" || q.niveau === "expert"); })
    .sort(function(a, b){ return (a.taux - b.taux) || (a.n - b.n); }).slice(0, 2);
  if(difficiles.length) phrase([{t:"Bravo, tu sais ", p:true}].concat(liste(difficiles.map(function(q){ return q.verifie; })), [{t:"."}]));
  // Très bonne maîtrise : la phrase de Paul, après le « Bravo » (« sur » retiré : la suite est à l'infinitif)
  if(ameliorer && r.niveau === "vert") phrase([{t:"Même si ta maîtrise est bonne, tu peux encore t'améliorer : "}].concat(ameliorer));
  // 4. Le point d'autonomie retiré : les deux compétences de Paul (451),
  //    par leur libellé élève (r.autonomieLibs : tr-personne-03, tr-methodes-02), jamais par l'intitulé officiel
  if(r.autonomieRetiree) phrase([{t:"Pour cette évaluation, deux compétences ne sont pas atteintes : « " + r.autonomieLibs[0] + " » et « " + r.autonomieLibs[1] + " ».", p:true}]);
  // 5. L'estimation, toujours en dernier, avec son contexte (Paul) ; en partiel, « de tes points »
  var est = "Enfin, ton estimation " + (r.mode === "partiel" ? "de tes points" : "de ton nombre de bonnes réponses");
  if(r.estimation === "ok") phrase([{t:est + " correspond à ton vrai résultat : tu te connais bien !"}]);
  else if(r.estimation === "sur") phrase(r.ecart >= 2
    ? [{t:est + " "}, {t:"était bien trop haute : tu as nettement surestimé ce que tu avais réussi.", p:true}]
    : [{t:est + " "}, {t:"était trop haute : ", p:true}, {t:"tu as un peu surestimé ce que tu avais réussi."}]);
  else if(r.estimation === "sous") phrase([{t:est + " "}, {t:"était trop basse : ", p:true}, {t:"tu as fait mieux que ce que tu croyais."}]);
  return out;
}

    else { var a = b.parentNode.querySelector(".eleve-choix-btn.aucun"); if(a) a.classList.remove("selected"); }

/* Le PDF « notes et compétences » de gen632.js, tel quel, dans l'aperçu d'impression du navigateur */
function PdfApercu(){
  return h("div", {className:"pdf-fond"},
    h("div", {className:"pdf-barre"}, "🖨️ Aperçu avant impression · Destination : Enregistrer au format PDF"),

      onLoad:function(ev){ var f = ev.target, d = f.contentDocument; f.style.height = (d.documentElement.scrollHeight + 4) + "px"; window.SCENE_PRETE = "x632-pdf"; }}));
}
SCENES.push({id:"x632-pdf", vue:"console", attendre:true, render:PdfApercu});

/* La liste, dans l'ordre de la séance */
(function(){
  var parId = {}; SCENES.forEach(function(s){ parId[s.id] = s; });
  var liste = [];
  ORDRE.forEach(function(sec){ sec[1].forEach(function(x){
    var s = parId[x[0]];
    if(!s) throw new Error("Scène absente : " + x[0]);
    liste.push({id:s.id, vue:s.vue, vh:s.vh || null, attendre:!!s.attendre, render:s.render, section:sec[0], etape:x[1], titre:x[2]});
  }); });
  SCENES = liste;
})();
window.LISTE_SCENES = SCENES.map(function(s, i){ return {n:i + 1, id:s.id, vue:s.vue, vh:s.vh, section:s.section, etape:s.etape, titre:s.titre}; });

/* ── Le sommaire ⚙ « Scènes de la maquette » : le seul écran de simulation ── */
function Sommaire(courante){
  var n = 0;
  return h("div", {className:"som-fond", id:"sommaire"},
    h("div", {className:"som-boite"},
      h("div", {className:"som-h"}, h("strong", null, "⚙ Scènes de la maquette"),
        h("button", {className:"btn btn-ghost btn-sm som-x", title:"Fermer le sommaire (Échap)"}, "✕")),
      h("p", {className:"som-p"}, "Écran de simulation : il n'existera pas dans l'app. Chaque scène est l'écran entier, dans l'ordre de la séance."),
      ORDRE.map(function(sec, i){
        return h("div", {key:i, className:"som-sec"}, h("div", {className:"som-st"}, sec[0]),
          sec[1].map(function(x){ n++;
            return h("a", {key:x[0], href:"#scene=" + x[0], className:"som-l" + (x[0] === courante ? " cur" : "")},
              h("span", {className:"som-n"}, n), h("span", {className:"som-id"}, x[0]), h("span", null, x[2]));
          }));
      })));
}
function lireScene(){ var m = /scene=([^&]+)/.exec(location.hash || ""); return m ? decodeURIComponent(m[1]) : SCENES[0].id; }
function rendre(){
  var id = lireScene(), sc = SCENES.filter(function(s){ return s.id === id; })[0] || SCENES[0];
  document.body.className = "vue-" + sc.vue + (/[#&]cap=1/.test(location.hash) ? " capture" : "");
  var racine = document.getElementById("root");
  window.SCENE_COURANTE = sc.id;
  ReactDOM.unmountComponentAtNode(racine);
  ReactDOM.render(sc.render(), racine);
  poserGestes(); surveiller();
  var g = document.getElementById("som-racine");
  ReactDOM.render(h(F, null,
    h("button", {className:"som-gear", title:"⚙ Scènes de la maquette : le sommaire de toutes les scènes (simulation)"}, "⚙"),
    window.SOMMAIRE_OUVERT ? Sommaire(sc.id) : null), g);
  if(!sc.attendre) window.SCENE_PRETE = sc.id; else window.SCENE_PRETE = null;
}
document.addEventListener("click", function(ev){
  var t = ev.target.closest ? ev.target.closest(".som-gear, .som-x, .som-l") : null;
  if(!t) return;
  if(t.classList.contains("som-gear")){ window.SOMMAIRE_OUVERT = !window.SOMMAIRE_OUVERT; rendre(); }
  else if(t.classList.contains("som-x")){ window.SOMMAIRE_OUVERT = false; rendre(); }
  else if(t.classList.contains("som-l")){ window.SOMMAIRE_OUVERT = false; }
});
document.addEventListener("keydown", function(ev){ if(ev.key === "Escape" && window.SOMMAIRE_OUVERT){ window.SOMMAIRE_OUVERT = false; rendre(); } });
window.addEventListener("hashchange", rendre);
rendre();
