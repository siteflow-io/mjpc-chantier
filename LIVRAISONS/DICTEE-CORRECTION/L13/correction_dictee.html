function generateRaisonnement(mot,type){
  if(!mot)return [];
  var wl=mot.toLowerCase();
  var steps=[];
  if(type==="G"){
    if(["a","à"].indexOf(wl)>=0){
      steps.push("Étape 1 : lis la phrase à voix haute.");
      steps.push("Étape 2 : essaie de remplacer le mot par « avait ».");
      steps.push("Étape 3 : si la phrase a du sens → c'est « a » (verbe avoir). Sinon → c'est « à » (préposition).");
      return steps;
    }
    if(["et","est"].indexOf(wl)>=0){
      steps.push("Étape 1 : lis la phrase à voix haute.");
      steps.push("Étape 2 : essaie de remplacer par « était ».");
      steps.push("Étape 3 : si ça marche → c'est « est » (verbe être). Sinon → c'est « et » (= et puis).");
      return steps;
    }
    if(["on","ont"].indexOf(wl)>=0){
      steps.push("Étape 1 : essaie de remplacer par « quelqu'un » ou « il ».");
      steps.push("Étape 2 : si ça marche → c'est « on » (pronom sujet).");
      steps.push("Étape 3 : sinon, essaie « avaient » → si ça marche, c'est « ont » (verbe avoir).");
      return steps;
    }
    if(["son","sont"].indexOf(wl)>=0){
      steps.push("Étape 1 : essaie de remplacer par « étaient ».");
      steps.push("Étape 2 : si ça marche → c'est « sont » (verbe être).");
      steps.push("Étape 3 : sinon, essaie « mon » ou « ton » → si ça marche, c'est « son » (possessif).");
      return steps;
    }
    if(["ses","ces"].indexOf(wl)>=0){
      steps.push("Étape 1 : essaie de remplacer par « mes » (les miens).");
      steps.push("Étape 2 : si ça marche → c'est « ses » (les siens).");
      steps.push("Étape 3 : sinon, c'est « ces » (= ceux-là).");
      return steps;
    }
    if(["ou","où"].indexOf(wl)>=0){
      steps.push("Étape 1 : essaie de remplacer par « ou bien ».");
      steps.push("Étape 2 : si ça marche → c'est « ou » (alternative).");
      steps.push("Étape 3 : sinon → c'est « où » (lieu ou temps).");
      return steps;
    }
    if(["leur","leurs"].indexOf(wl)>=0){
      steps.push("Étape 1 : regarde le mot juste après.");
      steps.push("Étape 2 : si c'est un VERBE → « leur » (invariable).");
      steps.push("Étape 3 : si c'est un NOM → « leur » si le nom est singulier, « leurs » si pluriel.");
      return steps;
    }
    if(/(é|ée|és|ées)$/.test(wl)){
      steps.push("Étape 1 : trouve l'auxiliaire (être / avoir / aucun).");
      steps.push("Étape 2 : avec ÊTRE → accord avec le sujet (genre + nombre).");
      steps.push("Étape 3 : avec AVOIR → accord avec le COD si placé AVANT ; seul (sans auxiliaire) → accord comme adjectif.");
      return steps;
    }
    if(/(ais|ait|aient|ions|iez)$/.test(wl)){
      steps.push("Étape 1 : trouve le sujet du verbe.");
      steps.push("Étape 2 : c'est de l'imparfait : je -ais, tu -ais, il -ait, nous -ions, vous -iez, ils -aient.");
      steps.push("Étape 3 : applique la terminaison qui correspond au sujet.");
      return steps;
    }
    if(/er$/.test(wl)){
      steps.push("Étape 1 : remplace mentalement le verbe par « mordre ».");
      steps.push("Étape 2 : si la phrase marche avec « mordre » → infinitif → -er.");
      steps.push("Étape 3 : si elle marche avec « mordu » → participe passé → -é.");
      return steps;
    }
    steps.push("Étape 1 : identifie la nature du mot (verbe, nom, adjectif, déterminant).");
    steps.push("Étape 2 : trouve avec quel mot il s'accorde (sujet pour un verbe, nom pour un adjectif).");
    steps.push("Étape 3 : applique la règle d'accord en genre et en nombre.");
    return steps;
  }
  if(type==="L"){
    if(/(mm|nn|ll|ss|tt|pp|ff|rr|cc)/.test(wl)){
      steps.push("Étape 1 : pense à un mot de la même famille (ex. courrier → courriel).");
      steps.push("Étape 2 : la consonne est-elle doublée dans la famille ?");
      steps.push("Étape 3 : applique le doublement (ou non) au mot que tu écris.");
      return steps;
    }
    if(/[éèêë]/.test(wl)){
      steps.push("Étape 1 : prononce la syllabe à voix haute.");
      steps.push("Étape 2 : son [é] fermé → accent aigu (é). Son [è] ouvert → accent grave (è).");
      steps.push("Étape 3 : circonflexe (ê) sur certains mots à mémoriser (fenêtre, tête).");
      return steps;
    }
    if(/(tion|sion|xion)$/.test(wl)){
      steps.push("Étape 1 : trouve le verbe d'où vient le mot (action → agir, connexion → connecter).");
      steps.push("Étape 2 : -tion si verbe en -ter / -ger. -sion si verbe en -dre. -xion si verbe en -cter.");
      steps.push("Étape 3 : applique le suffixe correspondant.");
      return steps;
    }
    if(/ph/.test(wl)){
      steps.push("Étape 1 : le mot vient-il du grec ? (philosophie, pharmacie, téléphone).");
      steps.push("Étape 2 : si oui → le [f] s'écrit « ph ».");
      steps.push("Étape 3 : sinon → le [f] s'écrit avec un « f ».");
      return steps;
    }
    steps.push("Étape 1 : prononce le mot lentement, syllabe par syllabe.");
    steps.push("Étape 2 : repère les pièges (consonnes doublées, accents, lettres muettes).");
    steps.push("Étape 3 : si tu hésites, pense à un mot de la même famille.");
    return steps;
  }
  steps.push("Réfléchis bien au mot. Décompose-le en syllabes.");
  return steps;
}

// Corrige les indices de lacunes après un éventuel changement de tokenisation.
// Si tokens[lac.tokenIdx] != mot attendu (lac.word ou lac.propositions[0]),
// cherche la prochaine occurrence du mot non-encore-affectée.
function fixLacunesIndices(lacunes,tokens){
  if(!lacunes||!lacunes.length||!tokens)return lacunes||[];
  // Trier par tokenIdx pour respecter l'ordre original
  var sorted=lacunes.slice().sort(function(a,b){return (a.tokenIdx||0)-(b.tokenIdx||0)});
  var used={};
  return sorted.map(function(l){
    var expected=l.word||(l.propositions&&l.propositions[0]);
    if(!expected)return l;
    // Si l'indice stocké pointe sur le bon mot, on garde
    if(tokens[l.tokenIdx]===expected&&!used[l.tokenIdx]){used[l.tokenIdx]=true;return l}
    // Sinon, on cherche la prochaine occurrence non utilisée
    for(var i=0;i<tokens.length;i++){
      if(tokens[i]===expected&&!used[i]){used[i]=true;return Object.assign({},l,{tokenIdx:i,word:expected})}
    }
    return l; // mot introuvable, on laisse tel quel
  });
}

// Génère la consigne par défaut selon les modes présents dans les lacunes
function generateConsigne(amen){
  if(!amen||!amen.lacunes||!amen.lacunes.length)return "";
  var defaultMode=amen.defaultMode||"A";
  var modes={};
  amen.lacunes.forEach(function(l){modes[l.mode||defaultMode]=true});
  var hasA=modes.A,hasB=modes.B,hasC=modes.C;
  if(hasA&&!hasB&&!hasC)return "Compl\u00e8te chaque blanc en entourant la proposition correcte parmi celles propos\u00e9es au-dessus.";
  if(hasB&&!hasA&&!hasC)return "Compl\u00e8te chaque blanc en \u00e9crivant le mot manquant sur les pointill\u00e9s.";
  if(hasC&&!hasA&&!hasB)return "Compl\u00e8te chaque blanc en \u00e9crivant le mot manquant. Aide-toi des indices num\u00e9rot\u00e9s en bas de page.";
  // Mixte
  var parts=[];
  if(hasA)parts.push("entoure la proposition correcte propos\u00e9e au-dessus");
  if(hasB)parts.push("\u00e9cris le mot manquant sur les pointill\u00e9s");
  if(hasC)parts.push("aide-toi des indices num\u00e9rot\u00e9s en bas");
  return "Pour chaque blanc, "+parts.join(", ou ")+".";
}
// ═══ TTS (Web Speech API) — lecture audio pour mode rapide ═══
// Inspiré de etude_dugain.html : lecture asservie à la navigation,
// interruption immédiate à tout changement de mot.

// Dictionnaire de prononciation pour la ponctuation
var SPEECH_PUNCT={
  ".":"point","\u2026":"points de suspension","...":"points de suspension",
  ",":"virgule",";":"point virgule",":":"deux points",
  "?":"point d'interrogation","!":"point d'exclamation",
  "\u00ab":"ouvrir les guillemets","\u00bb":"fermer les guillemets",
  "\u201c":"ouvrir les guillemets","\u201d":"fermer les guillemets",
  "(":"parenthèse ouvrante",")":"parenthèse fermante",
  "-":"tiret","\u2013":"tiret","\u2014":"tiret",
  "'":"apostrophe","\u2019":"apostrophe"
};
function speechText(word){
  if(!word)return "";
  // Pour un token de ponctuation pure, lit son nom
  if(SPEECH_PUNCT[word])return SPEECH_PUNCT[word];
  // Pour un mot finissant par apostrophe (qu', l', s'…), enlève l'apostrophe pour la lecture
  // (l'apostrophe sera prononcée naturellement par le moteur français en attaque du mot suivant)
  return word.replace(/['\u2019]$/, "");
}
// Sélection de voix : voix locale UNIQUEMENT (les voix réseau type "Google français"
// causent un lag réseau de 200-500ms à chaque mot). Préférence : Hortense > Julie > autre locale.
var _frenchVoice=null;
function _selectFrenchVoice(){
  if(!('speechSynthesis' in window))return;
  var voices=window.speechSynthesis.getVoices();
  if(!voices||!voices.length){_frenchVoice=null;return}
  var french=voices.filter(function(v){return v.lang&&v.lang.startsWith("fr")});
  var locals=french.filter(function(v){return v.localService});
  // Préférence par nom (Hortense est généralement la plus rapide à démarrer sous Windows)
  var prefer=["Hortense","Julie","Paul","Microsoft"];
  for(var i=0;i<prefer.length;i++){
    var found=locals.find(function(v){return v.name.indexOf(prefer[i])>=0});
    if(found){_frenchVoice=found;return}
  }
  _frenchVoice=locals[0]||null; // toujours une voix locale, jamais réseau
}
if('speechSynthesis' in window){
  _selectFrenchVoice();
  window.speechSynthesis.addEventListener("voiceschanged",_selectFrenchVoice);
}
// Permet à l'utilisateur de surcharger via le curseur de réactivité (rate)
function getSpeechRate(){try{var r=parseFloat(localStorage.getItem("mjpc_speech_rate"));return(r>=.5&&r<=4)?r:1.15}catch(e){return 1.15}}
function setSpeechRate(r){try{localStorage.setItem("mjpc_speech_rate",String(r))}catch(e){}}
function speakWord(word){
  if(!('speechSynthesis' in window))return;
  window.speechSynthesis.cancel();
  var txt=speechText(word);if(!txt)return;
  var u=new SpeechSynthesisUtterance(txt);
  u.lang="fr-FR";u.rate=getSpeechRate();u.pitch=1.0;u.volume=1.0;
  if(_frenchVoice)u.voice=_frenchVoice;
  window.speechSynthesis.speak(u);
}
function stopSpeech(){if('speechSynthesis' in window)window.speechSynthesis.cancel()}

  var s5=useState(null),flashType=s5[0],setFlashType=s5[1];
  var s6=useState(null),askFautif=s6[0],setAskFautif=s6[1];

  React.useEffect(function(){if(askFautif&&fautifRef.current)fautifRef.current.focus()},[askFautif]);

  var list=listMode==="uncorrected"?uncorrected:allStudents;
  var curEleve=list[studentIdx];
  var wordTokens=tokens.map(function(t,i){return{text:t,idx:i}});
  var curWord=wordIdx<wordTokens.length?wordTokens[wordIdx]:null;
  var pctWord=Math.round(wordIdx/wordTokens.length*100);
  var sc=computeNote(errors,extras,data.base,data.bareme);

  function markError(type){
    if(type==="G"||type==="L"){setAskFautif(type);setFautifVal("");return}

    var wt=wordTokens[wordIdx];if(!wt)return;

    ne.push({idx:wt.idx,type:type,word:wt.text});

    setWordIdx(wordIdx+1);
  }

  React.useEffect(function(){
    if(askFautif)return;
    function onKey(e){
      if(e.key==="g"||e.key==="G"){e.preventDefault();markError("G")}
      else if(e.key==="l"||e.key==="L"){e.preventDefault();markError("L")}
      else if(e.key==="/"||e.key==="M"||e.key==="m"){e.preventDefault();
        var wt2=wordTokens[wordIdx];if(wt2){
          var ne2=errors.filter(function(e2){return e2.idx!==wt2.idx});
          ne2.push({idx:wt2.idx,type:"M",word:wt2.text});setErrors(ne2);
          setFlashType("M");setTimeout(function(){setFlashType(null)},400);setWordIdx(wordIdx+1);
        }
      }
      else if(e.key==="?"||e.key==="I"||e.key==="i"){e.preventDefault();
        var wt3=wordTokens[wordIdx];if(wt3){

          ne3.push({idx:wt3.idx,type:"I",word:wt3.text});setErrors(ne3);
          setFlashType("I");setTimeout(function(){setFlashType(null)},400);setWordIdx(wordIdx+1);
        }
      }
      else if(e.key==="p"||e.key==="P"){
        var wtp=wordTokens[wordIdx];
        if(wtp&&isPunct(wtp.text)&&!estApostrophe(wtp.text)){/* apostrophe : élision = orthographe (E), pas ponctuation */
          e.preventDefault();

          nep.push({idx:wtp.idx,type:"P",word:wtp.text});setErrors(nep);

        }
      }

        var wta=wordTokens[wordIdx];if(wta){

          nea.push({idx:wta.idx,type:"A",word:wta.text});setErrors(nea);

var PROMPT_IA_BANQUE_DEFAUT = "Tu es un professeur de fran\u00e7ais expert en didactique. Je te fournis ci-dessous le JSON d'une dict\u00e9e corrig\u00e9e pour ma classe : texte, \u00e9l\u00e8ves, erreurs commises par chacun avec leur type (G=grammaire, L=lexique, M=mot manquant, P=ponctuation manquante, I=illisible, A=attention, E=\u00e9lision/apostrophe).\n\nObjectif : produire un document HTML autonome (1 seul fichier, design soign\u00e9 mais sobre, lisible pour des coll\u00e9giens) contenant DEUX SETS d'exercices :\n\n=== SET 1 \u2014 EXERCICES POUR LA CLASSE ENTI\u00c8RE ===\nAnalyse les erreurs les plus fr\u00e9quentes (au moins 3 \u00e9l\u00e8ves concern\u00e9s). Pour chaque difficult\u00e9 collective d\u00e9tect\u00e9e :\n- Un rappel de r\u00e8gle concis (max 4 lignes)\n- 3 \u00e0 5 exercices cibl\u00e9s (difficult\u00e9 croissante : reconnaissance > application > r\u00e9investissement)\n- Corrig\u00e9s en fin de section (ou en <details>)\n\n=== SET 2 \u2014 EXERCICES PERSONNALIS\u00c9S PAR \u00c9L\u00c8VE ===\nPour chaque \u00e9l\u00e8ve ayant fait au moins 3 erreurs, une mini-page personnelle avec son pr\u00e9nom en titre :\n- R\u00e9cap visuel de ses 3 difficult\u00e9s principales (avec exemples tir\u00e9s de SA dict\u00e9e)\n- 5 \u00e0 8 exercices cibl\u00e9s sur SES erreurs (pas celles des autres)\n- Corrig\u00e9s en fin de section\n\n=== CONTRAINTES TECHNIQUES ===\n- HTML5 valide, autonome (CSS + JS inline, aucune d\u00e9pendance externe)\n- Imprimable : @media print propre, sauts de page entre sections\n- Typographie agr\u00e9able (system font stack, EB Garamond via Google Fonts en option)\n- Sommaire en haut avec ancres vers les sections\n- Pas de tableaux d\u00e9coratifs, pas d'images\n- Niveau de langue adapt\u00e9 au niveau scolaire du JSON\n- Palette : G=rouge, L=bleu, M=ocre, P=bleu, I=violet, A=orange, E=vert canard\n\n=== \u00c9VOLUTION FUTURE ===\n\u00c0 terme, cette m\u00eame requ\u00eate devra pouvoir g\u00e9n\u00e9rer un JSON injectable dans l'app de dict\u00e9e. Pense la structure HTML pour qu'elle puisse \u00eatre convertie facilement en donn\u00e9es structur\u00e9es (un exercice = un objet avec type, \u00e9nonc\u00e9, items, correction).\n\n=== JSON DE LA DICT\u00c9E ===\n{{JSON_DICTEE}}";

function buildDicteeJSON(data, corrections, absents){
  absents = absents || {};
  var prenomOnly = function(n){var p=n.split(/\s+/);return p.length>1?p[p.length-1]:n};
  var out = {
    dictee: {
      titre: data.title || "",
      classe: data.classe || "",
      niveau: data.niveau || "",
      base: data.base || 20,
      competences: toArr(data.competences) || [],
      texte: data.text || ""
    },
    eleves: [],
    bilan_classe: {effectif: 0, corriges: 0, moyenne: null, mediane: null, mots_les_plus_echoues: []}
  };
  var notes = [];
  var wordFreq = {};
  data.eleves.forEach(function(e){
    var k = san(e);
    if (absents[k]) return;
    var c = corrections[k];
    var elObj = {prenom: prenomOnly(e), nom_complet: e, corrige: !!c};
    if (c) {
      elObj.note = c.note; elObj.note_sur = baseDeCopie(c, data.base || 20); elObj.sans_cout = (c.counts && c.counts.sansCout) || 0;   /* [L11] */ elObj.copie = {id: c.id || null, creeLe: c.creeLe || null, modifieLe: c.modifieLe || null};   /* [L9] l'identité, dans le bilan exporté */   /* [ELEVE-1 ④] chaque note avec SA base (Paul, 01/10 : « l'aménagement n'est pas un secret d'État ») */
      elObj.compteurs = c.counts || {};
      elObj.erreurs = toArr(c.errors).map(function(err){
        var o = {position: err.idx, mot_correct: err.word || null, type: err.type};
        if (err.fautif) o.mot_ecrit_par_eleve = err.fautif;
        return o;
      });
      elObj.mots_ajoutes_en_trop = toArr(c.extras).map(function(ex){return ex.word});
      if (baseDeCopie(c, data.base || 20) === (data.base || 20)) notes.push(c.note);   /* la moyenne et la médiane : les copies sur la base de la dictée, rien n'est mêlé */
      toArr(c.errors).forEach(function(err){
        var w = err.word || "?";
        if (!wordFreq[w]) wordFreq[w] = {mot: w, total: 0, par_type: {}, eleves_concernes: []};
        wordFreq[w].total++;
        wordFreq[w].par_type[err.type] = (wordFreq[w].par_type[err.type] || 0) + 1;
        wordFreq[w].eleves_concernes.push(prenomOnly(e));
      });
    }
    out.eleves.push(elObj);
  });
  out.bilan_classe.effectif = out.eleves.length;
  out.bilan_classe.corriges = notes.length; out.bilan_classe.moyenne_sur = data.base || 20;   /* [ELEVE-1 ④] la moyenne dit sa base */
  if (notes.length) {
    out.bilan_classe.moyenne = Math.round(notes.reduce(function(a,b){return a+b},0) / notes.length * 10) / 10;
    var s = notes.slice().sort(function(a,b){return a-b}), m = Math.floor(s.length/2);
    out.bilan_classe.mediane = s.length % 2 ? s[m] : Math.round((s[m-1]+s[m])*5)/10;
  }
  out.bilan_classe.mots_les_plus_echoues = Object.values(wordFreq).sort(function(a,b){return b.total-a.total}).slice(0, 20);
  return out;
}

  var sEx=useState(null), exercices=sEx[0], setExercices=sEx[1];
  var sExR=useState({}), exResults=sExR[0], setExResults=sExR[1];
  var NOW=Date.now();
  var RECENT=60*1000;

  // Force re-render every 15s to update statuses
  useEffect(function(){
    var t=setInterval(function(){setTick(function(n){return n+1})},15000);
    return function(){clearInterval(t)};
  },[]);

  useEffect(function(){
    var ref=db.ref("correction_dictee/"+p.dicteeId+"/autocorrection");
    function onData(snap){setAutoCorr(snap.val()||{})}
    ref.on("value",onData);

    function onEx(snap){setExercices(snap.val()||null)}
    refE.on("value",onEx);

    function onR(snap){setExResults(snap.val()||{})}
    refR.on("value",onR);
    return function(){ref.off("value",onData);refE.off("value",onEx);refR.off("value",onR)};
  },[p.dicteeId]);

  // Helper : calcule les stats exos pour un élève (rétroactif, lit Firebase)
  function statsExos(eleveName){
    if(!exercices)return{hasExos:false,totalExos:0,exosDone:0,totalAuto:0,okAuto:0,totalLibres:0,saisiesLibres:0,totalAttempts:0,wrongAttempts:0};
    var bundle=exGetForEleve(exercices,eleveName);
    var allExos=bundle.personnels.concat(bundle.classe);
    if(allExos.length===0)return{hasExos:false,totalExos:0,exosDone:0,totalAuto:0,okAuto:0,totalLibres:0,saisiesLibres:0,totalAttempts:0,wrongAttempts:0};
    var eleveKey=san(eleveName);
    var er=(exResults||{})[eleveKey];
    var exosDone=0,totalAuto=0,okAuto=0,totalLibres=0,saisiesLibres=0,totalAttempts=0,wrongAttempts=0;
    ["personnels","classe"].forEach(function(typeKey){
      var pool=typeKey==="personnels"?bundle.personnels:bundle.classe;
      pool.forEach(function(ex,exIdx){
        var items=(ex.items||[]);
        var r=er&&er[typeKey]&&er[typeKey][exIdx];
        if(r&&r.completed)exosDone++;
        items.forEach(function(it,itIdx){
          if(!it)return;
          var attempts=r&&r.attempts&&r.attempts[itIdx]?r.attempts[itIdx]:0;

  }

  var classKeys=data.eleves.map(san);
  var testKeys=[];
  Object.keys(autoCorr).forEach(function(k){if(classKeys.indexOf(k)===-1){eleves.push(k.toUpperCase().replace(/_/g," ")+" (TEST)");testKeys.push(k)}});

  var rows=eleves.map(function(e){
    var isTest=e.indexOf("(TEST)")>=0;
    var k;
    if(isTest){var testIdx=eleves.filter(function(x){return x.indexOf("(TEST)")>=0}).indexOf(e);k=testKeys[testIdx]||san(e.replace(" (TEST)",""))}
    else{k=san(e)}
    var c=p.corrections[k],ac=autoCorr[k];
    var nErr=c?toArr(c.errors).filter(function(e){return e&&e.type!=="A"}).length:0;
    var totalAtt=0,wrongAtt=0;
    if(ac&&ac.attempts){
      var attObj=ac.attempts;
      Object.keys(attObj).forEach(function(ki){
        var n=attObj[ki]||0;totalAtt+=n;
        if(ac.results&&ac.results[ki])wrongAtt+=(n-1);else wrongAtt+=n;

    }

    // (avant : « 22/21 » quand une erreur trouvée avait été passée en « attention graphie » ensuite).
    var errsCopie=c?toArr(c.errors):null;

    // car l'ancienne version stockait .total avec les A inclus, ce qui rendait solved>=total impossible.
    var totalCorrigible = nErr; // valeur de référence (depuis la copie prof)
    if(ac && ac.errorRefs){
      var refs = toArr(ac.errorRefs);
      var nonA = refs.filter(function(e){return e&&e.type!=="A"}).length;
      if(nonA > 0) totalCorrigible = nonA;
    }
    var total = errsCopie?errsCopie.filter(function(e){return e&&e.type!=="A"}).length:totalCorrigible;
    var finished=total>0&&solved>=total;
    var lastSeen=ac&&ac.lastSeen?ac.lastSeen:ac?ac.timestamp:0;
    var status;
    // Statut basé sur les données, pas sur le champ status Firebase
    if(finished) status="done";
    else if(ac&&ac.solved>0&&lastSeen&&(NOW-lastSeen)<RECENT) status="active";
    else if(ac&&ac.solved>0) status="idle";
    else if(ac&&lastSeen&&(NOW-lastSeen)<RECENT) status="active";
    else if(ac&&lastSeen) status="idle";
    else if(!ac) status="waiting";
    else status="waiting";
    return{name:e,key:k,isTest:isTest,noteDictee:c?c.note:null,baseDictee:c?baseDeCopie(c,data.base):data.base,nErrors:nErr,
      solved:solved,total:total,score:ac&&(ac.attempts||ac.score!=null)?acNoteArrondie(acNote(ac.attempts,ac.results,total,errsCopie,ac.questions)):null,
      totalAttempts:totalAtt,wrongAttempts:wrongAtt,
      status:status,timestamp:ac?ac.timestamp:0,lastSeen:lastSeen};
  }).sort(function(a,b){
    var order={active:0,bilan:1,done:2,idle:3,offline:4,waiting:5};
    if(order[a.status]!==order[b.status])return order[a.status]-order[b.status];
    if(a.status==="active")return(b.solved/Math.max(1,b.total))-(a.solved/Math.max(1,a.total));
    return 0;
  });

  var nActive=rows.filter(function(r){return r.status==="active"}).length;
  var nDone=rows.filter(function(r){return r.status==="done"}).length;
  var nStarted=rows.filter(function(r){return r.status!=="waiting"}).length;
  var nTotal=rows.length;

  var totalWrongAll=rows.reduce(function(a,r){return a+r.wrongAttempts},0);

  var statusLabel=function(s){return s==="done"?"Termin\u00e9":s==="bilan"?"Bilan en cours":s==="active"?"En cours":s==="idle"?"Inactif":s==="offline"?"D\u00e9connect\u00e9":"Pas commenc\u00e9"};

  // ═══ Lot 3a : l'heure d'autocorrection, lancée par le professeur (comme la séance de worktrack) ═══
  // Hub : correction_dictee/<dictée>/heure = {debut, fin, classe, cloture, clotureA}
  function hhmm(t){var d=new Date(t);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
  function lancerHeure(){
    var m=/^(\d{1,2}):(\d{2})$/.exec(finSaisie||"");if(!m)return;
    var d=new Date();d.setHours(Number(m[1]),Number(m[2]),0,0);var fin=d.getTime();

    setAvisHeure("");db.ref("correction_dictee/"+p.dicteeId+"/heure").set({debut:Date.now(),fin:fin,classe:data.classe||""});

    html+='.err-type-x{color:#2563eb}';

    html+='</style></head><body>';

    eleves.forEach(function(eleve){
      var k=san(eleve),c=corr[k];if(!c)return;
      var errors=toArr(c.errors),extras=toArr(c.extras);
      var errMap={};errors.forEach(function(e){errMap[e.idx]=e});
      var extraMap={};extras.forEach(function(e){if(!extraMap[e.afterIdx])extraMap[e.afterIdx]=[];extraMap[e.afterIdx].push(e)});
      var tokens=data.tokens;
      var co=c.counts||{G:0,L:0,M:0,I:0,E:0,X:0};

      // ──── RECTO ────

      html+='<div class="texte">';

      for(var i=0;i<tokens.length;i++){
        // Extras inserted after previous word
        if(extraMap[i-1]){extraMap[i-1].forEach(function(ex){
          html+='<span class="extra-signal">&thinsp;[+'+ex.word+']&thinsp;</span>';
        })}

        var err=errMap[i];
        var w=tokens[i];
        var isP=/^[.,;:!?\u2026\u00ab\u00bb\u201c\u201d\u2018\u2019()\-\u2013\u2014]+$/.test(w);
        // Collapse space before punctuation
        var spaceBefore=(i>0&&!isP)?" ":"";

        if(err){
          if(err.type==="M"){
            // Mot manquant = trait violet avec espace vide
            html+=spaceBefore+'<span class="manquant-trou"><span class="manquant-top"></span><span class="manquant-label">\u2205</span></span>';
          } else if(err.type==="P"){

            html+=spaceBefore+'<span class="ponct-trou"><span class="ponct-top"></span><span class="ponct-label">P</span></span>';

            html+=spaceBefore+'<span class="attention-mark">'+w+'</span><span class="attention-sub">\u26a0</span>';
          } else {
            // Mot masqué = underscores de la longueur du mot + badge type
            var blanks="";for(var j=0;j<w.length;j++)blanks+="_";
            var lblCls="trou-label trou-label-"+err.type.toLowerCase();
            html+=spaceBefore+'<span class="trou"><span class="trou-top">'+blanks+'</span><span class="'+lblCls+'">'+err.type+'</span></span>';
          }
        } else {
          html+=spaceBefore+w;
        }
      }
      // Extras after last word
      if(extraMap[tokens.length-1]){extraMap[tokens.length-1].forEach(function(ex){
        html+='<span class="extra-signal">&thinsp;[+'+ex.word+']&thinsp;</span>';
      })}

      html+='</div>';
      html+='<div class="summary"><span>'+co.G+' grammaire &middot; '+co.L+' lexique &middot; '+(co.E||0)+' \u00e9lision &middot; '+(co.M||0)+' manquant &middot; '+(co.P||0)+' ponct. &middot; '+(co.I||0)+' illisible &middot; '+(co.A||0)+' attention graphie &middot; '+(co.X||0)+' en trop</span>';
      html+='<strong style="color:'+nc+'">'+noteFr(c.note)+'/'+data.base+'</strong></div>';
      html+='</div>';

      // ──── VERSO ────
      html+='<div class="verso">';
      html+='<div class="verso-header"><h1>'+eleve+' &mdash; Correction</h1><div class="info">'+data.title+' &middot; '+data.classe+'</div></div>';
      html+='<div class="verso-title">Retrouve la bonne orthographe</div>';

      var n=1;
      errors.forEach(function(err){
        var typeLabel=err.type==="G"?"Grammaire":err.type==="L"?"Lexique":err.type==="M"?"Mot manquant":err.type==="P"?"Ponctuation manquante":err.type==="A"?"Attention \u00e0 ta graphie":"Illisible";
        var hint=err.type==="G"?"Accords, conjugaison, homophones...":err.type==="L"?"Orthographe, accents, majuscules...":err.type==="M"?"Un mot a \u00e9t\u00e9 oubli\u00e9 dans la copie":err.type==="P"?"Un signe de ponctuation manquait (. , ; : ? !)":err.type==="A"?"J\u2019ai h\u00e9sit\u00e9 \u00e0 mettre illisible. Aucun point retir\u00e9, mais soigne le trac\u00e9 \u00e0 l\u2019avenir.":"Le mot n\u2019\u00e9tait pas lisible";
        var numCls="err-num err-num-"+err.type.toLowerCase();
        var typeCls="err-type err-type-"+err.type.toLowerCase();
        html+='<div class="err-row">';
        html+='<div class="'+numCls+'">'+n+'</div>';
        html+='<div class="err-body">';
        html+='<div class="'+typeCls+'">'+typeLabel+'</div>';
        html+='<div class="err-hint">'+hint+'</div>';
        html+='<div class="err-line"></div>';
        html+='</div></div>';
        n++;
      });
      if(extras.length>0){
        extras.forEach(function(ex){
          html+='<div class="err-row">';
          html+='<div class="err-num err-num-x">'+n+'</div>';
          html+='<div class="err-body">';
          html+='<div class="err-type err-type-x">Mot en trop : &laquo;&thinsp;'+ex.word+'&thinsp;&raquo;</div>';
          html+='<div class="err-hint">Ce mot ne devrait pas \u00eatre l\u00e0</div>';
          html+='</div></div>';
          n++;
        });
      }

      html+='<div class="verso-consigne">Travail en bin\u00f4me : compl\u00e8te chaque ligne, puis retourne la feuille pour v\u00e9rifier avec le texte.</div>';
      html+='</div>';
    });

    html+='</body></html>';
    var w=window.open('','_blank');
    w.document.write(html);
    w.document.close();
  }

  return h("div",{className:"fade-up"},
    h("div",{className:"card"},
      h("h2",null,"Fiches de correction"),
      h("p",{style:{fontSize:".9rem",color:"var(--text-sub)",marginBottom:16}},"G\u00e9n\u00e8re des fiches HTML imprimables (recto + verso). Ouvre dans un nouvel onglet \u2192 Ctrl+P pour imprimer."),
      h("div",{className:"btn-row"},
        h("button",{className:"btn btn-primary",onClick:function(){generateHTML(done)},disabled:!done.length},done.length?"Toutes les fiches ("+done.length+")":"Aucune correction"),
        done.length>0&&h("button",{className:"btn btn-ghost",onClick:function(){var n=prompt("\u00c9l\u00e8ve (NOM Pr\u00e9nom) :");if(n&&corr[san(n)])generateHTML([n]);else if(n)alert("Non trouv\u00e9.")}},"Une fiche")
      )

}

// ═══ COMPOSANT ConfigAmenagee : panneau de config des lacunes ═══
// Props : data (dictée), dicteeId, onClose
function ConfigAmenagee(p){
  var data=p.data,dicteeId=p.dicteeId;
  var tokens=data.tokens||tokenize(data.text||"");
  // Charger config existante
  var s0=useState(null),amen=s0[0],setAmen=s0[1]; // {enabled, defaultMode, base, lacunes}
  var s1=useState(null),selectedTokenIdx=s1[0],setSelectedTokenIdx=s1[1];
  var s2=useState(false),loaded=s2[0],setLoaded=s2[1];
  var s3=useState(""),msg=s3[0],setMsg=s3[1];

  useEffect(function(){
    db.ref("correction_dictee/"+dicteeId+"/dictee/amenagee").once("value",function(snap){
      var v=snap.val();
      if(v){
        // Auto-fix des indices après changement éventuel de tokenisation
        var fixed=fixLacunesIndices(v.lacunes||[],tokens);
        var changed=fixed.some(function(f,i){var orig=(v.lacunes||[])[i];return orig&&f.tokenIdx!==orig.tokenIdx});
        if(changed){
          var newV=Object.assign({},v,{lacunes:fixed});
          db.ref("correction_dictee/"+dicteeId+"/dictee/amenagee").set(newV);
          setAmen(newV);
        } else {
          setAmen(v);
        }
      } else {setAmen({enabled:false,defaultMode:"A",base:10,lacunes:[]})}
      setLoaded(true);
    });
  },[dicteeId]);

  function saveAmen(newAmen){
    setAmen(newAmen);
    db.ref("correction_dictee/"+dicteeId+"/dictee/amenagee").set(newAmen);
  }
  function toggleEnabled(){saveAmen(Object.assign({},amen,{enabled:!amen.enabled}))}
  function setDefaultMode(m){saveAmen(Object.assign({},amen,{defaultMode:m}))}
  function setBase(b){saveAmen(Object.assign({},amen,{base:parseInt(b)||10}))}

  function effectiveLacunes(){return amen&&amen.lacunes?fixLacunesIndices(amen.lacunes,tokens):[]}
  function isLacune(idx){return effectiveLacunes().some(function(l){return l.tokenIdx===idx})}
  function getLacune(idx){return effectiveLacunes().find(function(l){return l.tokenIdx===idx})}
  function addLacune(idx){
    var w=tokens[idx];if(!w||isPunct(w))return;
    // Détection type par GRAMM
    var type="L";
    var distr=suggestDistracteurs(w,2);
    var indice=generateIndice(w,type);
    var raison=generateRaisonnement(w,type);
    var newLac={tokenIdx:idx,word:w,mode:null,type:type,propositions:[w,distr[0],distr[1]],indice:indice,raisonnement:raison};
    var newLacunes=(amen.lacunes||[]).concat([newLac]).sort(function(a,b){return a.tokenIdx-b.tokenIdx});
    saveAmen(Object.assign({},amen,{lacunes:newLacunes}));
    setSelectedTokenIdx(idx);
  }
  function removeLacune(idx){
    var newLacunes=(amen.lacunes||[]).filter(function(l){return l.tokenIdx!==idx});
    saveAmen(Object.assign({},amen,{lacunes:newLacunes}));
    if(selectedTokenIdx===idx)setSelectedTokenIdx(null);
  }
  function updateLacune(idx,patch){
    var newLacunes=(amen.lacunes||[]).map(function(l){
      if(l.tokenIdx!==idx)return l;
      return Object.assign({},l,patch);
    });
    saveAmen(Object.assign({},amen,{lacunes:newLacunes}));
  }

  if(!loaded)return h("div",{className:"card",style:{padding:20,textAlign:"center"}},h("p",{style:{color:"var(--muted)"}},"Chargement\u2026"));

  var lacunesCount=(amen.lacunes||[]).length;
  var selectedLac=selectedTokenIdx!=null?getLacune(selectedTokenIdx):null;

  return h("div",{className:"fade-up"},
    // En-tête + toggle
    h("div",{className:"card amenagee-card"},
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,flexWrap:"wrap"}},
        h("div",null,
          h("h2",{style:{margin:0,fontSize:"1.1rem"}},"\ud83d\udcd8 Version am\u00e9nag\u00e9e",
            ifo("Version PAP/DYS de la dict\u00e9e : texte avec lacunes (mots \u00e0 trous). Trois modes possibles selon la lacune \u2014 3 propositions \u00e0 cocher, trou simple, ou trou avec indice grammatical.",{below:true})),
          h("p",{style:{fontSize:".82rem",color:"var(--muted)",marginTop:4}},lacunesCount+" lacune"+(lacunesCount>1?"s":"")+" d\u00e9finie"+(lacunesCount>1?"s":""))
        ),
        h("label",{style:{display:"flex",alignItems:"center",gap:8,cursor:"pointer"}},
          h("input",{type:"checkbox",checked:!!amen.enabled,onChange:toggleEnabled,style:{width:18,height:18}}),
          h("span",{style:{fontWeight:600}},amen.enabled?"Activ\u00e9e":"D\u00e9sactiv\u00e9e")
        )
      ),
      amen.enabled&&h("div",{style:{marginTop:12,display:"flex",gap:14,flexWrap:"wrap",alignItems:"center",borderTop:"1px solid var(--border)",paddingTop:10}},
        h("label",{style:{fontSize:".85rem",fontWeight:600}},"Mode par d\u00e9faut\u00a0:",
          ifo("Mode appliqu\u00e9 \u00e0 toute nouvelle lacune. A = 3 propositions \u00e0 cocher. B = trou simple. C = trou + indice grammatical. Tu pourras red\u00e9finir le mode par lacune individuellement.",{below:true})),
        h("select",{value:amen.defaultMode,onChange:function(e){setDefaultMode(e.target.value)},style:{padding:"4px 10px",borderRadius:6,border:"1.5px solid var(--border)",fontFamily:"inherit"}},
          h("option",{value:"A"},"A \u2014 3 propositions \u00e0 cocher"),
          h("option",{value:"B"},"B \u2014 Trou simple (l'\u00e9l\u00e8ve \u00e9crit)"),
          h("option",{value:"C"},"C \u2014 Trou + indice grammatical")
        ),
        h("label",{style:{fontSize:".85rem",fontWeight:600}},"Note sur\u00a0:",
          ifo("Bar\u00e8me sp\u00e9cifique \u00e0 la version am\u00e9nag\u00e9e (g\u00e9n\u00e9ralement /10).",{below:true})),
        h("input",{type:"number",min:1,max:20,value:amen.base,onChange:function(e){setBase(e.target.value)},style:{width:60,padding:"4px 8px",borderRadius:6,border:"1.5px solid var(--border)",textAlign:"center"}})
      )
    ),
    // Texte avec mots sélectionnables
    amen.enabled&&h("div",{className:"card"},

            title:lac?"Cliquer pour s\u00e9lectionner / re-cliquer pour retirer":"Cliquer pour ajouter une lacune",
            onClick:function(){
              if(lac){
                if(isSel){if(confirm("Retirer la lacune sur \u00ab "+w+" \u00bb ?"))removeLacune(ti)}

    amen.enabled&&selectedLac&&h("div",{className:"card"},

        h("div",{style:{display:"flex",gap:6,flexWrap:"wrap"}},
          [["","Par d\u00e9faut"],["A","A \u2014 3 props"],["B","B \u2014 trou"],["C","C \u2014 trou+indice"]].map(function(opt){

// ═══ Génère le document HTML imprimable A4 pour la dictée aménagée ═══
function buildAmenageePapierHtml(data,amen,dicteeId){
  var tokens=data.tokens||tokenize(data.text||"");
  var defaultMode=amen.defaultMode||"A";
  var lacunes=fixLacunesIndices(amen.lacunes||[],tokens);
  var lacByIdx={};lacunes.forEach(function(l){lacByIdx[l.tokenIdx]=l});
  var consigne=amen.consigne||generateConsigne(amen);
  var subtitle=competencesSubtitle(data.competences||[]);
  var niveau=(data.niveau||"").toUpperCase();
  var matiere="FRAN\u00c7AIS";
  var headerLine=matiere+(niveau?" \u00b7 "+niveau:"")+" \u00b7 PR\u00c9PARATION \u00c0 LA DICT\u00c9E";

  function escapeHtml(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}

  // Construit le texte avec lacunes inline en respectant la règle "pas d'espace avant ponctuation"
  var notesC=[];
  var textHtml="";
  for(var ti=0;ti<tokens.length;ti++){
    var w=tokens[ti];
    var nextW=tokens[ti+1]||"";
    var sp=tokSp(w,nextW);
    var lac=lacByIdx[ti];
    if(!lac){textHtml+=escapeHtml(w)+sp;continue}
    var mode=lac.mode||defaultMode;
    if(mode==="A"){
      var p=lac.propositions||["","",""];
      // Ordre stable pseudo-aléatoire basé sur tokenIdx
      var seed=ti%3;
      var arr=[p[0],p[1],p[2]];
      var shuffled=arr.slice(seed).concat(arr.slice(0,seed));
      textHtml+='<span class="lac lac-A"><span class="props">'+
        '<span class="prop">'+escapeHtml(shuffled[0]||"")+'</span>'+
        '<span class="prop">'+escapeHtml(shuffled[1]||"")+'</span>'+
        '<span class="prop">'+escapeHtml(shuffled[2]||"")+'</span>'+
        '</span><span class="lac-line"></span></span>'+sp;
    } else if(mode==="B"){
      textHtml+='<span class="lac lac-B"><span class="lac-line"></span></span>'+sp;
    } else if(mode==="C"){
      var noteIdx=notesC.length+1;
      notesC.push({num:noteIdx,indice:lac.indice||""});
      textHtml+='<span class="lac lac-C"><span class="lac-line"></span><sup class="note-ref">('+noteIdx+')</sup></span>'+sp;
    }
  }

  var notesHtml="";
  if(notesC.length>0){
    notesHtml='<div class="notes-c"><div class="notes-c-title">Indices</div><ol>';
    notesC.forEach(function(n){
      notesHtml+='<li><strong>('+n.num+')</strong> '+escapeHtml(n.indice)+'</li>';
    });
    notesHtml+='</ol></div>';
  }

  var titre=data.title||"Dict\u00e9e";   /* [ELEVE-1 ④] le mot « aménagée » nulle part sur la feuille de l'élève (Paul, point 87) */

  return '<!DOCTYPE html>\n<html lang="fr">\n<head>\n<meta charset="UTF-8">\n'+
'<meta name="viewport" content="width=device-width,initial-scale=1">\n'+
'<title>'+escapeHtml(titre)+'</title>\n'+
'<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">\n'+
'<style>\n'+
'@page{size:A4;margin:16mm 18mm}\n'+
'*{box-sizing:border-box}\n'+
'body{font-family:"EB Garamond","Crimson Pro",Georgia,serif;max-width:780px;margin:0 auto;padding:18px 22px;color:#1f1b16;background:#faf6ee;line-height:1.55;font-size:12pt}\n'+
'.eyebrow{font-family:"EB Garamond",Georgia,serif;font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:#7a6a52;margin-bottom:4px;font-weight:500}\n'+
'.titre-h1{font-family:"EB Garamond",Georgia,serif;font-size:2.1rem;font-weight:700;letter-spacing:-.01em;color:#1f1b16;margin:0 0 6px 0;line-height:1.1}\n'+
'.sous-titre{font-family:"EB Garamond",Georgia,serif;font-size:.95rem;color:#5a4f3d;font-style:italic;margin-bottom:18px;font-weight:400}\n'+
'.fields-row{display:flex;gap:32px;margin:14px 0 22px 0;font-size:.95rem;align-items:flex-end}\n'+
'.field{display:flex;align-items:baseline;gap:8px}\n'+
'.field label{font-weight:600;color:#1f1b16;flex-shrink:0}\n'+
'.field .line{flex:1;min-width:140px;border-bottom:1px solid #8a7960;height:1.2em;display:inline-block}\n'+
'.consigne-box{background:#f0e7d4;border-radius:6px;padding:14px 18px;font-size:.95rem;color:#3d3424;line-height:1.55;margin:18px 0 24px 0;border:none}\n'+
'.consigne-box strong{font-weight:700;color:#1f1b16}\n'+
'.texte{font-size:1.05rem;line-height:2.4;text-align:left;margin-top:14px}\n'+
'.lac{display:inline-block;vertical-align:baseline;margin:0 3px;position:relative}\n'+
'.lac-line{display:inline-block;border-bottom:1.4px solid #1f1b16;min-width:92px;height:1em;vertical-align:baseline}\n'+
'.lac-A .props{display:block;text-align:center;font-size:.72em;line-height:1.2;white-space:nowrap;margin-bottom:1px;color:#3d3424}\n'+
'.lac-A .props .prop{display:block;font-style:normal}\n'+

'.lac-C .note-ref{font-size:.7em;font-weight:600;color:#5a4f3d;vertical-align:super;margin-left:2px}\n'+

'.footer{margin-top:24px;padding-top:10px;border-top:1px solid #d3c5a2;text-align:center;font-size:.7rem;color:#9b8a6e;font-family:"EB Garamond",serif;letter-spacing:.04em}\n'+
'@media print{body{background:#faf6ee;padding:0}.lac-line{border-bottom-color:#000}}\n'+
'</style>\n</head>\n<body>\n'+
'<div class="eyebrow">'+escapeHtml(headerLine)+'</div>\n'+
'<h1 class="titre-h1">'+escapeHtml(titre)+'</h1>\n'+
(subtitle?'<div class="sous-titre">'+escapeHtml(subtitle)+'</div>\n':'')+
'<div class="fields-row">'+
'<div class="field"><label>Pr\u00e9nom :</label><span class="line"></span></div>'+
'<div class="field"><label>Date :</label><span class="line" style="min-width:90px"></span></div>'+
'</div>\n'+
(consigne?'<div class="consigne-box">'+escapeHtml(consigne)+'</div>\n':'')+
'<div class="texte">'+textHtml+'</div>\n'+
notesHtml+'\n'+
'<div class="footer">'+escapeHtml(data.title||"")+'</div>\n'+   /* [ELEVE-1 ④] ni le mot, ni un identifiant technique sur la feuille de l\'élève */
'</body>\n</html>';
}

// Build a standalone HTML document for a single corrected copy (to send to families)
// ═══ HELPERS POUR EXPORT COPIES ═══
function downloadBlob(filename, content, mimeType){
  mimeType = mimeType || "text/html;charset=utf-8";
  var blob = new Blob([content], {type: mimeType});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url)}, 100);
}

// Copie robuste vers le presse-papiers avec fallback execCommand
// Retourne une Promise qui résout en true/false selon succès
function copyToClipboard(text){
  return new Promise(function(resolve){
    // Méthode 1 : Clipboard API moderne (HTTPS + permission)
    if(navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext){
      navigator.clipboard.writeText(text).then(function(){resolve(true)}, function(){
        // Si échec, on tente le fallback
        resolve(_legacyCopy(text));
      });
      return;
    }
    // Méthode 2 : fallback execCommand (toujours dispo, mais déprécié)
    resolve(_legacyCopy(text));
  });
}
function _legacyCopy(text){
  try{
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.top = "0"; ta.style.left = "0";
    ta.style.width = "1px"; ta.style.height = "1px";
    ta.style.opacity = "0";
    ta.style.pointerEvents = "none";
    ta.setAttribute("readonly", "");
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    ta.setSelectionRange(0, text.length);
    var ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch(e){
    return false;
  }
}
function sanFilename(s){
  return String(s||"")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-zA-Z0-9_-]+/g, "_")
    .replace(/^_+|_+$/g, "")
    .toLowerCase()
    .substring(0, 80) || "sans_nom";
}

/* Prevenir avant d'enregistrer une copie a moitie recopiee. Une seule saisie
   manquante fait basculer TOUTE la copie en trous numerotes (regle voulue par
   Paul : l'eleve ne doit pas croire que le professeur a fait la moitie du
   travail). Mesure du 23/09/2026 : 27 copies du hub sont dans ce cas, la
   plupart a un ou deux mots pres. */
function saisieIncomplete(errs){
  var attendent = (errs||[]).filter(function(e){
    return e && (e.type==="G" || e.type==="L");   // point 322 : seules G et L demandent ce qu'a écrit l'élève
  });
  var faites = attendent.filter(function(e){ return e.fautif && String(e.fautif).trim()!==""; });
  if (!attendent.length || !faites.length || faites.length===attendent.length) return null;
  return {total:attendent.length, faites:faites.length, manquants:attendent.length-faites.length,
          index:attendent.filter(function(e){return !(e.fautif&&String(e.fautif).trim()!=="")})
                         .map(function(e){return e.idx;})};
}
function phraseSaisieIncomplete(info, nomEleve){
  var n = info.manquants;
  return "Tu as recopi\u00e9 " + info.faites + " mots sur " + info.total +
    (nomEleve ? " pour " + nomEleve : "") + ".\n\n" +
    (n>1 ? "Les " + n + " qui manquent resteront des trous num\u00e9rot\u00e9s"
         : "Celui qui manque restera un trou num\u00e9rot\u00e9") +
    ". Et comme une copie ne m\u00e9lange pas les deux, "+
    "c'est TOUTE la copie qui s'affichera en trous : ni la copie brute, ni les mots "+
    "barr\u00e9s, ni les tirets ne seront disponibles pour cet \u00e9l\u00e8ve. "+
    "La correction verte, les types d'erreur, les points et le d\u00e9tail en bas de copie ne changent pas.\n\n"+
    "OK = finir " + (n>1 ? "les "+n+" derniers" : "le dernier") + "  \u00b7  Annuler = laisser en trous";
}
/* Applique la reservation de largeur DANS un cadre verrouille : le script
   embarque dans la copie ne peut pas s'y executer (sandbox sans allow-scripts),
   c'est donc le parent qui mesure et pose les largeurs. Meme algorithme, en deux
   passes : mesurer tout, puis appliquer tout (elargir un mot decale les suivants). */
function reserverDansCadre(cadre){
  try{
    var doc = cadre && (cadre.contentDocument || (cadre.contentWindow||{}).document);
    if(!doc || !doc.body) return;
    var mots = [].slice.call(doc.querySelectorAll(".mot.faux"));
    if(!mots.length) return;
    mots.forEach(function(m){ var b=m.querySelector(".layer-base"); if(b) b.style.minWidth=""; });
    var besoins = mots.map(function(m){
      var t=m.querySelector(".layer-top"), a=m.querySelector(".layer-after"), b=m.querySelector(".layer-base");
      if(!b) return null;
      var vis=function(e){ if(!e) return 0; var st=(cadre.contentWindow||window).getComputedStyle(e);
                           if(st.display==="none") return 0; return e.getBoundingClientRect().width; };
      return {b:b, besoin:Math.max(vis(t),vis(a)), lb:b.getBoundingClientRect().width};
    });
    besoins.forEach(function(x){ if(x && x.besoin > x.lb) x.b.style.minWidth = Math.ceil(x.besoin+8)+"px"; });
  }catch(e){}
}
function brancherReservation(cadre){
  if(!cadre) return;
  var go=function(){ reserverDansCadre(cadre); setTimeout(function(){reserverDansCadre(cadre)},120); };
  cadre.addEventListener("load", go);
  go();
}
function copieRecopiee(c){
  /* Le mode Brut montre la copie de l'eleve telle qu'il l'a rendue. Il n'a de sens
     que si le mot fautif a ete saisi pour CHAQUE erreur portant sur un mot du texte.
     Un mot manquant (M) n'en a jamais : l'eleve n'a rien ecrit a cet endroit.
     Correction en mode rapide (sans saisie) : la copie brute n'existe pas, le mode
     est indisponible plutot que mensonger. Mesure du 23/09/2026 : 10 copies sur 145
     seulement sont recopiees au hub. */
  if(!c) return false;
  var errs = toArr(c.errors||[]).filter(function(e){return e!=null});
  var besoin = errs.filter(function(e){return e.type!=="M"});
  if(!besoin.length) return true;
  return besoin.every(function(e){return e.fautif && String(e.fautif).trim()!==""});
}
function buildCopieHtml(data,eleveName,eleveKey,c,ac,dicteeId,options){
  options = options || {};
  var mode = options.mode || "barre";
  /* Filet : un mode inconnu (donnée ancienne ou de test) laissait le mot sans aucune
     règle d'affichage — la copie devenait illisible. On retombe sur le mode par défaut. */
  /* Le mode « Rien » a été retiré le 23/09/2026 : il n'avait pas d'objet.
     Le plancher de la copie, c'est le BRUT — la copie de l'élève telle qu'il
     l'a rendue. Les anciens réglages enregistrés en « rien » retombent dessus. */
  if (mode === "rien") mode = "brut";   /* mode retire le 23/09/2026 */
  if (["brut","barre","placeholder","trous","vert"].indexOf(mode) < 0) mode = "barre";
  var showOverlay = options.showOverlay !== false;
  var showBadge = options.showBadge !== false;
  var showPoints = options.showPoints !== false;
  var bilanOverride = options.bilanOverride;
  var exercicesUrl = options.exercicesUrl || "";
  var dueDate = options.dueDate || "";

  var code = dicteeId+"-"+eleveKey;
  var errors = toArr(c.errors||[]).filter(function(e){return e!=null});
  var extras = toArr(c.extras||[]).filter(function(e){return e!=null});
  var bilan = (bilanOverride !== undefined) ? bilanOverride : (c.bilanComment || generateBilan(c, data.base, data.bareme));
  var tokens = data.tokens || tokenize(data.text||"");
  /* L'idx enregistré fait foi tel quel : les positions des dictées anciennes
     sont corrigées DANS LES DONNÉES (réinjection des snapshots corrigés),
     pas compensées dans le code — décision de Paul, 09/08/2026. */
  var errMap = {}; errors.forEach(function(e, i){ if (e && e.idx != null) errMap[e.idx] = {e: e, i: i}; });
  var extraMap = {}; extras.forEach(function(e){if(!extraMap[e.afterIdx])extraMap[e.afterIdx]=[];extraMap[e.afterIdx].push(e)});

  // ── Trous numérotés ──
  // Quand le professeur n'a pas saisi ce que l'élève a écrit (mode de correction
  // rapide — un choix voulu, qu'on accompagne), la copie ne révèle RIEN : ni le
  // mot correct, ni un pseudo-essai tiré de l'autocorrection. À la place : un
  // espace pointillé numéroté (1, 2, 3… dans l'ordre du texte). Le numéro est un
  // point d'accroche : M16 y branchera, en bas de copie, la question qui guide
  // l'élève — pas la réponse. Ne rien coder d'autre ici que la numérotation.
  /* ── DECIDER CE QUI OCCUPE LA PLACE DU MOT (refonte du 23/09/2026) ──
     Avant, trois autorites se disputaient l'affichage : le HTML decidait quelles
     couches exister, le CSS du mode decidait lesquelles montrer, et le trou
     numerote passait par-dessus les deux. Resultat mesure : sur 145 copies
     reelles, les quatre modes rendaient la meme chose des que la correction
     avait ete faite en mode rapide. Desormais une seule fonction repond a une
     seule question : dans ce mode, qu'est-ce qui occupe la ligne ?
       "orig"        le mot de l'eleve, tel qu'il l'a ecrit
       "trou"        un espace pointille numerote, a completer
       "placeholder" des tirets de la longueur du mot
       "vert"        le mot correct
     Regle du mixte, voulue par Paul : si UNE SEULE erreur attend une saisie qui
     manque, TOUTE la copie passe en trous. L'eleve ne doit pas croire que le
     professeur a fait la moitie du travail ; corriger en ne pointant que les
     fautes recurrentes est un choix pedagogique, pas un travail inacheve. */
  /* point 322 : seules G et L attendent la forme écrite ; A et I sans forme ont leur propre rendu */
  function attendSaisie(e){ return e.type === "G" || e.type === "L"; }
  /* Repetitions non facturees (bareme type brevet) : l'eleve doit VOIR qu'il a
     refait la meme faute — sinon il croit que la seconde est juste — mais elle
     ne lui est comptee qu'une fois. Il devra quand meme la corriger a chaque
     occurrence en autocorrection, pour memoriser l'orthographe. */
  var errsCoutL11 = errors.filter(function(e){return e && !e.sansCout;});   /* [L11] les répétitions comme computeNote : sans les formes acceptées */
  var repeteesIdx = (data.bareme === "brevet") ? bonusRepetitions(errsCoutL11).map(function(i){return errors.indexOf(errsCoutL11[i]);}) : [];
  function estRepetee(e){ var i = errors.indexOf(e); return i >= 0 && repeteesIdx.indexOf(i) >= 0; }
  var copieRecopieeIci = errors.every(function(e){
    return !attendSaisie(e) || (e.fautif && String(e.fautif).trim() !== "");
  });

       elisions oublies. Sinon l'eleve lit la reponse la ou il devrait chercher

    if (modeEffectif === "trous") return "trou";

       jamais (mot oublie, ponctuation oubliee, elision oubliee) montrent la

       qui s'y accroche part en l'air (mesure : 227 annotations flottantes). */
    if (!attendSaisie(e) && e.type !== "A" && e.type !== "I") return "vert";

  // L'historique d'autocorrection n'est plus une source : son dernier essai est

  // trouve) — le présenter comme « ce que l'élève a écrit » était faux, et
  // révélait la réponse. Sans fautif : on ne prétend pas savoir (→ trou numéroté).

                                           : {G:"−1", L:"−0,5", M:"−1", P:"−0,5", I:"−1", A:"", E:"−0,5"};

  for (var ti = 0; ti < tokens.length; ti++) {

    // Espacement : un espace AVANT le mot en trop (les espaces HTML successifs
    // s'effondrent), et après lui la règle française normale (rien devant une
    // ponctuation) — fini le « soufflealors . » collé puis troué.
    if (extraMap[ti-1]) {
      extraMap[ti-1].forEach(function(ex){
        textHtml += ' <span class="mot extra-w"><span class="layer-base"><span class="extra-orig">'+escapeHtml(ex.word)+'</span></span><span class="layer-after"><span class="badge badge-extra">+</span><span class="points-perdus">−0,5</span></span></span>' + tokSp(ex.word, w);

    var sp = tokSp(w, nextW);

    function estCase(idx){

    var ev = em.e;
    var errIdx = em.i;

    var disp = displayTranscript(ev, errIdx);
    var origText = (disp && disp.text) ? disp.text : "";  // mode brut = exactement ce que l'élève a écrit ; si pas connu, rien
    // point 322 : « Attention graphie » sans forme = le mot tel que l'élève l'a écrit (juste) ; « Illisible » sans forme = illisible
    var sansForme = !(disp && disp.text);
    if (sansForme && ev.type === "A") origText = ev.word;

    var numTrou = trouParErr[errIdx];

    var baseHtml = '';
    var topHtml = '';
    if (quoi === "trou") {

      baseHtml = '<span class="num-trou">' + numTrou + '</span>' +
                 '<span class="trou"></span>';
    } else if (quoi === "vert") {
      baseHtml = '<span class="vert-ligne">' + escapeHtml(correctText) + '</span>';
    } else if (quoi === "placeholder") {

    } else {

                                                : '<span class="orig">' + escapeHtml(origText) + '</span>';

    }
    var estRep = estRepetee(ev);
    var afterHtml = '<span class="badge">' + ev.type + '</span>' +
                    (ev.sansCout ? '<span class="points-perdus forme-acc" style="background:#e6f4ec;color:#1e6042">forme accept\u00e9e</span>' :   /* [L11] la mention remplace le coût */
                     estRep ? '<span class="deja-compte" title="Tu as d\u00e9j\u00e0 fait cette faute sur ce mot : elle n\u2019est compt\u00e9e qu\u2019une fois.">d\u00e9j\u00e0 compt\u00e9</span>'
                            : (POINTS[ev.type] ? '<span class="points-perdus">' + POINTS[ev.type] + '</span>' : ''));

    if (estRep) aDataAttr += ' data-repetee="1"';
    var trouAttr = numTrou ? ' data-trou="' + numTrou + '"' : '';

    textHtml += '<span class="mot faux' + (numTrou ? ' sans-fautif' : '') + (estRep ? ' repetee' : '') + ' ' + typeClass + '"' + aDataAttr + trouAttr + '>' +
                '<span class="layer-base">' + baseHtml + '</span>' +
                (topHtml ? '<span class="layer-top">' + topHtml + '</span>' : '') +

  if (extraMap[tokens.length-1]) {
    extraMap[tokens.length-1].forEach(function(ex){

    });

  // Analyse détaillée par erreur (sous le texte)
  var analyseHtml = "";
  errors.forEach(function(err, i) {
    if (!err) return;
    var lab = typeLibelle(err.type);
    var disp = displayTranscript(err, i);
    var numTrou = trouParErr[i];
    var transcriptHtml = "";
    if (disp) {
      transcriptHtml = '<div class="err-trans"><span class="wrong-inline">« '+escapeHtml(disp.text)+' »</span> → <strong>'+escapeHtml(err.word)+'</strong></div>';
    }

       c'est-à-dire presque toujours le mot juste : c'était faux et révélateur.) */
    var comment = gramComment(err);
    var ptStr = POINTS[err.type] ? ' <span class="err-points">'+POINTS[err.type]+' pt</span>' : '';
    /* Repetition : on le dit en clair, avec la regle, et on retire le cout. */
    var nFoisMot = errors.filter(function(x){return x && String(x.word||"").toLowerCase()===String(err.word||"").toLowerCase() && x.type===err.type}).length;
    if (err.sansCout) {   /* [L11] */
      ptStr = ' <span class="err-points" style="background:#e6f4ec;color:#1e6042">forme accept\u00e9e</span>';
    } else if (estRepetee(err)) {
      ptStr = ' <span class="err-points" style="background:#f0e9d8;color:#6b5d3f">d\u00e9j\u00e0 compt\u00e9</span>';
      comment = 'Tu as \u00e9crit ' + nFoisMot + ' fois ce mot avec la m\u00eame faute. Je ne l\u2019ai compt\u00e9e qu\u2019une fois, comme au brevet \u2014 mais tu dois quand m\u00eame la corriger \u00e0 chaque fois, pour que tu m\u00e9morises l\u2019orthographe. ' + comment;

    // texte). Dans une copie qui contient des trous, les autres erreurs prennent
    // une puce neutre : leur rang de liste (1, 2, 3…) entrerait en collision
    // avec les numéros de trous — deux « 3 » différents dans la même liste.
    // Copie sans trou : rang i+1, comme avant. data-trou : accroche M16.
    var numHtml = numTrou
      ? '<span class="err-num err-num-trou">'+numTrou+'</span>'
      : (nTrous > 0 ? '<span class="err-num">·</span>'
                    : '<span class="err-num">'+(i+1)+'</span>');
    analyseHtml += '<div class="err-item err-'+err.type.toLowerCase()+'"'+(numTrou?' data-trou="'+numTrou+'"':'')+'>' +
      '<div class="err-head">'+numHtml +
      '<span class="err-word">« '+escapeHtml(err.word)+' »</span>' +
      '<span class="err-type">'+lab+'</span>' + ptStr + '</div>' +
      transcriptHtml +

      '</div>';

  // Extras dans l'analyse
  extras.forEach(function(ex, i) {
    analyseHtml += '<div class="err-item err-extra">' +
      '<div class="err-head"><span class="err-num">+</span>' +
      '<span class="err-word">« '+escapeHtml(ex.word)+' »</span>' +
      '<span class="err-type">Mot en trop</span> <span class="err-points">−0,5 pt</span></div>' +
      '</div>';
  });

  // Classes du body selon les options (figées)
  var bodyClasses = "mode-" + mode;
  if (showOverlay) bodyClasses += " show-overlay";
  if (showBadge) bodyClasses += " show-badge";
  if (showPoints) bodyClasses += " show-points";

  var classeLib = data.classe || "";
  var tsVu = (data && data.dateCorrection) ? dateCorrectionTs(data.dateCorrection) : c.timestamp;   /* [L9] la date réglée pour toute la dictée, sinon le jour réel */
  var dateStr = tsVu ? new Date(tsVu).toLocaleDateString("fr-FR") : "";

  return '<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">' +
    '<title>Copie corrigée — '+escapeHtml(eleveName)+'</title>' +
    '<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">' +
    '<style>' +
    '*{box-sizing:border-box}' +
    'body{margin:0;font-family:"EB Garamond",Georgia,serif;background:#faf6ee;color:#2a2a2a;padding:0}' +
    '.copie{max-width:1180px;margin:30px auto;background:#fff;border:1px solid #d4cbb8;border-radius:6px;padding:36px 52px 48px;box-shadow:0 6px 24px rgba(0,0,0,.08)}' +
    '.copie-header{border-bottom:1.5px solid #6b5d3f;padding-bottom:14px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:flex-end;font-family:system-ui,sans-serif}' +
    '.copie-header .name{font-size:1.3rem;font-weight:600}' +
    '.copie-header .meta{font-size:.78rem;color:#8a7a5a;text-align:right;line-height:1.4}' +
    '.copie-title{font-family:"EB Garamond",serif;font-size:1.5rem;text-align:center;margin:22px 0 26px;font-style:italic;color:#4a3a1f}' +
    '.texte{font-size:1.2rem;line-height:3.4;text-align:justify;padding:18px 0}' +
    /* Architecture des mots — réparée 08/2026 : le mot correct AU-DESSUS (layer-top),
       le mot de l'élève barré DESSOUS (layer-base), le type et les points SOUS le mot
       (layer-after, en position absolue) — aucune annotation n'entre dans le flux du texte.
       Les règles de masquage et de badges couvrent aussi les mots en trop (.extra-w),
       qui n'ont pas la classe .faux : c'est par là que badges et points fuyaient en clair. */
    '.mot{position:relative;display:inline-block;vertical-align:baseline;white-space:nowrap;margin-right:2px;line-height:1.2}' +
    '.mot .layer-top>span,.mot .layer-after>span{display:none}' +
    /* La couche de base ne contient plus que ce qui doit s'afficher :
       la decision est prise une seule fois a la generation (voir occupant()). */
    '.mot .layer-base .orig,.mot .layer-base .trou,.mot .layer-base .num-trou,.mot .layer-base .placeholder,.mot .layer-base .vert-ligne{display:inline-block}' +
    '.mot .layer-base{display:inline-block;min-width:.5em}' +
    '.mot .layer-top{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + .1em);font-family:"EB Garamond",serif;font-size:.72em;line-height:1;pointer-events:none;white-space:nowrap;max-width:none;overflow:visible}' +
    '.mot .layer-after{position:absolute;left:50%;transform:translateX(-50%);top:calc(100% + .12em);line-height:1;pointer-events:none;white-space:nowrap}' +
    /* ── RÉSERVATION DE LARGEUR (09/2026) ──
       Les couches du dessus et du dessous sont posées en absolu : largeur nulle
       dans le flux, donc deux corrections voisines se recouvrent (mesuré : 17
       chevauchements sur deux copies réelles, jusqu'à 40 px). La couche de base
       devient un bloc en ligne dont la largeur minimale est fixée après mise en
       page (voir le script en bas de copie) : le mot pousse ses voisins au lieu
       de les laisser se superposer. Les couches restent centrées comme avant. */
    '.mot .layer-base{display:inline-block;text-align:center}' +
    /* ── DÉROGATION MOTS MANQUANTS ──

       vide et se soudait à la voisine (« l' » + « argent » se lisaient « l'argent »).
       Le mot correct s'écrit désormais À SA PLACE dans la phrase, en vert gras :
       la phrase se lit d'un trait et le mot occupe enfin sa vraie largeur. */

    /* (la derogation des mots oublies est desormais portee par occupant()) */

    'body.mode-barre .mot.faux .layer-base .orig{padding:1px 4px;border-radius:4px;margin:0 1px}' +
    TYPE_ORDRE.map(function(t){return 'body.mode-barre .mot.faux.type-'+t+' .layer-base .orig{background:'+typeRgba(t,.07)+'}'}).join('') +
    /* Modes radio (un seul actif) */
    'body.mode-rien .mot.faux .layer-base::before{content:"·";color:#c8bda3}' +
    'body.mode-barre .mot.faux .layer-base .orig{text-decoration:line-through;text-decoration-thickness:2px}' +
    /* mode barre : les 8 types (il manquait M, P, E, A — mot barre sans couleur) */
    TYPE_ORDRE.map(function(t){var c=typeCouleur(t);return 'body.mode-barre .mot.faux.type-'+t+' .layer-base .orig{color:'+c+';text-decoration-color:'+c+'}'}).join('') +
        /* Toggle overlay : correction verte AU-DESSUS du mot, dans tous les modes sauf vert direct */
    'body.show-overlay .mot.faux .layer-top .vert-top{display:inline}' +
    /* Toggle badge (extras compris) */
    'body.show-badge .mot .layer-after .badge{display:inline-block}' +
    '.mot .badge{font-family:system-ui,sans-serif;font-size:.62em;font-weight:700;padding:1px 4px;border-radius:3px;line-height:1}' +
    /* badges de type : derives de TYPE_STYLE, les 8 types couverts (A comprise) */
    TYPE_ORDRE.map(function(t){return '.mot.faux.type-'+t+' .badge{background:'+typeFond(t)+';color:'+typeCouleur(t)+'}'}).join('') +
    '.mot .badge-extra{background:'+typeFond("X")+';color:'+typeCouleur("X")+'}' +
    /* Toggle points perdus (extras compris) */
    'body.show-points .mot .layer-after .points-perdus{display:inline-block}' +
    '.mot .points-perdus{font-family:system-ui,sans-serif;font-size:.62em;font-weight:700;padding:1px 4px;border-radius:3px;margin-left:2px;line-height:1;background:#fef0f0;color:#9b2c2c;border:1px solid #f5d4d4}' +
    '.mot[data-att="1"] .points-perdus{display:none !important}' +
    /* Apparence verts */
    '.mot.faux .vert-ligne,.mot.faux .vert,.mot.faux .vert-top{color:#2d8659;font-weight:600;font-style:italic}' +
    /* Mot oublie ecrit a sa place dans la phrase, en vert gras : la phrase se lit
       d'un trait et le mot occupe enfin sa vraie largeur (demande de Paul). */
    '.mot.faux.type-M .layer-base .vert-ligne{font-weight:700;background:' + typeRgba('M', .10) + ';padding:0 5px;border-radius:3px}' +
    '.mot.faux.type-M .layer-base .vert-ligne{color:#276749}' +
    /* Placeholder */
    '.mot.faux .placeholder{border-bottom:1.5px solid #8a7a5a;min-width:60px;height:1.1em;vertical-align:-2px}' +
    /* Cas spéciaux M (mot manquant) : l'élève n'a rien écrit → RIEN dans la base en modes
       barré/brut/placeholder/rien (la correction passe par le mode vert ou la sur-impression). */
    '.mot.faux.type-M .orig{display:none !important}' +
    
    'body.show-overlay.mode-barre .mot.faux.type-M .layer-top .vert-top,body.show-overlay.mode-brut .mot.faux.type-M .layer-top .vert-top,body.show-overlay.mode-placeholder .mot.faux.type-M .layer-top .vert-top,body.show-overlay.mode-rien .mot.faux.type-M .layer-top .vert-top{background:rgba(151,90,22,.12);padding:0 4px;border-radius:3px}' +
    /* Cas spéciaux P (ponctuation) : l'élève n'a rien écrit → RIEN dans la base en modes

    '<script>(function(){function reserver(){' +
    'var mots=[].slice.call(document.querySelectorAll(".mot.faux"));' +
    /* Deux passes obligatoires : élargir un mot décale tous les suivants, donc
       mesurer et écrire dans la même boucle donne des largeurs fausses (mesuré :

    'mots.forEach(function(m){var b=m.querySelector(".layer-base");if(b)b.style.minWidth="";});' +

}
function Copies(p){
  var data=p.data,corr=p.corrections||{},abs=p.absents||{},dicteeId=p.dicteeId;
  // Point 40 : les exercices s'ouvrent et se ferment dans le panneau de la dictée (✏️), et nulle part ailleurs.
  var sExO=useState(false),exOuverts=sExO[0],setExOuverts=sExO[1];
  useEffect(function(){var r=db.ref("correction_dictee/"+dicteeId+"/config/exercicesOuverts");function f(sn){setExOuverts(sn.val()===true)}r.on("value",f);return function(){r.off("value",f)}},[dicteeId]);
  var done=sortElevesByNom(data.eleves.filter(function(e){var k=san(e);return !abs[k]&&!!corr[k]}));
  var sQc=useState(""),copQuery=sQc[0],setCopQuery=sQc[1];
  var doneFiltered=copQuery.trim()?done.filter(function(e){return matchEleveInitials(e,copQuery)}):done;
  var s0=useState(null),selectedKey=s0[0],setSelectedKey=s0[1];
  var s1=useState(""),bilanText=s1[0],setBilanText=s1[1];
  var s2=useState(false),bilanDirty=s2[0],setBilanDirty=s2[1];
  var s3=useState(false),editMode=s3[0],setEditMode=s3[1];
  var s4=useState(0),editIdx=s4[0],setEditIdx=s4[1];
  var s5=useState(""),editVal=s5[0],setEditVal=s5[1];
  var s6=useState({}),autoCorr=s6[0],setAutoCorr=s6[1];
  var sOpt=useState(getCopyOptions()),copyOpts=sOpt[0],_setCopyOpts=sOpt[1];
  function updCopyOpts(patch){
    var no=Object.assign({},copyOpts,patch);
    _setCopyOpts(no);setCopyOptions(no);
    // Auto-sync vers Firebase si la copie a déjà été publiée (pas besoin de re-cliquer Publier)
    if(copyPublishedAt){
      var opts={
        mode:no.mode, showOverlay:no.showOverlay, showBadge:no.showBadge, showPoints:no.showPoints,
        dueDate:no.dueDate||"", linkExercices:exOuverts,
        appUrl:no.appUrl||DEFAULT_APP_URL
      };
      db.ref("correction_dictee/"+dicteeId+"/copyOptions").set(opts);
    }
  }
  // Aperçu défilant de toutes les copies (modal)
  var sPv=useState(false),previewOpen=sPv[0],setPreviewOpen=sPv[1];
  var sPvI=useState(0),previewIdx=sPvI[0],setPreviewIdx=sPvI[1];
  // Détection : la dictée a-t-elle des exercices (JSON injecté OU HTML uploadé) ?
  // → on affiche le lien dans la copie dans les deux cas
  var sHasJ=useState(false),hasJson=sHasJ[0],setHasJson=sHasJ[1];
  var sHasH=useState(false),hasHtml=sHasH[0],setHasHtml=sHasH[1];
  var hasExercices=hasJson||hasHtml;
  // État de publication (lien partagé pour École Directe)
  var sPub=useState(null),copyPublishedAt=sPub[0],setCopyPublishedAt=sPub[1];
  var sPubMsg=useState(""),pubMsg=sPubMsg[0],setPubMsg=sPubMsg[1];
  React.useEffect(function(){
    var ref=db.ref("correction_dictee/"+dicteeId+"/exercices");
    function onData(snap){setHasJson(!!snap.val())}
    ref.on("value",onData);
    var refH=db.ref("correction_dictee/"+dicteeId+"/exercices_html");
    function onDataH(snap){setHasHtml(!!(snap.val()&&snap.val().content))}
    refH.on("value",onDataH);
    var refP=db.ref("correction_dictee/"+dicteeId+"/copyPublishedAt");
    function onDataP(snap){setCopyPublishedAt(snap.val()||null)}
    refP.on("value",onDataP);
    return function(){ref.off("value",onData);refH.off("value",onDataH);refP.off("value",onDataP)};
  },[dicteeId]);

  // Publication : sauvegarde des options actuelles côté Firebase
  function publierCopies(){
    // Garde du 29/09 : un élève présent sans copie corrigée est signalé avant de rendre les copies
    var sansCopie=(data.eleves||[]).filter(function(n){var k=san(n);return !abs[k]&&!corr[k]});
    if(sansCopie.length&&!confirm("\u26a0 "+sansCopie.length+" \u00e9l\u00e8ve"+(sansCopie.length>1?"s pr\u00e9sents n\u2019ont":" pr\u00e9sent n\u2019a")+" pas de copie corrig\u00e9e : "+sansCopie.join(", ")+".\n\nS\u2019il"+(sansCopie.length>1?"s \u00e9taient absents, cochez-les absents":" \u00e9tait absent, cochez-le absent")+" ; sinon, corrigez "+(sansCopie.length>1?"leurs copies":"sa copie")+" d\u2019abord.\n\nRendre les copies quand m\u00eame ?"))return;
    var opts={
      mode:copyOpts.mode,
      showOverlay:copyOpts.showOverlay,
      showBadge:copyOpts.showBadge,
      showPoints:copyOpts.showPoints,
      dueDate:copyOpts.dueDate||"",
      linkExercices:exOuverts,
      appUrl:copyOpts.appUrl||DEFAULT_APP_URL
    };
    db.ref("correction_dictee/"+dicteeId+"/copyOptions").set(opts).then(function(){
      db.ref("correction_dictee/"+dicteeId+"/copyPublishedAt").set(Date.now());
      setPubMsg("\u2705 Copies publi\u00e9es. Les \u00e9l\u00e8ves peuvent acc\u00e9der \u00e0 leur copie via le lien.");

  }

  function depublierCopies(){
    if(!confirm("Masquer les copies ? Les \u00e9l\u00e8ves ne pourront plus acc\u00e9der \u00e0 leur copie via le lien partag\u00e9."))return;
    db.ref("correction_dictee/"+dicteeId+"/copyPublishedAt").remove();
    setPubMsg("\u2705 Copies masqu\u00e9es");

    var baseUrl=(copyOpts.appUrl&&copyOpts.appUrl.trim())?copyOpts.appUrl.trim():DEFAULT_APP_URL;
    var url=baseUrl+"?mode=eleve&dicteeId="+encodeURIComponent(dicteeId)+"&screen=copie";

      if(ok)setPubMsg("\u2705 Lien copi\u00e9 \u2014 colle-le dans \u00c9cole Directe");

      setTimeout(function(){setPubMsg("")},5000);

  }
  var editInputRef=React.useRef(null);

  // Raccourcis clavier dans la modale d'aperçu (flèches ← → et Échap)
  React.useEffect(function(){
    if(!previewOpen)return;
    function onKey(e){
      var t=e.target&&e.target.tagName;
      if(t==="INPUT"||t==="TEXTAREA")return;
      if(e.key==="ArrowRight"){e.preventDefault();setPreviewIdx(function(i){return Math.min(i+1,done.length-1)})}
      else if(e.key==="ArrowLeft"){e.preventDefault();setPreviewIdx(function(i){return Math.max(i-1,0)})}

    window.addEventListener("keydown",onKey);
    return function(){window.removeEventListener("keydown",onKey)};
  },[previewOpen,done.length]);

  // Load autoCorr from Firebase (once + live updates if prof switches around)
  useEffect(function(){
    var ref=db.ref("correction_dictee/"+dicteeId+"/autocorrection");
    function onData(snap){setAutoCorr(snap.val()||{})}
    ref.on("value",onData);
    return function(){ref.off("value",onData)};
  },[dicteeId]);

  // Load bilan when selection changes
  React.useEffect(function(){
    if(!selectedKey){setBilanText("");setBilanDirty(false);return}
    var c=corr[selectedKey];
    if(!c){setBilanText("");return}
    if(c.bilanComment){setBilanText(c.bilanComment);setBilanDirty(false)}
    else{setBilanText(generateBilan(c,data.base,data.bareme));setBilanDirty(true)}
  },[selectedKey]);

  // Edit queue: G/L/I errors without fautif
  function getEditQueue(){
    if(!selectedKey)return[];
    var c=corr[selectedKey];
    if(!c||!c.errors)return[];
    var arr=toArr(c.errors);
    var queue=[];
    arr.forEach(function(e,i){
      if(e&&(e.type==="G"||e.type==="L"||e.type==="I")&&!e.fautif)queue.push({err:e,realIdx:i});
    });
    return queue;
  }

  React.useEffect(function(){
    if(editMode&&editInputRef.current)editInputRef.current.focus();
  },[editMode,editIdx]);

  function saveBilan(){
    if(!selectedKey)return;
    db.ref("correction_dictee/"+dicteeId+"/results/"+selectedKey+"/bilanComment").set(bilanText);
    setBilanDirty(false);
  }

  function saveFautif(realIdx,fautifValue){
    var c=corr[selectedKey];
    if(!c||!c.errors)return;
    var arr=toArr(c.errors);
    var newErrs=arr.map(function(e,i){
      if(i!==realIdx)return e;

    if(p.onLocalUpdate)p.onLocalUpdate(selectedKey,Object.assign({},c,{errors:newErrs}));
  }

  // Construit le HTML d'une copie selon les options actuelles
  function buildHtmlFor(eleveKey, useLocalBilan){
    var c=corr[eleveKey];

    var acData=autoCorr[eleveKey];

    for(var i=0;i<data.eleves.length;i++){if(san(data.eleves[i])===eleveKey){eleveName=data.eleves[i];break}}
    var opts=Object.assign({},copyOpts);
    // Si on est sur l'élève sélectionné et qu'on demande le bilan local non validé, on l'utilise
    if(useLocalBilan&&eleveKey===selectedKey)opts.bilanOverride=bilanText;
    // Lien vers la page d'exercices (auto-login via params URL) si la dictée a des exercices
    // ET si le prof n'a pas désactivé la liaison.
    if(hasExercices&&exOuverts){

  function exportZip(){

    function build(){

      done.forEach(function(e){

      zip.generateAsync({type:"blob"}).then(function(blob){

// M6bis — Résolution d'une classe du registre insensible à la casse et aux accents.
// (Découverte au test réel : /classes porte "4E BANKSY", les dictées "4e Banksy".)
function classeDuRegistre(nom,source){
  var reg=source||CLASSES||{};
  if(!nom) return undefined;
  if(reg[nom]) return reg[nom];
  var cible=sanMJPC(nom), ks=Object.keys(reg);
  for(var i=0;i<ks.length;i++){ if(sanMJPC(ks[i])===cible) return reg[ks[i]]; }
  return undefined;
}

// M-TEST — Chemin de suppression EXTRAIT tel quel du bouton de l'accueil
// (déplacement, pas réécriture) : le bac à sable doit pouvoir éprouver la
// corbeille sans qu'on en recopie la logique ailleurs.
/* Garde du 29/09 (une copie effacée sans trace) : toute copie effacée — réinitialiser,
   transférer, remplacer, échanger — part D'ABORD dans la corbeille MJPC, rangée comme la suppression
   d'une dictée (corbeille/<jour>/effacement-copie_<heure>_<élève>). Si l'archivage échoue, rien n'est effacé.
   Un index dans la dictée (effacees/<élève>/<date>) permet de la restaurer depuis l'écran de correction. */
function archiverCopies(dicteeId,titre,geste,cles,suite){
  var now=new Date();var an=(now.getMonth()<7)?((now.getFullYear()-1)+"-"+now.getFullYear()):(now.getFullYear()+"-"+(now.getFullYear()+1));
  var jour=now.toISOString().slice(0,10);var hhmmss=("0"+now.getHours()).slice(-2)+("0"+now.getMinutes()).slice(-2)+("0"+now.getSeconds()).slice(-2);
  var base="correction_dictee/"+dicteeId;
  Promise.all(cles.map(function(k){return Promise.all([db.ref(base+"/results/"+k).once("value"),db.ref(base+"/autocorrection/"+k).once("value")]).then(function(v){return {k:k,results:v[0].val(),autocorrection:v[1].val()}})}))
  .then(function(lots){
    return Promise.all(lots.filter(function(l){return l.results||l.autocorrection}).map(function(l){
      var chemin="corbeille/"+jour+"/effacement-copie_"+hhmmss+"_"+l.k,le=Date.now();
      return db.ref(chemin).set({_meta:{motif:"effacement-copie",geste:geste,annee:an,source:"correction_dictee",dictee:dicteeId,titre:titre||"",cle:l.k,le:le},data:{results:l.results,autocorrection:l.autocorrection}})
        .then(function(){if(l.results)return db.ref(base+"/effacees/"+l.k+"/"+le).set({chemin:chemin,geste:geste,le:le,note:l.results.note==null?null:l.results.note})});
    }));
  })
  .then(function(){suite()})
  .catch(function(err){alert("L\u2019archivage dans la corbeille a \u00e9chou\u00e9 : rien n\u2019a \u00e9t\u00e9 effac\u00e9.\n\n"+((err&&err.message)||err))});
}
var GESTES_EFFACEMENT={reinitialiser:"R\u00e9initialiser",transferer:"Transf\u00e9rer",remplacer:"Remplacer",echanger:"\u00c9changer"};
/* [MICRO 6.6.2 — dette n°12 · 92] LA DUPLICATION EST TOTALE : tous les réglages de la dictée, jamais l'état des élèves.
   Avant : seul /config partait dans la copie ; la version aménagée (dictee/amenagee), les options de copie et les exercices
   restaient derrière (Paul, 01/10 : « il faut que la duplication soit totale »). */
var DUP_REGLAGES=["config","dictee","copyOptions","exercices","exercices_html","binomes","heure"];
var DUP_ETAT_ELEVES=["results","absents","amenages","autocorrection","effacees","exercices_results","exercices_consultes","exercices_imprimes","copyPublishedAt"];
function dupliquerDicteeEntiere(d,cb){
  db.ref("correction_dictee/"+d.id).once("value",function(snap){
    var v=snap.val()||{},cfg=v.config;
    if(!cfg){alert("Config introuvable.");return}
    var copie={},pris=[];
    DUP_REGLAGES.forEach(function(n){ if(v[n]!==undefined&&v[n]!==null){ copie[n]=JSON.parse(JSON.stringify(v[n])); pris.push(n); } });
    copie.config=Object.assign({},cfg,{title:"Copie de "+(cfg.title||d.title),published:false});
    var newId=d.id+"_copie_"+Date.now();
    db.ref("correction_dictee/"+newId).set(copie,function(err){
      if(err){alert("Erreur: "+err.message);return}
      var am=copie.dictee&&copie.dictee.amenagee&&copie.dictee.amenagee.enabled;
      alert("Dictée dupliquée : "+copie.config.title+" ("+pris.length+" réglage"+(pris.length>1?"s":"")+" copié"+(pris.length>1?"s":"")+(am?", version aménagée comprise":"")+" ; aucune copie d’élève). Réaffecte-la à une classe via le crayon si besoin.");
      if(cb)cb();
    });
  });
}
function supprimerDicteeAvecCorbeille(d, onDone){
  if(!confirm("Supprimer "+d.title+" ?\n\nElle sera archiv\u00e9e dans la corbeille MJPC (r\u00e9cup\u00e9rable un an) et un export JSON sera t\u00e9l\u00e9charg\u00e9.\n\nContinuer ?"))return;db.ref("correction_dictee/"+d.id).once("value",function(snap){var data=snap.val();if(!data){alert("Cette dict\u00e9e est d\u00e9j\u00e0 vide.");return}var payload={_meta:{source:"correction_dictee/"+d.id,exportedAt:new Date().toISOString(),exportedBy:"suppression_auto",version:1},data:data};/* ceinture 1 : le fichier local, immediat et hors ligne */try{var blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download="dictee_"+d.id+"_"+new Date().toISOString().slice(0,10)+".json";a.click();URL.revokeObjectURL(url)}catch(err){}/* ceinture 2 : la corbeille du hub, meme convention que la console MJPC */var now=new Date();var an=(now.getMonth()<7)?((now.getFullYear()-1)+"-"+now.getFullYear()):(now.getFullYear()+"-"+(now.getFullYear()+1));var jour=now.toISOString().slice(0,10);var hhmmss=("0"+now.getHours()).slice(-2)+("0"+now.getMinutes()).slice(-2)+("0"+now.getSeconds()).slice(-2);var chemin="corbeille/"+jour+"/suppression-dictee_"+hhmmss;db.ref(chemin).set({_meta:{motif:"suppression-dictee",annee:an,source:"correction_dictee",dictee:d.id,titre:d.title,le:Date.now()},data:data}).then(function(){return db.ref("correction_dictee/"+d.id).remove()}).then(function(){if(typeof onDone==="function")onDone()}).catch(function(err){if(confirm("L\u2019archivage dans la corbeille MJPC a \u00e9chou\u00e9 ("+(err&&err.message||"raison inconnue")+").\n\nL\u2019export JSON, lui, est bien t\u00e9l\u00e9charg\u00e9.\n\nSupprimer quand m\u00eame ?")){db.ref("correction_dictee/"+d.id).remove().then(function(){if(typeof onDone==="function")onDone()})}});})
}
